name: Ponte temporaria de assinatura Android

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ephemeral-signing-bridge.yml

permissions:
  contents: read
  actions: read

# Segunda ponte efemera para concluir a publicacao 1.0.5.
jobs:
  gerar-ponte:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar chave RSA temporaria
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bridge"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/bridge/private.pem"
          openssl req -new -x509 -key "$RUNNER_TEMP/bridge/private.pem" -out "$RUNNER_TEMP/bridge/public-cert.pem" -days 1 -subj '/CN=Santa Luzia Ephemeral Signing Bridge'
          chmod 600 "$RUNNER_TEMP/bridge/private.pem"
      - name: Guardar certificado publico
        uses: actions/upload-artifact@v4
        with:
          name: bridge-public-cert
          path: ${{ runner.temp }}/bridge/public-cert.pem
          retention-days: 1
          if-no-files-found: error
      - name: Guardar chave privada temporaria
        uses: actions/upload-artifact@v4
        with:
          name: bridge-private-key
          path: ${{ runner.temp }}/bridge/private.pem
          retention-days: 1
          if-no-files-found: error
