name: Android — Santa Luzia Motion Beta 18 Final

on:
  push:
    branches:
      - build/motion-beta18-final-apk
    paths:
      - .github/workflows/build-motion-beta18-resigned.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: santa-luzia-motion-beta18-final-key-v1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SANTA_LUZIA_MOTION_BETA: "1"
      AUTH_SECRET: ci-motion-beta18-final-santa-luzia-12345678901234567890
      APP_VERSION_CODE: "20018"
      APP_VERSION_NAME: "2.0.0-beta.18"
      MOTION_APP_ID: br.com.comunidadesantaluzia.motionbeta
      MOTION_BETA_KEYSTORE: /home/runner/.android/santa-luzia-motion-beta18-final.keystore
      MOTION_BETA_STORE_PASSWORD: android
      MOTION_BETA_KEY_ALIAS: santa-luzia-motion-beta18-final
      MOTION_BETA_KEY_PASSWORD: android

    steps:
      - name: Checkout da Beta 18 final
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restaurar nova assinatura persistente da Beta 18
        id: beta-key
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.android/santa-luzia-motion-beta18-final.keystore
          key: santa-luzia-motion-beta18-final-keystore-v1

      - name: Criar assinatura persistente quando ainda não existir
        if: steps.beta-key.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MOTION_BETA_KEYSTORE")"
          keytool -genkeypair -v \
            -keystore "$MOTION_BETA_KEYSTORE" \
            -storepass "$MOTION_BETA_STORE_PASSWORD" \
            -keypass "$MOTION_BETA_KEY_PASSWORD" \
            -alias "$MOTION_BETA_KEY_ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Santa Luzia Motion Beta 18, OU=Android Beta, O=Comunidade Santa Luzia, L=Cuiaba, ST=Mato Grosso, C=BR"
          test -s "$MOTION_BETA_KEYSTORE"

      - name: Salvar nova assinatura persistente
        if: steps.beta-key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.android/santa-luzia-motion-beta18-final.keystore
          key: santa-luzia-motion-beta18-final-keystore-v1

      - name: Validar assinatura Beta 18
        shell: bash
        run: |
          set -euo pipefail
          test -s "$MOTION_BETA_KEYSTORE"
          keytool -list -keystore "$MOTION_BETA_KEYSTORE" -storepass "$MOTION_BETA_STORE_PASSWORD" -alias "$MOTION_BETA_KEY_ALIAS" >/dev/null
          CERT="$(keytool -exportcert -keystore "$MOTION_BETA_KEYSTORE" -storepass "$MOTION_BETA_STORE_PASSWORD" -alias "$MOTION_BETA_KEY_ALIAS" | sha256sum | awk '{print $1}')"
          test -n "$CERT"
          echo "BETA18_FINAL_CERT=$CERT" >> "$GITHUB_ENV"

      - name: Validar fonte exata da Beta 18
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const beta = require('./config/android-motion-beta.json')
          const stable = require('./config/android-build.json')
          if (beta.versionName !== '2.0.0-beta.18' || beta.versionCode !== 20018) throw new Error('Fonte não é a Motion Beta 18 final')
          if (beta.applicationId !== 'br.com.comunidadesantaluzia.motionbeta') throw new Error('ApplicationId Motion Beta incorreto')
          if (stable.versionName !== '1.0.6' || stable.versionCode !== 18) throw new Error('Canal oficial foi alterado')
          NODE

      - name: Instalar dependências
        run: npm install --include=dev --no-audit --no-fund

      - name: Restaurar runtime visual aprovado
        shell: bash
        run: |
          set -euo pipefail
          node scripts/fetch-windows-beta-stack.cjs
          node scripts/patch-windows-polish-android-beta18.cjs

      - name: Auditorias da Beta 18
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit
          node scripts/auditar-robustez.cjs
          npm run audit:offline
          node scripts/auditar-beta18-recovery.cjs

      - name: Compilar interface React original local
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-next.cjs
          npm run build:android-local
          test -s android-web/index.html
          test -s android-web/local-app.js
          test "$(stat -c%s android-web/local-app.js)" -gt 250000
          test ! -e android-web/offline.html
          test ! -e android-web/offline-bridge.html
          grep -Fq '/local-app.js' android-web/index.html
          grep -Fq 'windows-beta-runtime.js' android-web/index.html
          test -s android-web/motion/android-deep-auditor-beta16.js
          test -s android-web/motion/android-auditor-patch-beta16.js
          grep -Fq 'android-deep-auditor-beta16.js' components/diagnostico-santa-luzia.tsx
          grep -Fq 'android-auditor-patch-beta16.js' components/diagnostico-santa-luzia.tsx

      - name: Preparar Android Motion Beta 18
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          npx cap sync android
          APP_VERSION_CODE="$APP_VERSION_CODE" APP_VERSION_NAME="$APP_VERSION_NAME" node scripts/prepare-android.cjs
          node scripts/prepare-motion-beta18.cjs

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Auditar APK produzido
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test "$(stat -c%s "$APK")" -gt 20000000
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -Fq "package: name='$MOTION_APP_ID' versionCode='$APP_VERSION_CODE' versionName='$APP_VERSION_NAME'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "application-label:'Santa Luzia Motion Beta'" "$RUNNER_TEMP/badging.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          CERT="$(awk -F': ' 'tolower($0) ~ /certificate sha-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/apksigner.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$CERT" = "$BETA18_FINAL_CERT"
          unzip -l "$APK" > "$RUNNER_TEMP/apk-files.txt"
          grep -Fq 'assets/public/index.html' "$RUNNER_TEMP/apk-files.txt"
          grep -Fq 'assets/public/local-app.js' "$RUNNER_TEMP/apk-files.txt"
          grep -Fq 'assets/public/motion/android-deep-auditor-beta16.js' "$RUNNER_TEMP/apk-files.txt"
          grep -Fq 'assets/public/motion/android-auditor-patch-beta16.js' "$RUNNER_TEMP/apk-files.txt"
          grep -Fq 'assets/public/motion/android-domain-bridge-beta10.js' "$RUNNER_TEMP/apk-files.txt"
          grep -Fq 'assets/public/motion/android-report-bridge-beta11.js' "$RUNNER_TEMP/apk-files.txt"
          if grep -Eq 'assets/public/(offline\.html|offline-bridge\.html)' "$RUNNER_TEMP/apk-files.txt"; then
            echo 'ERRO: interface offline paralela encontrada no APK' >&2
            exit 1
          fi
          unzip -p "$APK" assets/capacitor.config.json > "$RUNNER_TEMP/capacitor-config.json"
          if grep -Fq '"server"' "$RUNNER_TEMP/capacitor-config.json"; then
            echo 'ERRO: APK contém server.url' >&2
            exit 1
          fi
          grep -Fq 'SantaLuziaMotionBeta/2.0.0-beta.18' "$RUNNER_TEMP/capacitor-config.json"
          mkdir -p dist
          cp "$APK" dist/Santa-Luzia-Motion-2.0.0-beta.18-FINAL-CORRETO.apk
          SHA="$(sha256sum dist/Santa-Luzia-Motion-2.0.0-beta.18-FINAL-CORRETO.apk | awk '{print $1}')"
          SIZE="$(stat -c%s dist/Santa-Luzia-Motion-2.0.0-beta.18-FINAL-CORRETO.apk)"
          printf '%s  Santa-Luzia-Motion-2.0.0-beta.18-FINAL-CORRETO.apk\n' "$SHA" > dist/Santa-Luzia-Motion-2.0.0-beta.18-FINAL-CORRETO.apk.sha256
          cat > dist/RELATORIO-BETA18-FINAL-CORRETO.txt <<EOF
          Santa Luzia Motion Beta 18 — APK final correto
          VersionName: 2.0.0-beta.18
          VersionCode: 20018
          ApplicationId: br.com.comunidadesantaluzia.motionbeta
          Certificado Beta 18 final SHA-256: $CERT
          SHA-256 APK: $SHA
          Tamanho: $SIZE bytes
          Interface: React original local empacotada
          Offline: SQLite + caches + filas locais
          Canal oficial Santa Luzia 1.0.6/code18: não alterado
          Assinatura: nova chave persistente exclusiva da Beta 18 final, criada porque a chave privada histórica da linha Motion Beta expirou do cache do GitHub Actions.
          Instalação: se uma Motion Beta antiga com o mesmo ApplicationId estiver instalada, desinstalar uma única vez antes de instalar este APK.
          EOF

      - name: Guardar APK correto
        uses: actions/upload-artifact@v4
        with:
          name: santa-luzia-motion-beta18-final-correto
          path: |
            dist/Santa-Luzia-Motion-2.0.0-beta.18-FINAL-CORRETO.apk
            dist/Santa-Luzia-Motion-2.0.0-beta.18-FINAL-CORRETO.apk.sha256
            dist/RELATORIO-BETA18-FINAL-CORRETO.txt
          retention-days: 14
          if-no-files-found: error
