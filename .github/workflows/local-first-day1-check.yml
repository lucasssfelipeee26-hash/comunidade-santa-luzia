name: Local-first Dia 1 — validação

on:
  push:
    branches:
      - agent/local-first-day1-update-github
    paths:
      - components/android-update-github-runtime.tsx
      - components/app-runtime.tsx
      - .github/workflows/local-first-day1-check.yml

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTH_SECRET: ci-local-first-dia1-12345678901234567890
      CAPACITOR_SERVER_URL: https://comunidade-santa-luzia-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-first-day1-update-github
          fetch-depth: 0

      - name: Validar projeto e registrar resultado
        shell: bash
        run: |
          set +e
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"

          npm ci --no-audit --no-fund
          INSTALL=$?

          TYPESCRIPT=99
          AUDIT=99
          BUILD=99
          DESACOPLAMENTO=99

          if [ "$INSTALL" -eq 0 ]; then
            npx tsc --noEmit
            TYPESCRIPT=$?

            npm run audit:robustez
            AUDIT=$?

            npm run build
            BUILD=$?
          fi

          grep -Fq 'AndroidUpdateGithubRuntime' components/app-runtime.tsx \
            && grep -Fq 'raw.githubusercontent.com' components/android-update-github-runtime.tsx \
            && grep -Fq 'releases/latest/download/santa-luzia.apk' components/android-update-github-runtime.tsx \
            && ! grep -Fq '/api/app/status' components/android-update-github-runtime.tsx
          DESACOPLAMENTO=$?

          export INSTALL TYPESCRIPT AUDIT BUILD DESACOPLAMENTO
          node <<'NODE'
          const fs = require('fs')
          const n = (v) => Number(process.env[v])
          const resultado = {
            checkedAt: new Date().toISOString(),
            node: process.version,
            installExit: n('INSTALL'),
            typescriptExit: n('TYPESCRIPT'),
            auditExit: n('AUDIT'),
            buildExit: n('BUILD'),
            desacoplamentoExit: n('DESACOPLAMENTO'),
          }
          resultado.ok = [resultado.installExit, resultado.typescriptExit, resultado.auditExit, resultado.buildExit, resultado.desacoplamentoExit].every(v => v === 0)
          fs.writeFileSync('.github/local-first-day1-validation.json', JSON.stringify(resultado, null, 2) + '\n')
          console.log(JSON.stringify(resultado, null, 2))
          NODE

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/local-first-day1-validation.json
          git commit -m 'Registra validação do Dia 1 local-first' || true
          git pull --rebase origin agent/local-first-day1-update-github
          git push origin HEAD:agent/local-first-day1-update-github

          if [ "$INSTALL" -ne 0 ] || [ "$TYPESCRIPT" -ne 0 ] || [ "$AUDIT" -ne 0 ] || [ "$BUILD" -ne 0 ] || [ "$DESACOPLAMENTO" -ne 0 ]; then
            exit 1
          fi
