name: Local-first Dia 1 — validação

on:
  push:
    branches:
      - agent/local-first-day1-update-github
    paths:
      - components/android-update-github-runtime.tsx
      - components/app-runtime.tsx
      - .github/workflows/local-first-day1-check.yml

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTH_SECRET: ci-local-first-dia1-12345678901234567890
      CAPACITOR_SERVER_URL: https://comunidade-santa-luzia-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-first-day1-update-github
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: install
        name: Instalar dependências
        continue-on-error: true
        run: npm ci --no-audit --no-fund

      - id: typescript
        name: TypeScript
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npx tsc --noEmit

      - id: audit
        name: Auditoria de robustez
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run audit:robustez

      - id: build
        name: Build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - id: desacoplamento
        name: Confirmar desacoplamento do atualizador
        continue-on-error: true
        run: |
          grep -Fq 'AndroidUpdateGithubRuntime' components/app-runtime.tsx
          grep -Fq 'raw.githubusercontent.com' components/android-update-github-runtime.tsx
          grep -Fq 'releases/latest/download/santa-luzia.apk' components/android-update-github-runtime.tsx
          ! grep -Fq '/api/app/status' components/android-update-github-runtime.tsx

      - name: Registrar resultado verificável
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          TYPESCRIPT: ${{ steps.typescript.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          BUILD: ${{ steps.build.outcome }}
          DESACOPLAMENTO: ${{ steps.desacoplamento.outcome }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const resultado = {
            checkedAt: new Date().toISOString(),
            install: process.env.INSTALL,
            typescript: process.env.TYPESCRIPT,
            audit: process.env.AUDIT,
            build: process.env.BUILD,
            desacoplamento: process.env.DESACOPLAMENTO,
            ok: [process.env.INSTALL, process.env.TYPESCRIPT, process.env.AUDIT, process.env.BUILD, process.env.DESACOPLAMENTO].every(v => v === 'success'),
          }
          fs.writeFileSync('.github/local-first-day1-validation.json', JSON.stringify(resultado, null, 2) + '\n')
          console.log(resultado)
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/local-first-day1-validation.json
          git commit -m 'Registra validação do Dia 1 local-first' || exit 0
          git pull --rebase origin agent/local-first-day1-update-github
          git push origin HEAD:agent/local-first-day1-update-github

      - name: Encerrar com falha se necessário
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          TYPESCRIPT: ${{ steps.typescript.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          BUILD: ${{ steps.build.outcome }}
          DESACOPLAMENTO: ${{ steps.desacoplamento.outcome }}
        run: |
          test "$INSTALL" = success
          test "$TYPESCRIPT" = success
          test "$AUDIT" = success
          test "$BUILD" = success
          test "$DESACOPLAMENTO" = success
