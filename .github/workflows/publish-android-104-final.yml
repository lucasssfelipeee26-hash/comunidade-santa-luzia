name: Publicar Android 1.0.4 final

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-android-104-final.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publicar-android-104-final
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar build 1.0.4 validado
        uses: actions/download-artifact@v4
        with:
          name: santa-luzia-1.0.4-unsigned
          path: source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31917263282

      - name: Validar fonte e patch
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="source/app-release-unsigned.apk"
          PATCH="/tmp/signature-104.patch.zst"
          test -f "$UNSIGNED"
          echo "5997801 bytes esperados; encontrado $(stat -c%s "$UNSIGNED")"
          [ "$(stat -c%s "$UNSIGNED")" -eq 5997801 ]
          printf '%s  %s\n' 'a570312434dba09761fae610dae8a2f2fb0ba9dcbb0e912ccdb0e6d66190aa30' "$UNSIGNED" | sha256sum -c -
          cat native-assets/android/release/signature-patch-104/patch-*.b64 | base64 --decode > "$PATCH"
          echo "45437 bytes de patch esperados; encontrado $(stat -c%s "$PATCH")"
          [ "$(stat -c%s "$PATCH")" -eq 45437 ]
          printf '%s  %s\n' 'e55978e8f028b2ed5d5f2ad28f521a42c67313655d928ebb77a774c3d67af1' "$PATCH" | sha256sum -c -
          echo "Fonte e patch íntegros."

      - name: Reconstruir APK assinado
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          zstd --version
          UNSIGNED="source/app-release-unsigned.apk"
          PATCH="/tmp/signature-104.patch.zst"
          SIGNED="/tmp/Santa-Luzia-1.0.4.apk"
          rm -f "$SIGNED"
          echo "Reconstruindo APK assinado..."
          zstd -d --patch-from="$UNSIGNED" "$PATCH" -o "$SIGNED"
          echo "Reconstrução concluída: $(stat -c%s "$SIGNED") bytes"
          [ "$(stat -c%s "$SIGNED")" -eq 6047116 ]
          printf '%s  %s\n' 'dcd2a0cf96cb946b8e6926abd2aeadf07873a06a94f5c085acfd2212a06c2f0f' "$SIGNED" | sha256sum -c -

      - name: Validar assinatura original Android
        shell: bash
        run: |
          set -euo pipefail
          SIGNED="/tmp/Santa-Luzia-1.0.4.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED" | tee /tmp/apksigner-104.txt
          CERT="$(grep -i 'Signer #1 certificate SHA-256 digest:' /tmp/apksigner-104.txt | head -1 | sed 's/.*: //' | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          echo "Certificado validado: $CERT"
          [ "$CERT" = '1602f064eed7dba5aca9c54e9cfb0a7a9850d18a426059566f3e725320866e18' ]
          grep -Eq 'Verified using v2 scheme.*true' /tmp/apksigner-104.txt
          grep -Eq 'Verified using v3 scheme.*true' /tmp/apksigner-104.txt
          cp "$SIGNED" /tmp/santa-luzia.apk
          printf '%s  %s\n' 'dcd2a0cf96cb946b8e6926abd2aeadf07873a06a94f5c085acfd2212a06c2f0f' 'Santa-Luzia-1.0.4.apk' > /tmp/Santa-Luzia-1.0.4.apk.sha256

      - name: Preparar distribuição oficial
        shell: bash
        run: |
          set -euo pipefail
          SIGNED="/tmp/Santa-Luzia-1.0.4.apk"
          rm -rf native-assets/android/release/parts
          mkdir -p native-assets/android/release/parts
          split -b 131072 -d -a 3 "$SIGNED" native-assets/android/release/parts/part-
          PARTS="$(find native-assets/android/release/parts -type f -name 'part-*' | wc -l | tr -d ' ')"
          echo "Partes geradas: $PARTS"
          [ "$PARTS" -eq 47 ]
          cat > native-assets/android/release/manifest.json <<'JSON'
          {
            "versionCode": 5,
            "versionName": "1.0.4",
            "fileName": "Santa-Luzia-1.0.4.apk",
            "size": 6047116,
            "sha256": "dcd2a0cf96cb946b8e6926abd2aeadf07873a06a94f5c085acfd2212a06c2f0f",
            "parts": 47
          }
          JSON
          cat > config/android-release.json <<'JSON'
          {
            "versionCode": 5,
            "versionName": "1.0.4",
            "publishedAt": "2026-08-15",
            "required": false,
            "apkSize": 6047116,
            "apkSha256": "dcd2a0cf96cb946b8e6926abd2aeadf07873a06a94f5c085acfd2212a06c2f0f",
            "highlights": [
              "Perfis públicos da equipe com foto, bio, função e posição na Jornada",
              "Registros administrativos protegidos e visíveis somente aos moderadores",
              "Nova base offline para Liturgia, Escalas, Formação, Jornada, Biblioteca e Atrasos",
              "Quiz litúrgico e filas de sincronização preparados para funcionar sem internet",
              "Interface Android modernizada, seleção de texto corrigida e som padrão mais suave",
              "Atualizador interno com progresso, verificação de integridade e instalação pelo Android"
            ]
          }
          JSON
          node scripts/materializar-apk-android.cjs
          [ "$(stat -c%s public/downloads/Santa-Luzia-1.0.4.apk)" -eq 6047116 ]
          printf '%s  %s\n' 'dcd2a0cf96cb946b8e6926abd2aeadf07873a06a94f5c085acfd2212a06c2f0f' 'public/downloads/Santa-Luzia-1.0.4.apk' | sha256sum -c -

      - name: Guardar APK assinado validado
        uses: actions/upload-artifact@v4
        with:
          name: santa-luzia-1.0.4-signed-original-key
          path: /tmp/Santa-Luzia-1.0.4.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar versão 1.0.4 na main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/android-release.json native-assets/android/release/manifest.json native-assets/android/release/parts
          git diff --cached --quiet && { echo "Nenhuma alteração de distribuição encontrada"; exit 1; }
          git commit -m "Publica Android 1.0.4 assinado com chave original"
          git push origin HEAD:main

      - name: Criar release oficial 1.0.4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view android-v1.0.4 >/dev/null 2>&1 && gh release delete android-v1.0.4 --yes --cleanup-tag || true
          gh release create android-v1.0.4 \
            /tmp/santa-luzia.apk \
            /tmp/Santa-Luzia-1.0.4.apk \
            /tmp/Santa-Luzia-1.0.4.apk.sha256 \
            --target main \
            --title "Santa Luzia Android 1.0.4" \
            --notes "Grande atualização do Santa Luzia: perfis públicos com privacidade administrativa, nova base offline nativa, Liturgia/Escalas/Formação/Jornada/Biblioteca/Atrasos preparados para uso offline, quiz com sincronização segura, interface Android modernizada, som padrão mais suave e atualizador interno. APK assinado com a identidade original do aplicativo e validado por tamanho, SHA-256 e certificado." \
            --latest
