name: Verificar assinatura Android permanente

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-signing-secrets-now.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      SP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      AL: ${{ secrets.ANDROID_KEY_ALIAS }}
      KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Verificar presença sem expor segredos
        shell: bash
        run: |
          if [ -n "$KS" ] && [ -n "$SP" ] && [ -n "$AL" ] && [ -n "$KP" ]; then
            echo 'ANDROID_SIGNING_READY=true'
          else
            echo 'ANDROID_SIGNING_READY=false'
            exit 2
          fi
