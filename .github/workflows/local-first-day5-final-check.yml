name: Local-first Dia 5 — validação final

on:
  push:
    branches:
      - agent/local-first-day5-notifications
    paths:
      - .github/workflows/local-first-day5-final-check.yml

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTH_SECRET: ci-local-first-dia5-final-12345678901234567890
      CAPACITOR_SERVER_URL: https://comunidade-santa-luzia-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-first-day5-notifications
          fetch-depth: 0
      - name: Validar implementação final
        shell: bash
        run: |
          set +e
          npm install --no-audit --no-fund
          INSTALL=$?
          TYPESCRIPT=99; AUDIT=99; BUILD=99; CHECK=99
          if [ "$INSTALL" -eq 0 ]; then
            npx tsc --noEmit; TYPESCRIPT=$?
            npm run audit:robustez; AUDIT=$?
            npm run build; BUILD=$?
          fi
          grep -Fq 'notificacao-lida' lib/local-first-queue.ts \
            && grep -Fq 'saveDocument' lib/local-notification-cache.ts \
            && grep -Fq 'enfileirarNotificacaoLida' components/native-notification-runtime.tsx \
            && grep -Fq 'carregarNotificacoesCache' components/notification-center.tsx \
            && grep -Fq 'Promise<Dados>' components/notification-center.tsx \
            && grep -Fq 'item.tipo === "notificacao-lida"' components/android-offline-snapshot-runtime.tsx
          CHECK=$?
          export INSTALL TYPESCRIPT AUDIT BUILD CHECK
          node <<'NODE'
          const fs=require('fs'); const n=k=>Number(process.env[k]);
          const r={checkedAt:new Date().toISOString(),installExit:n('INSTALL'),typescriptExit:n('TYPESCRIPT'),auditExit:n('AUDIT'),buildExit:n('BUILD'),notificationCheckExit:n('CHECK')};
          r.ok=[r.installExit,r.typescriptExit,r.auditExit,r.buildExit,r.notificationCheckExit].every(v=>v===0);
          fs.writeFileSync('.github/local-first-day5-final-validation.json',JSON.stringify(r,null,2)+'\n');
          console.log(JSON.stringify(r,null,2));
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/local-first-day5-final-validation.json
          git commit -m 'Registra validação final do Dia 5' || true
          git push origin HEAD:agent/local-first-day5-notifications
          test "$INSTALL" -eq 0 && test "$TYPESCRIPT" -eq 0 && test "$AUDIT" -eq 0 && test "$BUILD" -eq 0 && test "$CHECK" -eq 0
