name: Temporário — assinar e publicar Android code 18

on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-sign-publish-code18.yml]

permissions:
  contents: write

concurrency:
  group: temp-sign-publish-code18
  cancel-in-progress: false

env:
  APP_VERSION_CODE: "18"
  APP_VERSION_NAME: "1.0.6"
  AUTH_SECRET: ci-local-first-code18-12345678901234567890
  CAPACITOR_SERVER_URL: https://comunidade-santa-luzia-production.up.railway.app
  EXPECTED_CERT: 1602f064eed7dba5aca9c54e9cfb0a7a9850d18a426059566f3e725320866e18
  BRIDGE_PRIVATE: .github/.temp-signing-bridge-private.pem

jobs:
  assinar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Restaurar privada efêmera da ponte
        uses: actions/cache/restore@v4
        with:
          path: .github/.temp-signing-bridge-private.pem
          key: santa-luzia-signing-bridge-421bc125ce9be08617705100254c469097e1238e
          fail-on-cache-miss: true
      - name: Recuperar chave histórica no runner
        shell: bash
        run: |
          set -euo pipefail
          test -s "$BRIDGE_PRIVATE"
          base64 -d .github/temp-signing-pass-code18.enc.b64 > "$RUNNER_TEMP/pass.enc"
          openssl pkeyutl -decrypt -inkey "$BRIDGE_PRIVATE" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$RUNNER_TEMP/pass.enc" -out "$RUNNER_TEMP/pass.txt"
          base64 -d .github/temp-signing-recovery-code18.enc.b64 > "$RUNNER_TEMP/recovery.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/recovery.enc" -out "$RUNNER_TEMP/recovery.zip" -pass file:"$RUNNER_TEMP/pass.txt"
          mkdir -p "$RUNNER_TEMP/signing"
          unzip -q "$RUNNER_TEMP/recovery.zip" -d "$RUNNER_TEMP/signing"
          STORE_PASS="$(tr -d '\r\n' < "$RUNNER_TEMP/signing/signing-password.txt")"
          KEY_ALIAS="$(tr -d '\r\n' < "$RUNNER_TEMP/signing/santa-luzia-signing-alias.txt")"
          test -s "$RUNNER_TEMP/signing/santa-luzia-release.jks" && test -n "$STORE_PASS" && test -n "$KEY_ALIAS"
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_ALIAS"
          printf 'ANDROID_KEYSTORE_PATH=%s\nANDROID_KEYSTORE_PASSWORD=%s\nANDROID_KEY_ALIAS=%s\nANDROID_KEY_PASSWORD=%s\n' "$RUNNER_TEMP/signing/santa-luzia-release.jks" "$STORE_PASS" "$KEY_ALIAS" "$STORE_PASS" >> "$GITHUB_ENV"
      - name: Validar certificado original
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > "$RUNNER_TEMP/key.txt"
          CERT="$(awk -F'SHA256: ' 'tolower($0) ~ /sha256:/ {print $2; exit}' "$RUNNER_TEMP/key.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$CERT" = "$EXPECTED_CERT"
      - name: Validar projeto e preparar Android
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run audit:robustez
          npm run build
          npx cap add android
          npx cap sync android
          node scripts/prepare-android.cjs
          grep -Eq 'versionCode[[:space:]]+18' android/app/build.gradle
          grep -Eq 'versionName[[:space:]]+"1\.0\.6"' android/app/build.gradle
          grep -Fq 'SQLiteOpenHelper' android/app/src/main/java/br/com/comunidadesantaluzia/app/OfflineStorePlugin.java
          grep -Fq 'raw.githubusercontent.com' android/app/src/main/assets/public/offline.html
          node scripts/configure-android-signing.cjs
      - name: Gerar e validar APK assinada
        shell: bash
        run: |
          set -euo pipefail
          (cd android && ./gradlew assembleRelease --no-daemon)
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APK" && test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-cert.txt"
          CERT="$(awk -F': ' 'tolower($0) ~ /certificate sha-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/apk-cert.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$CERT" = "$EXPECTED_CERT"
          mkdir -p dist
          cp "$APK" dist/santa-luzia.apk
          cp "$APK" dist/Santa-Luzia-1.0.6.apk
          cp "$APK" dist/Santa-Luzia-1.0.6-code18.apk
          SHA="$(sha256sum dist/santa-luzia.apk | awk '{print $1}')"
          SIZE="$(stat -c '%s' dist/santa-luzia.apk)"
          printf '%s  santa-luzia.apk\n' "$SHA" > dist/santa-luzia.apk.sha256
          printf 'SIGNED_APK_SHA=%s\nSIGNED_APK_SIZE=%s\nSIGNED_APK_CERT=%s\n' "$SHA" "$SIZE" "$CERT" >> "$GITHUB_ENV"
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=android-v1.0.6
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Santa Luzia 1.0.6 — build interna 18.

          Atualização local-first:
          - atualizações Android pelo GitHub, sem depender do Railway;
          - SQLite nativo para dados offline importantes;
          - fila offline durável e isolada por usuário;
          - sincronização por revisão com menos tráfego;
          - notificações persistentes com reconciliação;
          - modo local também detecta e instala atualizações pelo GitHub.
          EOF
          gh release upload "$TAG" dist/santa-luzia.apk dist/Santa-Luzia-1.0.6.apk dist/Santa-Luzia-1.0.6-code18.apk dist/santa-luzia.apk.sha256 --clobber
          gh release edit "$TAG" --latest --title "Santa Luzia Android 1.0.6 — code 18" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Atualizar manifesto e registrar resultado
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'); const p='config/android-release.json'; const r=JSON.parse(fs.readFileSync(p,'utf8'));
          Object.assign(r,{versionCode:18,versionName:'1.0.6',publishedAt:'2026-08-19',required:false,apkSize:Number(process.env.SIGNED_APK_SIZE),apkSha256:process.env.SIGNED_APK_SHA,highlights:[
            'Atualizações Android agora são verificadas diretamente no GitHub, sem depender do Railway',
            'Dados offline importantes usam SQLite nativo e continuam após limpar apenas o cache',
            'Ações feitas offline entram em uma fila durável e sincronizam quando a conexão volta',
            'Sincronização por revisão reduz downloads repetidos e o tráfego de dados',
            'Notificações recentes ficam disponíveis localmente e reconciliam o estado depois',
            'O modo local também consegue detectar e instalar uma atualização pelo GitHub'
          ]}); fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');
          const out={publishedAt:new Date().toISOString(),versionName:'1.0.6',versionCode:18,apkSize:Number(process.env.SIGNED_APK_SIZE),apkSha256:process.env.SIGNED_APK_SHA,certificateSha256:process.env.SIGNED_APK_CERT,expectedCertificateSha256:process.env.EXPECTED_CERT,certificateMatches:process.env.SIGNED_APK_CERT===process.env.EXPECTED_CERT,releaseTag:'android-v1.0.6',asset:'santa-luzia.apk'};
          fs.writeFileSync('.github/temp-signing-code18-result.json',JSON.stringify(out,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/android-release.json .github/temp-signing-code18-result.json
          git commit -m 'Publica Android 1.0.6 code 18 local-first'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Limpar runner
        if: always()
        shell: bash
        run: rm -rf "$BRIDGE_PRIVATE" "$RUNNER_TEMP/pass.enc" "$RUNNER_TEMP/pass.txt" "$RUNNER_TEMP/recovery.enc" "$RUNNER_TEMP/recovery.zip" "$RUNNER_TEMP/signing" "$RUNNER_TEMP/key.txt" "$RUNNER_TEMP/apk-cert.txt" || true
