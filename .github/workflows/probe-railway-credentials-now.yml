name: Verificar credenciais Railway disponíveis

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-railway-credentials-now.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      S1: ${{ secrets.RAILWAY_TOKEN }}
      S2: ${{ secrets.RAILWAY_API_TOKEN }}
      S3: ${{ secrets.RAILWAY_DEPLOY_HOOK }}
      V1: ${{ vars.RAILWAY_TOKEN }}
      V2: ${{ vars.RAILWAY_PROJECT_ID }}
      V3: ${{ vars.RAILWAY_SERVICE_ID }}
      V4: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      V5: ${{ vars.RAILWAY_DEPLOY_HOOK }}
    steps:
      - name: Mostrar somente presença ou ausência
        shell: bash
        run: |
          node - <<'NODE'
          for (const k of ['S1','S2','S3','V1','V2','V3','V4','V5']) console.log(`${k}=${Boolean((process.env[k] || '').trim())}`)
          NODE
