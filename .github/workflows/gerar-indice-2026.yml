name: Gerar índice litúrgico 2026

on:
  push:
    branches:
      - codex-generate-liturgia-2026

permissions:
  contents: write

jobs:
  gerar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar e auditar índice
        run: |
          node scripts/gerar-indice-liturgico-2026.cjs
          node scripts/auditar-indice-liturgico-2026.cjs
      - name: Salvar índice no ramo temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/offline/iliturgia/indice-liturgico-2026.json
          git commit -m "Gera índice litúrgico offline de 2026"
          git push
