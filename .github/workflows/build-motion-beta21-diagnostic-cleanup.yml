name: Android — Motion Beta 21 Final Auth Startup

on:
  push:
    branches:
      - fix/beta21-login
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santa-luzia-motion-beta21-final-auth-startup-registered
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SANTA_LUZIA_MOTION_BETA: "1"
      SANTA_LUZIA_MOTION_VERSION: "2.0.0-beta.21"
      APP_VERSION_CODE: "20021"
      APP_VERSION_NAME: "2.0.0-beta.21"
      MOTION_APP_ID: br.com.comunidadesantaluzia.motionbeta

    steps:
      - name: Checkout Beta 21
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Aplicar limpeza final de autenticação e startup
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-beta21-final-auth-startup-cleanup.cjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-local android-web lib scripts
          if ! git diff --cached --quiet; then
            git commit -m "fix(beta21): deduplicar auth e aliviar startup"
            git push origin HEAD:fix/beta21-login
          fi

      - name: Configurar ambiente CI
        shell: bash
        run: printf 'AUTH_SECRET=%040d\n' 0 >> "$GITHUB_ENV"

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validar canal e correções finais
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const beta=require('./config/android-motion-beta.json')
          const stable=require('./config/android-build.json')
          if(beta.versionName!=='2.0.0-beta.21'||beta.versionCode!==20021) throw new Error('Fonte não é Beta 21')
          if(beta.applicationId!=='br.com.comunidadesantaluzia.motionbeta') throw new Error('Pacote Motion alterado')
          if(beta.serverUrl!=='http://192.168.1.7:3000') throw new Error(`Servidor local divergente: ${beta.serverUrl}`)
          if(stable.versionName!=='1.0.6'||stable.versionCode!==18) throw new Error('Canal oficial alterado')
          NODE
          grep -Fq 'data-auth-ranking-session-shared="true"' android-local/entry.tsx
          ! grep -Fq 'void fetch("/api/auth/me"' android-local/entry.tsx
          grep -Fq 'AUTH_ME_RECENT_MS = 5_000' lib/auth-client.ts
          grep -Fq 'beta21IdleInitialWarm' android-web/motion/android-original-ui-beta10.js
          ! grep -Fq 'setTimeout(() => void warm(false), 800)' android-web/motion/android-original-ui-beta10.js
          node - <<'NODE'
          const fs=require('fs')
          const s=fs.readFileSync('android-web/motion/android-original-ui-beta10.js','utf8')
          const common=s.slice(s.indexOf('const COMMON_APIS'),s.indexOf('const MODERATOR_APIS'))
          if(common.includes('/api/auth/me')) throw new Error('COMMON_APIS voltou a duplicar auth/me')
          NODE

      - name: Instalar dependências sem hooks
        run: npm install --include=dev --ignore-scripts --no-audit --no-fund

      - name: Testes e auditorias
        shell: bash
        run: |
          set -euo pipefail
          node scripts/auditar-seguranca-beta21.cjs
          node scripts/fetch-windows-beta-stack.cjs
          node scripts/patch-windows-polish-android-beta18.cjs
          node --test tests/auth-client.test.cjs
          npx tsc --noEmit
          node scripts/auditar-robustez.cjs
          npm run audit:offline
          node scripts/auditar-beta20-heranca-completa.cjs
          node scripts/auditar-beta20-estrutural.cjs

      - name: Compilar interface Android local
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-next.cjs
          npm run build:android-local
          node scripts/patch-beta19-offline-pack.cjs
          node scripts/patch-beta19-android-web.cjs
          node scripts/patch-beta21-visual-forensics-lifecycle.cjs
          node scripts/normalize-beta21-prewarm-for-navigation-patch.cjs
          node scripts/patch-beta21-navigation-runtime.cjs
          node scripts/patch-beta21-final-stability.cjs
          grep -Fq 'data-auth-ranking-session-shared' android-web/local-app.js
          grep -Fq 'data-ranking-windowed' android-web/local-app.js
          grep -Fq 'data-login-layout-stable' android-web/local-app.js
          node scripts/bundle-motion-beta20.cjs
          test -s android-web/index.html
          test -s android-web/local-app.js
          test -s android-web/motion/android-motion-runtime-beta20.js
          grep -Fq 'prewarm massivo desligado' android-web/motion/android-motion-runtime-beta20.js
          grep -Fq 'KEYBOARD_MIN_DROP_PX' android-web/motion/android-motion-runtime-beta20.js
          grep -Fq 'QUIZZES_CACHE_KEY' android-web/motion/android-motion-runtime-beta20.js
          if grep -Fq 'setTimeout(() => void warm(false), 800)' android-web/motion/android-motion-runtime-beta20.js; then
            echo 'ERRO: warmup precoce voltou ao runtime.' >&2
            exit 1
          fi
          if grep -Fq 'beta21IdleInitialWarm' android-web/motion/android-motion-runtime-beta20.js; then
            echo 'ERRO: warmup automático ocioso deveria ter sido removido pelo estabilizador.' >&2
            exit 1
          fi
          if grep -Fq 'android-podium-beta12.js' android-web/motion/android-motion-runtime-beta20.js; then
            echo 'ERRO: runtime voltou a conter o pódio legado.' >&2
            exit 1
          fi

      - name: Preparar Android e crashfix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          npx cap sync android
          APP_VERSION_CODE="$APP_VERSION_CODE" APP_VERSION_NAME="$APP_VERSION_NAME" node scripts/prepare-android.cjs
          node scripts/prepare-motion-beta20.cjs
          node scripts/patch-local-notifications-beta21.cjs
          node scripts/patch-beta21-deep-crash-recorder.cjs
          grep -Fq 'debuggable false' android/app/build.gradle
          grep -Fq 'signingConfig signingConfigs.debug' android/app/build.gradle
          grep -Fq 'android:launchMode="singleTop"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:screenOrientation="portrait"' android/app/src/main/AndroidManifest.xml

      - name: Compilar APK Release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Auditar APK final
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test "$(stat -c%s "$APK")" -gt 15000000
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -Fq "package: name='$MOTION_APP_ID' versionCode='$APP_VERSION_CODE' versionName='$APP_VERSION_NAME'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "application-label:'Santa Luzia Motion Beta'" "$RUNNER_TEMP/badging.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          unzip -p "$APK" assets/public/local-app.js | grep -Fq 'data-auth-ranking-session-shared'
          unzip -p "$APK" assets/public/motion/android-motion-runtime-beta20.js | grep -Fq 'prewarm massivo desligado'
          if unzip -p "$APK" assets/public/motion/android-motion-runtime-beta20.js | grep -Fq 'setTimeout(() => void warm(false), 800)'; then
            echo 'ERRO: APK contém warmup precoce.' >&2
            exit 1
          fi
          if unzip -p "$APK" assets/public/motion/android-motion-runtime-beta20.js | grep -Fq 'beta21IdleInitialWarm'; then
            echo 'ERRO: APK contém warmup automático ocioso.' >&2
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/Santa-Luzia-Motion-2.0.0-beta.21-FINAL-AUTH-STARTUP.apk
          sha256sum dist/Santa-Luzia-Motion-2.0.0-beta.21-FINAL-AUTH-STARTUP.apk > dist/Santa-Luzia-Motion-2.0.0-beta.21-FINAL-AUTH-STARTUP.apk.sha256

      - name: Guardar APK final
        uses: actions/upload-artifact@v4
        with:
          name: santa-luzia-motion-beta21-final-auth-startup
          path: |
            dist/Santa-Luzia-Motion-2.0.0-beta.21-FINAL-AUTH-STARTUP.apk
            dist/Santa-Luzia-Motion-2.0.0-beta.21-FINAL-AUTH-STARTUP.apk.sha256
          retention-days: 14
          if-no-files-found: error
