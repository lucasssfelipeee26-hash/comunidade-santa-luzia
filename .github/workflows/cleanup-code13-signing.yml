name: Limpar ponte temporaria de assinatura code 13

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-code13-signing.yml

permissions:
  actions: write
  contents: read

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Apagar artefatos efemeros da assinatura
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/9268397507
          gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/9268397685
