name: Recover Motion Beta 21 Project Source

on:
  push:
    branches:
      - ops/recover-beta21-project-20261007

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact project tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create exact source archive
        run: |
          git archive --format=zip --prefix=Santa-Luzia-Motion-Beta21/ HEAD > Santa-Luzia-Motion-Beta21-Projeto-Completo.zip
          sha256sum Santa-Luzia-Motion-Beta21-Projeto-Completo.zip

      - name: Upload project source
        uses: actions/upload-artifact@v4
        with:
          name: santa-luzia-motion-beta21-projeto-completo
          path: Santa-Luzia-Motion-Beta21-Projeto-Completo.zip
          if-no-files-found: error
          retention-days: 7
