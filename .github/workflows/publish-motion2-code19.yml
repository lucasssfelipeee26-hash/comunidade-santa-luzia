name: Publicar Santa Luzia Motion 2.0 code 19

on:
  push:
    branches: [main]
    paths:
      - config/android-build.json
      - .github/workflows/publish-motion2-code19.yml

permissions:
  contents: write

concurrency:
  group: publish-motion2-code19
  cancel-in-progress: false

env:
  APP_VERSION_CODE: "19"
  APP_VERSION_NAME: "2.0.0"
  AUTH_SECRET: ci-motion2-code19-12345678901234567890
  CAPACITOR_SERVER_URL: https://comunidade-santa-luzia-production.up.railway.app
  EXPECTED_CERT: 1602f064eed7dba5aca9c54e9cfb0a7a9850d18a426059566f3e725320866e18
  BRIDGE_PRIVATE: .github/.temp-signing-bridge-private.pem

jobs:
  assinar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirmar build Motion 2.0
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'require("./config/android-build.json").versionCode')" = "19"
          test "$(node -p 'require("./config/android-build.json").versionName')" = "2.0.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Restaurar chave efêmera da ponte
        uses: actions/cache/restore@v4
        with:
          path: .github/.temp-signing-bridge-private.pem
          key: santa-luzia-signing-bridge-421bc125ce9be08617705100254c469097e1238e
          fail-on-cache-miss: true
      - name: Recuperar chave histórica de assinatura
        shell: bash
        run: |
          set -euo pipefail
          test -s "$BRIDGE_PRIVATE"
          base64 -d .github/temp-signing-pass-code18.enc.b64 > "$RUNNER_TEMP/pass.enc"
          openssl pkeyutl -decrypt -inkey "$BRIDGE_PRIVATE" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$RUNNER_TEMP/pass.enc" -out "$RUNNER_TEMP/pass.txt"
          base64 -d .github/temp-signing-recovery-code18.enc.b64 > "$RUNNER_TEMP/recovery.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/recovery.enc" -out "$RUNNER_TEMP/recovery.zip" -pass file:"$RUNNER_TEMP/pass.txt"
          mkdir -p "$RUNNER_TEMP/signing"
          unzip -q "$RUNNER_TEMP/recovery.zip" -d "$RUNNER_TEMP/signing"
          STORE_PASS="$(tr -d '\r\n' < "$RUNNER_TEMP/signing/signing-password.txt")"
          KEY_ALIAS="$(tr -d '\r\n' < "$RUNNER_TEMP/signing/santa-luzia-signing-alias.txt")"
          test -s "$RUNNER_TEMP/signing/santa-luzia-release.jks" && test -n "$STORE_PASS" && test -n "$KEY_ALIAS"
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_ALIAS"
          printf 'ANDROID_KEYSTORE_PATH=%s\nANDROID_KEYSTORE_PASSWORD=%s\nANDROID_KEY_ALIAS=%s\nANDROID_KEY_PASSWORD=%s\n' "$RUNNER_TEMP/signing/santa-luzia-release.jks" "$STORE_PASS" "$KEY_ALIAS" "$STORE_PASS" >> "$GITHUB_ENV"
      - name: Validar certificado oficial
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > "$RUNNER_TEMP/key.txt"
          CERT="$(awk -F'SHA256: ' 'tolower($0) ~ /sha256:/ {print $2; exit}' "$RUNNER_TEMP/key.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$CERT" = "$EXPECTED_CERT"
      - name: Validar Motion 2.0 e preparar Android
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run audit:robustez
          npm run build
          npx cap add android
          npx cap sync android
          node scripts/prepare-android.cjs
          grep -Eq 'versionCode[[:space:]]+19' android/app/build.gradle
          grep -Eq 'versionName[[:space:]]+"2\.0\.0"' android/app/build.gradle
          test -f components/motion-2-runtime.tsx
          test -f components/motion-2-update-banner.tsx
          test -f components/android-update-router-runtime.tsx
          grep -Fq 'BUILD_MOTION_2 = 19' components/motion-2-runtime.tsx
          grep -Fq 'build === 18' components/android-update-router-runtime.tsx
          grep -Fq 'release-assets.githubusercontent.com' android/app/src/main/java/br/com/comunidadesantaluzia/app/AppUpdaterPlugin.java
          node scripts/configure-android-signing.cjs
      - name: Gerar e validar APK Motion 2.0
        shell: bash
        run: |
          set -euo pipefail
          (cd android && ./gradlew assembleRelease --no-daemon)
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APK" && test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-cert.txt"
          CERT="$(awk -F': ' 'tolower($0) ~ /certificate sha-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/apk-cert.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$CERT" = "$EXPECTED_CERT"
          mkdir -p dist
          cp "$APK" dist/santa-luzia.apk
          cp "$APK" dist/Santa-Luzia-Motion-2.0.apk
          cp "$APK" dist/Santa-Luzia-2.0.0-code19.apk
          SHA="$(sha256sum dist/santa-luzia.apk | awk '{print $1}')"
          SIZE="$(stat -c '%s' dist/santa-luzia.apk)"
          printf '%s  santa-luzia.apk\n' "$SHA" > dist/santa-luzia.apk.sha256
          printf 'SIGNED_APK_SHA=%s\nSIGNED_APK_SIZE=%s\nSIGNED_APK_CERT=%s\n' "$SHA" "$SIZE" "$CERT" >> "$GITHUB_ENV"
      - name: Publicar GitHub Release Motion 2.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=android-v2.0.0
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Santa Luzia Motion 2.0 — code 19.

          Nova experiência visual:
          - transições suaves entre telas;
          - microanimações nos botões e navegação inferior;
          - pódio com troféu, avatares e bordas ouro/prata/bronze animados;
          - Santa Luzia animada na entrada e no gesto de atualizar;
          - formações, modais, notificações e carregamentos mais fluidos;
          - feedback tátil discreto e respeito ao modo de movimento reduzido.

          O code 19 exige que o aparelho tenha passado primeiro pela atualização técnica code 18.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/santa-luzia.apk dist/Santa-Luzia-Motion-2.0.apk dist/Santa-Luzia-2.0.0-code19.apk dist/santa-luzia.apk.sha256 --clobber
            gh release edit "$TAG" --latest --title "Santa Luzia Motion 2.0 — code 19" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" dist/santa-luzia.apk dist/Santa-Luzia-Motion-2.0.apk dist/Santa-Luzia-2.0.0-code19.apk dist/santa-luzia.apk.sha256 --latest --title "Santa Luzia Motion 2.0 — code 19" --notes-file "$RUNNER_TEMP/notes.md"
          fi
      - name: Publicar manifesto Motion 2.0
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs')
          const path='config/android-release.json'
          const release=JSON.parse(fs.readFileSync(path,'utf8'))
          Object.assign(release,{
            versionCode:19,
            versionName:'2.0.0',
            publishedAt:'2026-08-20',
            required:false,
            apkSize:Number(process.env.SIGNED_APK_SIZE),
            apkSha256:process.env.SIGNED_APK_SHA,
            highlights:[
              'Transições suaves e microanimações em toda a navegação',
              'Ranking com pódio, troféu, avatares e bordas animadas em ouro, prata e bronze',
              'Santa Luzia gira suavemente na entrada e durante a atualização da tela',
              'Formações, modais, notificações e carregamentos receberam movimento e profundidade',
              'Feedback tátil discreto e suporte a movimento reduzido preservam conforto e acessibilidade'
            ]
          })
          fs.writeFileSync(path,JSON.stringify(release,null,2)+'\n')
          const result={publishedAt:new Date().toISOString(),versionName:'2.0.0',versionCode:19,apkSize:Number(process.env.SIGNED_APK_SIZE),apkSha256:process.env.SIGNED_APK_SHA,certificateSha256:process.env.SIGNED_APK_CERT,expectedCertificateSha256:process.env.EXPECTED_CERT,certificateMatches:process.env.SIGNED_APK_CERT===process.env.EXPECTED_CERT,releaseTag:'android-v2.0.0',asset:'santa-luzia.apk',motion2:true}
          fs.writeFileSync('.github/motion2-code19-result.json',JSON.stringify(result,null,2)+'\n')
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/android-release.json .github/motion2-code19-result.json
          git commit -m 'Publica Santa Luzia Motion 2.0 code 19'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Limpar runner
        if: always()
        shell: bash
        run: rm -rf "$BRIDGE_PRIVATE" "$RUNNER_TEMP/pass.enc" "$RUNNER_TEMP/pass.txt" "$RUNNER_TEMP/recovery.enc" "$RUNNER_TEMP/recovery.zip" "$RUNNER_TEMP/signing" "$RUNNER_TEMP/key.txt" "$RUNNER_TEMP/apk-cert.txt" || true
