name: Local-first Dia 2 — validar SQLite Android

on:
  push:
    branches:
      - agent/local-first-day2-sqlite
    paths:
      - native-assets/android/src/main/java/br/com/comunidadesantaluzia/app/OfflineStorePlugin.java
      - lib/native-offline-store.ts
      - .github/workflows/local-first-day2-check.yml

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AUTH_SECRET: ci-local-first-dia2-12345678901234567890
      CAPACITOR_SERVER_URL: https://comunidade-santa-luzia-production.up.railway.app
      APP_VERSION_CODE: 17
      APP_VERSION_NAME: 1.0.6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-first-day2-sqlite
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validar web e Android
        shell: bash
        run: |
          set +e
          npm install --no-audit --no-fund
          INSTALL=$?

          TYPESCRIPT=99
          AUDIT=99
          WEBBUILD=99
          ANDROIDPREP=99
          ANDROIDBUILD=99
          SQLITECHECK=99

          if [ "$INSTALL" -eq 0 ]; then
            npx tsc --noEmit
            TYPESCRIPT=$?
            npm run audit:robustez
            AUDIT=$?
            npm run build
            WEBBUILD=$?
          fi

          if [ "$WEBBUILD" -eq 0 ]; then
            npx cap add android && npx cap sync android && node scripts/prepare-android.cjs
            ANDROIDPREP=$?
          fi

          if [ "$ANDROIDPREP" -eq 0 ]; then
            (cd android && ./gradlew assembleDebug --no-daemon)
            ANDROIDBUILD=$?
          fi

          grep -Fq 'SQLiteOpenHelper' native-assets/android/src/main/java/br/com/comunidadesantaluzia/app/OfflineStorePlugin.java \
            && grep -Fq 'santa_luzia_local.db' native-assets/android/src/main/java/br/com/comunidadesantaluzia/app/OfflineStorePlugin.java \
            && grep -Fq 'LEGACY_PREFS' native-assets/android/src/main/java/br/com/comunidadesantaluzia/app/OfflineStorePlugin.java \
            && grep -Fq 'saveDocument' lib/native-offline-store.ts
          SQLITECHECK=$?

          export INSTALL TYPESCRIPT AUDIT WEBBUILD ANDROIDPREP ANDROIDBUILD SQLITECHECK
          node <<'NODE'
          const fs = require('fs')
          const n = (v) => Number(process.env[v])
          const r = {
            checkedAt: new Date().toISOString(),
            node: process.version,
            installExit: n('INSTALL'),
            typescriptExit: n('TYPESCRIPT'),
            auditExit: n('AUDIT'),
            webBuildExit: n('WEBBUILD'),
            androidPrepareExit: n('ANDROIDPREP'),
            androidBuildExit: n('ANDROIDBUILD'),
            sqliteCheckExit: n('SQLITECHECK'),
          }
          r.ok = [r.installExit,r.typescriptExit,r.auditExit,r.webBuildExit,r.androidPrepareExit,r.androidBuildExit,r.sqliteCheckExit].every(v => v === 0)
          fs.writeFileSync('.github/local-first-day2-validation.json', JSON.stringify(r, null, 2) + '\n')
          console.log(JSON.stringify(r, null, 2))
          NODE

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/local-first-day2-validation.json
          git commit -m 'Registra validação do SQLite local-first' || true
          git pull --rebase origin agent/local-first-day2-sqlite
          git push origin HEAD:agent/local-first-day2-sqlite

          test "$INSTALL" -eq 0 \
            && test "$TYPESCRIPT" -eq 0 \
            && test "$AUDIT" -eq 0 \
            && test "$WEBBUILD" -eq 0 \
            && test "$ANDROIDPREP" -eq 0 \
            && test "$ANDROIDBUILD" -eq 0 \
            && test "$SQLITECHECK" -eq 0
