name: Publicar Android 1.0.5 com assinatura recuperada

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-android-105-secure.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: publicar-android-105-seguro
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CAPACITOR_SERVER_URL: https://comunidade-santa-luzia-production.up.railway.app
      AUTH_SECRET: ci-apenas-para-validacao-nao-usar-em-producao-123456789
      EXPECTED_CERT: 1602f064eed7dba5aca9c54e9cfb0a7a9850d18a426059566f3e725320866e18
      BRIDGE_RUN_ID: 31940791426
      BRIDGE_PRIVATE_ARTIFACT_ID: 9261947794
      BRIDGE_PUBLIC_ARTIFACT_ID: 9261947676
      ENCRYPTED_CMS_SHA256: 98c859ea018d807918c4add7f256ecb359668ba9518afc4da9ade757e3153264
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Baixar chave privada temporaria da ponte
        uses: actions/download-artifact@v4
        with:
          name: bridge-private-key
          path: ${{ runner.temp }}/bridge-private
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BRIDGE_RUN_ID }}

      - name: Baixar certificado publico da ponte
        uses: actions/download-artifact@v4
        with:
          name: bridge-public-cert
          path: ${{ runner.temp }}/bridge-public
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BRIDGE_RUN_ID }}

      - name: Recuperar chave Android somente no runner
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/ci-signing-bridge.cms.b64 > "$RUNNER_TEMP/signing-recovery.cms"
          printf '%s  %s\n' "$ENCRYPTED_CMS_SHA256" "$RUNNER_TEMP/signing-recovery.cms" | sha256sum -c -
          openssl cms -decrypt -binary -inform DER \
            -in "$RUNNER_TEMP/signing-recovery.cms" \
            -recip "$RUNNER_TEMP/bridge-public/public-cert.pem" \
            -inkey "$RUNNER_TEMP/bridge-private/private.pem" \
            -out "$RUNNER_TEMP/signing-recovery.zip"
          mkdir -p "$RUNNER_TEMP/android-signing"
          unzip -q "$RUNNER_TEMP/signing-recovery.zip" -d "$RUNNER_TEMP/android-signing"
          chmod 600 "$RUNNER_TEMP/android-signing/santa-luzia-release.jks" "$RUNNER_TEMP/android-signing/signing-password.txt"
          test "$(cat "$RUNNER_TEMP/android-signing/santa-luzia-signing-alias.txt")" = 'santa-luzia'
          keytool -list -v \
            -keystore "$RUNNER_TEMP/android-signing/santa-luzia-release.jks" \
            -storetype PKCS12 \
            -storepass:file "$RUNNER_TEMP/android-signing/signing-password.txt" \
            -alias santa-luzia > "$RUNNER_TEMP/key-info.txt"
          CERT="$(grep -i 'SHA256:' "$RUNNER_TEMP/key-info.txt" | head -1 | sed 's/.*SHA256: //' | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$CERT" = "$EXPECTED_CERT"
          echo 'Chave original validada sem expor credenciais.'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Validar aplicacao web
        run: npm run build

      - name: Criar e sincronizar Android
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          npx cap sync android
          node scripts/prepare-android.cjs

      - name: Gerar APK unsigned 1.0.5
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Assinar e validar APK com chave original
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          UNSIGNED="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$UNSIGNED"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          KS="$RUNNER_TEMP/android-signing/santa-luzia-release.jks"
          PW="$RUNNER_TEMP/android-signing/signing-password.txt"
          OUT="dist/Santa-Luzia-1.0.5.apk"
          "$APKSIGNER" sign \
            --ks "$KS" \
            --ks-key-alias santa-luzia \
            --ks-pass "file:$PW" \
            --key-pass "file:$PW" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT" "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$OUT" | tee "$RUNNER_TEMP/apksigner.txt"
          CERT="$(grep -i 'certificate SHA-256 digest:' "$RUNNER_TEMP/apksigner.txt" | head -1 | sed 's/.*: //' | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$CERT" = "$EXPECTED_CERT"
          grep -Eq 'Verified using v2 scheme.*true' "$RUNNER_TEMP/apksigner.txt"
          grep -Eq 'Verified using v3 scheme.*true' "$RUNNER_TEMP/apksigner.txt"
          BADGING="$("$AAPT" dump badging "$OUT" | head -1)"
          echo "$BADGING" | grep -q "name='br.com.comunidadesantaluzia.app'"
          echo "$BADGING" | grep -q "versionCode='6'"
          echo "$BADGING" | grep -q "versionName='1.0.5'"
          cp "$OUT" dist/santa-luzia.apk
          SHA="$(sha256sum "$OUT" | awk '{print $1}')"
          SIZE="$(stat -c%s "$OUT")"
          printf '%s  %s\n' "$SHA" 'Santa-Luzia-1.0.5.apk' > dist/Santa-Luzia-1.0.5.apk.sha256
          echo "APK_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "APK 1.0.5 validado: $SIZE bytes; SHA-256 $SHA"

      - name: Publicar release oficial 1.0.5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view android-v1.0.5 >/dev/null 2>&1 && gh release delete android-v1.0.5 --yes --cleanup-tag || true
          gh release create android-v1.0.5 \
            dist/santa-luzia.apk \
            dist/Santa-Luzia-1.0.5.apk \
            dist/Santa-Luzia-1.0.5.apk.sha256 \
            --target main \
            --title 'Santa Luzia Android 1.0.5' \
            --notes 'Correcao do atualizador Android: o APK passa a ser baixado pelo proprio Santa Luzia, com validacao de tamanho e SHA-256 antes de abrir o instalador do Android. Chrome nao participa do fluxo nas novas builds. Assinado com a identidade original do aplicativo.' \
            --latest

      - name: Atualizar metadados do servidor
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const path = 'config/android-release.json'
          const atual = JSON.parse(fs.readFileSync(path, 'utf8'))
          atual.versionCode = 6
          atual.versionName = '1.0.5'
          atual.publishedAt = '2026-08-16'
          atual.required = false
          atual.apkSize = Number(process.env.APK_SIZE)
          atual.apkSha256 = process.env.APK_SHA256
          atual.highlights = [
            'Atualizador Android corrigido para baixar o APK dentro do proprio Santa Luzia',
            'Download validado por tamanho e SHA-256 antes da instalacao',
            'Chrome removido do fluxo de atualizacao nas novas builds',
            'Mantidas as melhorias offline, perfis, Liturgia, Formacao, Jornada, Biblioteca, Atrasos e Quiz da grande atualizacao'
          ]
          fs.writeFileSync(path, JSON.stringify(atual, null, 2) + '\n')
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/android-release.json
          git rm -f .github/ci-signing-bridge.cms.b64 .github/workflows/ephemeral-signing-bridge.yml .github/workflows/publish-android-105-secure.yml
          git commit -m 'Publica Android 1.0.5 com atualizador nativo corrigido'
          git push origin HEAD:main

      - name: Guardar APK final validado
        uses: actions/upload-artifact@v4
        with:
          name: santa-luzia-1.0.5-signed-original-key
          path: dist/Santa-Luzia-1.0.5.apk
          if-no-files-found: error
          retention-days: 30

      - name: Apagar ponte criptografica temporaria
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/android-signing" "$RUNNER_TEMP/signing-recovery.cms" "$RUNNER_TEMP/signing-recovery.zip" "$RUNNER_TEMP/bridge-private" "$RUNNER_TEMP/bridge-public" || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$BRIDGE_PRIVATE_ARTIFACT_ID" || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$BRIDGE_PUBLIC_ARTIFACT_ID" || true
