name: Publicar Santa Luzia 1.0.6 code 15 com chave original

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-android-106-code15-secure.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL || 'https://comunidade-santa-luzia-production.up.railway.app' }}
      AUTH_SECRET: ci-apenas-para-validacao-nao-usar-em-producao-123456789
      APP_VERSION_CODE: "15"
      APP_VERSION_NAME: "1.0.6"
      EXPECTED_CERT: 1602f064eed7dba5aca9c54e9cfb0a7a9850d18a426059566f3e725320866e18
      EXPECTED_CMS_SHA256: 32fbc391579342a0a3aeb07d6f5a0154e86fd3ea30f7456c5bac8dc435bb1106
      BRIDGE_RUN_ID: "32079761125"

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Registrar run id para acompanhamento
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ARQ="$RUNNER_TEMP/publish-code15-run-id.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$ARQ"
          CONTENT="$(base64 -w 0 "$ARQ")"
          PATH_API="repos/$GITHUB_REPOSITORY/contents/.github/publish-code15-run-id.txt"
          EXISTING="$(gh api "$PATH_API" --jq .sha 2>/dev/null || true)"
          ARGS=(--method PUT "$PATH_API" -f message='Registra execução temporária da publicação code 15' -f content="$CONTENT" -f branch=main)
          if [ -n "$EXISTING" ]; then ARGS+=(-f sha="$EXISTING"); fi
          gh api "${ARGS[@]}" >/dev/null

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restaurar cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validar configuracao e correcoes da build 15
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'require("./config/android-build.json").versionCode')" = "15"
          test "$(node -p 'require("./config/android-build.json").versionName')" = "1.0.6"
          test -f .github/bridge-code15-public-cert.pem
          test -f .github/ci-signing-bridge-code15.cms.b64
          test -f lib/referencia-biblica.ts
          grep -Fq 'Histórico de formações' components/formacao-membros.tsx
          grep -Fq 'A presença só poderá ser marcada no dia da formação.' app/api/formacoes/'[id]'/minha-presenca/route.ts
          grep -Fq 'santa-luzia:offline:v1:membro-dashboard' components/membro-area-content.tsx
          grep -Fq 'santa-luzia:offline:v1:meu-perfil' components/profile-settings.tsx
          grep -Fq 'normalizarReferenciaBiblica' lib/quiz-liturgia.ts
          grep -Fq 'MutationObserver' components/leitor-paginado.tsx
          test -n "$CAPACITOR_SERVER_URL"
          echo "$CAPACITOR_SERVER_URL" | grep -q '^https://'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Auditar robustez critica
        run: npm run audit:robustez

      - name: Validar aplicacao web e TypeScript
        run: npm run build

      - name: Criar e sincronizar Android
        shell: bash
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android
          APP_VERSION_CODE="$APP_VERSION_CODE" APP_VERSION_NAME="$APP_VERSION_NAME" node scripts/prepare-android.cjs
          grep -Eq 'applicationId[[:space:]]+"br\.com\.comunidadesantaluzia\.app"' android/app/build.gradle
          grep -Eq "versionCode[[:space:]]+${APP_VERSION_CODE}" android/app/build.gradle
          grep -Eq "versionName[[:space:]]+\"${APP_VERSION_NAME}\"" android/app/build.gradle
          test -f android/app/src/main/assets/public/whatajong/index.html
          test -f android/app/src/main/assets/public/whatajong/WHATAJONG-LICENSE.txt
          test -f android/app/src/main/java/br/com/comunidadesantaluzia/app/WhatajongActivity.java
          grep -Fq 'file:///android_asset/public/whatajong/index.html' android/app/src/main/java/br/com/comunidadesantaluzia/app/WhatajongActivity.java

      - name: Baixar chave privada efemera da ponte
        uses: actions/download-artifact@v4
        with:
          name: bridge-code15-private-key
          path: ${{ runner.temp }}/bridge-code15-private
          github-token: ${{ github.token }}
          run-id: 32079761125

      - name: Recuperar e validar chave original sem expor segredos
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/signing-code15"
          base64 --decode .github/ci-signing-bridge-code15.cms.b64 > "$RUNNER_TEMP/signing-code15/recovery.cms"
          ACTUAL_CMS_SHA="$(sha256sum "$RUNNER_TEMP/signing-code15/recovery.cms" | awk '{print $1}')"
          test "$ACTUAL_CMS_SHA" = "$EXPECTED_CMS_SHA256"
          test -f "$RUNNER_TEMP/bridge-code15-private/private.pem"
          openssl cms -decrypt -binary -inform DER \
            -in "$RUNNER_TEMP/signing-code15/recovery.cms" \
            -recip .github/bridge-code15-public-cert.pem \
            -inkey "$RUNNER_TEMP/bridge-code15-private/private.pem" \
            -out "$RUNNER_TEMP/signing-code15/recovery.zip"
          unzip -q "$RUNNER_TEMP/signing-code15/recovery.zip" -d "$RUNNER_TEMP/signing-code15/recovery"
          JKS="$RUNNER_TEMP/signing-code15/recovery/santa-luzia-release.jks"
          PASS_FILE="$RUNNER_TEMP/signing-code15/recovery/signing-password.txt"
          ALIAS_FILE="$RUNNER_TEMP/signing-code15/recovery/santa-luzia-signing-alias.txt"
          test -s "$JKS" && test -s "$PASS_FILE" && test -s "$ALIAS_FILE"
          PASS="$(tr -d '\r\n' < "$PASS_FILE")"
          ALIAS="$(tr -d '\r\n' < "$ALIAS_FILE")"
          echo "::add-mask::$PASS"
          test "$ALIAS" = "santa-luzia"
          keytool -list -v -keystore "$JKS" -storepass "$PASS" -alias "$ALIAS" > "$RUNNER_TEMP/signing-code15/key-info.txt"
          CERT="$(awk -F'SHA256: ' 'tolower($0) ~ /sha256:/ {print $2; exit}' "$RUNNER_TEMP/signing-code15/key-info.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$CERT" = "$EXPECTED_CERT"
          echo "KEYSTORE_PATH=$JKS" >> "$GITHUB_ENV"
          echo "SIGNING_PASSWORD_FILE=$PASS_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo 'Chave Android original validada pelo fingerprint historico.'

      - name: Configurar assinatura original
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(tr -d '\r\n' < "$SIGNING_PASSWORD_FILE")"
          echo "::add-mask::$PASS"
          ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH" \
          ANDROID_KEYSTORE_PASSWORD="$PASS" \
          ANDROID_KEY_ALIAS="$SIGNING_ALIAS" \
          ANDROID_KEY_PASSWORD="$PASS" \
          node scripts/configure-android-signing.cjs

      - name: Gerar APK assinado code 15
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          PASS="$(tr -d '\r\n' < "$SIGNING_PASSWORD_FILE")"
          echo "::add-mask::$PASS"
          for tentativa in 1 2 3; do
            if ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH" \
               ANDROID_KEYSTORE_PASSWORD="$PASS" \
               ANDROID_KEY_ALIAS="$SIGNING_ALIAS" \
               ANDROID_KEY_PASSWORD="$PASS" \
               ./gradlew assembleRelease --no-daemon; then
              exit 0
            fi
            if [ "$tentativa" -lt 3 ]; then sleep $((tentativa * 30)); fi
          done
          exit 1

      - name: Validar APK final, versao, assinatura e conteudo local
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner-code15.txt"
          CERT="$(awk -F': ' 'tolower($0) ~ /certificate sha-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/apksigner-code15.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$CERT" = "$EXPECTED_CERT"
          BADGING="$($AAPT dump badging "$APK" | head -1)"
          echo "$BADGING" | grep -Fq "name='br.com.comunidadesantaluzia.app'"
          echo "$BADGING" | grep -Fq "versionCode='15'"
          echo "$BADGING" | grep -Fq "versionName='1.0.6'"
          unzip -l "$APK" | grep -Fq 'assets/public/whatajong/index.html'
          unzip -l "$APK" | grep -Fq 'assets/public/whatajong/WHATAJONG-LICENSE.txt'
          echo "FINAL_APK=$APK" >> "$GITHUB_ENV"

      - name: Preparar arquivos oficiais
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$FINAL_APK" dist/santa-luzia.apk
          cp "$FINAL_APK" "dist/Santa-Luzia-${APP_VERSION_NAME}.apk"
          (cd dist && sha256sum santa-luzia.apk > santa-luzia.apk.sha256)
          (cd dist && sha256sum "Santa-Luzia-${APP_VERSION_NAME}.apk" > "Santa-Luzia-${APP_VERSION_NAME}.apk.sha256")
          echo "APK_SHA256=$(sha256sum dist/santa-luzia.apk | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c%s dist/santa-luzia.apk)" >> "$GITHUB_ENV"

      - name: Guardar APK assinado como artefato de seguranca
        uses: actions/upload-artifact@v4
        with:
          name: Santa-Luzia-1.0.6-code15-assinado
          path: |
            dist/santa-luzia.apk
            dist/Santa-Luzia-1.0.6.apk
            dist/santa-luzia.apk.sha256
            dist/Santa-Luzia-1.0.6.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Substituir release oficial 1.0.6 pela build code 15
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-v1.0.6"
          NOTES="Santa Luzia 1.0.6 — build interna 15. Corrige o fluxo de Formações para manter apenas a próxima formação e mover as realizadas para o Histórico; bloqueia a marcação de presença fora do dia correto no cliente e no servidor; preserva o painel do membro com o mesmo layout quando estiver offline; estabiliza a rolagem da Liturgia e organiza referências bíblicas e números de versículos, usando as mesmas referências no Quiz. Mantém Joias da Luz e Whatajong locais/offline. APK assinada com a mesma chave original e validada pelo certificado histórico."
          gh release upload "$TAG" \
            dist/santa-luzia.apk \
            dist/Santa-Luzia-1.0.6.apk \
            dist/santa-luzia.apk.sha256 \
            dist/Santa-Luzia-1.0.6.apk.sha256 \
            --clobber
          gh release edit "$TAG" --latest --title "Santa Luzia Android 1.0.6" --notes "$NOTES"

      - name: Registrar resultado temporario da publicacao
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$RUNNER_TEMP/publish-code15-result.json"
          printf '{\n  "versionCode": 15,\n  "versionName": "1.0.6",\n  "apkSize": %s,\n  "apkSha256": "%s",\n  "certificateSha256": "%s",\n  "runId": %s\n}\n' \
            "$APK_SIZE" "$APK_SHA256" "$EXPECTED_CERT" "$GITHUB_RUN_ID" > "$RESULT"
          CONTENT="$(base64 -w 0 "$RESULT")"
          PATH_API="repos/$GITHUB_REPOSITORY/contents/.github/publish-code15-result.json"
          EXISTING="$(gh api "$PATH_API" --jq .sha 2>/dev/null || true)"
          ARGS=(--method PUT "$PATH_API" -f message='Registra resultado temporário da publicação code 15' -f content="$CONTENT" -f branch=main)
          if [ -n "$EXISTING" ]; then ARGS+=(-f sha="$EXISTING"); fi
          gh api "${ARGS[@]}" >/dev/null

      - name: Limpar material sensivel do runner
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/signing-code15" "$RUNNER_TEMP/bridge-code15-private" || true
