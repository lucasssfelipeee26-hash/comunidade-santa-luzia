name: Ponte temporaria de assinatura Android code 15

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ephemeral-signing-bridge-code15.yml

permissions:
  contents: write
  actions: read

jobs:
  gerar-ponte:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Gerar chave RSA temporaria
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/bridge-code15"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/bridge-code15/private.pem"
          openssl req -new -x509 \
            -key "$RUNNER_TEMP/bridge-code15/private.pem" \
            -out "$RUNNER_TEMP/bridge-code15/public-cert.pem" \
            -days 1 \
            -subj '/CN=Santa Luzia Ephemeral Signing Bridge Code 15'
          chmod 600 "$RUNNER_TEMP/bridge-code15/private.pem"

      - name: Guardar chave privada temporaria somente como artefato
        uses: actions/upload-artifact@v4
        with:
          name: bridge-code15-private-key
          path: ${{ runner.temp }}/bridge-code15/private.pem
          retention-days: 1
          if-no-files-found: error

      - name: Guardar certificado publico como artefato
        uses: actions/upload-artifact@v4
        with:
          name: bridge-code15-public-cert
          path: ${{ runner.temp }}/bridge-code15/public-cert.pem
          retention-days: 1
          if-no-files-found: error

      - name: Publicar somente certificado publico e run id
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/bridge-code15/public-cert.pem" .github/bridge-code15-public-cert.pem
          printf '%s\n' "$GITHUB_RUN_ID" > .github/bridge-code15-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/bridge-code15-public-cert.pem .github/bridge-code15-run-id.txt
          git commit -m 'Publica certificado efemero para assinatura da build 15'
          git push origin HEAD:main
