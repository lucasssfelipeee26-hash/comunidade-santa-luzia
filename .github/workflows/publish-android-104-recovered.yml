name: Publicar Android 1.0.4 com assinatura recuperada

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-android-104-recovered.yml
      - native-assets/android/release/signature-patch-104/**
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publicar-android-104-recuperada
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_UNSIGNED_SIZE: "5997801"
      EXPECTED_UNSIGNED_SHA: a570312434dba09761fae610dae8a2f2fb0ba9dcbb0e912ccdb0e6d66190aa30
      EXPECTED_PATCH_SIZE: "45437"
      EXPECTED_PATCH_SHA: e55978e8f028b2ed5d5f2ad28f521a42c67313655d928ebb77a774c3d67af1
      EXPECTED_SIGNED_SIZE: "6047116"
      EXPECTED_SIGNED_SHA: dcd2a0cf96cb946b8e6926abd2aeadf07873a06a94f5c085acfd2212a06c2f0f
      EXPECTED_CERT_SHA: 1602f064eed7dba5aca9c54e9cfb0a7a9850d18a426059566f3e725320866e18

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar build 1.0.4 validado
        uses: actions/download-artifact@v4
        with:
          name: santa-luzia-1.0.4-unsigned
          path: source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31917263282

      - name: Reconstruir APK assinado e validar identidade original
        shell: bash
        run: |
          set -euo pipefail
          find source -maxdepth 4 -type f -print
          UNSIGNED="$(find source -type f -name '*.apk' -print -quit)"
          test -n "$UNSIGNED"
          SIGNED="/tmp/Santa-Luzia-1.0.4.apk"
          PATCH="/tmp/signature-104.patch.zst"

          ACTUAL_UNSIGNED_SIZE="$(stat -c%s "$UNSIGNED")"
          ACTUAL_UNSIGNED_SHA="$(sha256sum "$UNSIGNED" | awk '{print $1}')"
          echo "unsigned=$UNSIGNED size=$ACTUAL_UNSIGNED_SIZE sha256=$ACTUAL_UNSIGNED_SHA"
          test "$ACTUAL_UNSIGNED_SIZE" = "$EXPECTED_UNSIGNED_SIZE"
          test "$ACTUAL_UNSIGNED_SHA" = "$EXPECTED_UNSIGNED_SHA"

          cat native-assets/android/release/signature-patch-104/patch-*.b64 | base64 -d > "$PATCH"
          ACTUAL_PATCH_SIZE="$(stat -c%s "$PATCH")"
          ACTUAL_PATCH_SHA="$(sha256sum "$PATCH" | awk '{print $1}')"
          echo "patch size=$ACTUAL_PATCH_SIZE sha256=$ACTUAL_PATCH_SHA"
          test "$ACTUAL_PATCH_SIZE" = "$EXPECTED_PATCH_SIZE"
          test "$ACTUAL_PATCH_SHA" = "$EXPECTED_PATCH_SHA"

          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi
          zstd -d --patch-from="$UNSIGNED" "$PATCH" -o "$SIGNED"

          test "$(stat -c%s "$SIGNED")" = "$EXPECTED_SIGNED_SIZE"
          test "$(sha256sum "$SIGNED" | awk '{print $1}')" = "$EXPECTED_SIGNED_SHA"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f -print | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED" | tee /tmp/apksigner-104.txt
          CERT="$(grep -i 'certificate SHA-256 digest:' /tmp/apksigner-104.txt | head -1 | sed 's/.*: //' | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$CERT" = "$EXPECTED_CERT_SHA"
          grep -Eq 'Verified using v2 scheme.*true' /tmp/apksigner-104.txt
          grep -Eq 'Verified using v3 scheme.*true' /tmp/apksigner-104.txt
          cp "$SIGNED" /tmp/santa-luzia.apk
          printf '%s  %s\n' "$EXPECTED_SIGNED_SHA" "Santa-Luzia-1.0.4.apk" > /tmp/Santa-Luzia-1.0.4.apk.sha256

      - name: Atualizar distribuição oficial 1.0.4
        shell: bash
        run: |
          set -euo pipefail
          SIGNED="/tmp/Santa-Luzia-1.0.4.apk"

          rm -rf native-assets/android/release/parts
          mkdir -p native-assets/android/release/parts
          split -b 131072 -d -a 3 "$SIGNED" native-assets/android/release/parts/part-
          PARTS="$(find native-assets/android/release/parts -type f -name 'part-*' | wc -l | tr -d ' ')"
          test "$PARTS" = "47"

          cat > native-assets/android/release/manifest.json <<'JSON'
          {
            "versionCode": 5,
            "versionName": "1.0.4",
            "fileName": "Santa-Luzia-1.0.4.apk",
            "size": 6047116,
            "sha256": "dcd2a0cf96cb946b8e6926abd2aeadf07873a06a94f5c085acfd2212a06c2f0f",
            "parts": 47
          }
          JSON

          cat > config/android-release.json <<'JSON'
          {
            "versionCode": 5,
            "versionName": "1.0.4",
            "publishedAt": "2026-08-15",
            "required": false,
            "apkSize": 6047116,
            "apkSha256": "dcd2a0cf96cb946b8e6926abd2aeadf07873a06a94f5c085acfd2212a06c2f0f",
            "highlights": [
              "Perfis públicos da equipe com foto, bio, função e posição na Jornada",
              "Registros administrativos protegidos e visíveis somente aos moderadores",
              "Nova base offline para Liturgia, Escalas, Formação, Jornada, Biblioteca e Atrasos",
              "Quiz litúrgico e filas de sincronização preparados para funcionar sem internet",
              "Interface Android modernizada, seleção de texto corrigida e som padrão mais suave",
              "Atualizador interno com progresso, verificação de integridade e instalação pelo Android"
            ]
          }
          JSON

          node scripts/materializar-apk-android.cjs
          test "$(stat -c%s public/downloads/Santa-Luzia-1.0.4.apk)" = "$EXPECTED_SIGNED_SIZE"
          test "$(sha256sum public/downloads/Santa-Luzia-1.0.4.apk | awk '{print $1}')" = "$EXPECTED_SIGNED_SHA"

      - name: Guardar APK assinado validado
        uses: actions/upload-artifact@v4
        with:
          name: santa-luzia-1.0.4-signed-original-key
          path: /tmp/Santa-Luzia-1.0.4.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar metadados e partes na main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/android-release.json native-assets/android/release/manifest.json native-assets/android/release/parts
          git diff --cached --quiet && { echo "Nada para publicar"; exit 1; }
          git commit -m "Publica Android 1.0.4 assinado com chave original"
          git push origin HEAD:main

      - name: Criar release oficial 1.0.4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view android-v1.0.4 >/dev/null 2>&1 && gh release delete android-v1.0.4 --yes --cleanup-tag || true
          gh release create android-v1.0.4 \
            /tmp/santa-luzia.apk \
            /tmp/Santa-Luzia-1.0.4.apk \
            /tmp/Santa-Luzia-1.0.4.apk.sha256 \
            --target main \
            --title "Santa Luzia Android 1.0.4" \
            --notes "Grande atualização do Santa Luzia: perfis públicos com privacidade administrativa, nova base offline nativa, Liturgia/Escalas/Formação/Jornada/Biblioteca/Atrasos preparados para uso offline, quiz com sincronização segura, interface Android modernizada, som padrão mais suave e atualizador interno. APK assinado com a identidade original do aplicativo e validado por tamanho, SHA-256 e certificado." \
            --latest
