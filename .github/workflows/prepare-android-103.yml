name: Preparar Android 1.0.3 unsigned

on:
  push:
    branches:
      - agent/android-1.0.3-release

permissions:
  contents: read

concurrency:
  group: preparar-android-103-unsigned
  cancel-in-progress: true

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CAPACITOR_SERVER_URL: https://comunidade-santa-luzia-production.up.railway.app
      AUTH_SECRET: ci-apenas-para-validacao-nao-usar-em-producao-123456789
      APP_VERSION_CODE: 4
      APP_VERSION_NAME: 1.0.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar aplicação web
        run: npm run build
      - name: Criar e sincronizar Android
        run: |
          npx cap add android
          npx cap sync android
          node scripts/prepare-android.cjs
      - name: Gerar APK release sem assinatura
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Localizar APK unsigned
        run: |
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          sha256sum "$APK"
      - name: Guardar APK unsigned
        uses: actions/upload-artifact@v4
        with:
          name: santa-luzia-1.0.3-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
