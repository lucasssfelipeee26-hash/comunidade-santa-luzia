name: Exportar dependencia zipalign Android 37

on:
  push:
    branches:
      - agent/android-1.0.3-release

permissions:
  contents: read

concurrency:
  group: exportar-android-libcxx-103
  cancel-in-progress: true

jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Localizar biblioteca do Build Tools
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          LIBCXX="$(find "$TOOLS_DIR" -type f -name 'libc++.so' | head -1)"
          test -n "$LIBCXX"
          mkdir -p export
          cp "$LIBCXX" export/libc++.so
          echo "Build tools: $TOOLS_DIR"
          ls -l export/libc++.so
      - name: Guardar dependencia
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-libcxx
          path: export/libc++.so
          if-no-files-found: error
          retention-days: 1
