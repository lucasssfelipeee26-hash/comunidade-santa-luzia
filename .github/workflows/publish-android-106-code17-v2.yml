name: Publicar Santa Luzia 1.0.6 code 17 v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-android-106-code17-v2.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL || 'https://comunidade-santa-luzia-production.up.railway.app' }}
      AUTH_SECRET: ci-apenas-para-validacao-nao-usar-em-producao-123456789
      APP_VERSION_CODE: "17"
      APP_VERSION_NAME: "1.0.6"
      EXPECTED_CERT: 1602f064eed7dba5aca9c54e9cfb0a7a9850d18a426059566f3e725320866e18
      EXPECTED_CMS_SHA256: 966442d2eb4635792c180b2f6817c3a4ee5ccc46d57a0a911520c6db365a9a5a
      BRIDGE_RUN_ID: "32198477191"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Registrar run id v2
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '${{ github.run_id }}' > .github/publish-code17-v2-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/publish-code17-v2-run-id.txt
          git commit -m 'Registra segunda execucao da publicacao Android code 17'
          git push origin HEAD:main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restaurar cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validar configuracao code 17
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'require("./config/android-build.json").versionCode')" = "17"
          test "$(node -p 'require("./config/android-build.json").versionName')" = "1.0.6"
          test -f .github/bridge-code17-public-cert.pem
          test -f .github/ci-signing-bridge-code17.cms.b64
          test -f android-web/caminho-da-luz/index.html
          grep -Fq 'function renderBiblioteca' android-web/offline.html
          grep -Fq 'bottomTabs=[["inicio"' android-web/offline.html
          ! grep -Fq 'Tentar conectar' android-web/offline.html
          ! grep -Fq '"CONFIRMADA"' components/formacao-membros.tsx

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Auditar robustez e UX
        run: npm run audit:robustez

      - name: Build Next e validar nucleo offline
        run: npm run build

      - name: Criar e preparar Android
        shell: bash
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android
          APP_VERSION_CODE="$APP_VERSION_CODE" APP_VERSION_NAME="$APP_VERSION_NAME" node scripts/prepare-android.cjs
          grep -Eq "versionCode[[:space:]]+17" android/app/build.gradle
          grep -Eq 'versionName[[:space:]]+"1.0.6"' android/app/build.gradle
          test -f android/app/src/main/assets/public/offline.html
          test -f android/app/src/main/assets/public/caminho-da-luz/index.html
          ! grep -Fq 'Tentar conectar' android/app/src/main/assets/public/offline.html

      - name: Baixar chave privada efemera
        uses: actions/download-artifact@v4
        with:
          name: bridge-code17-private-key
          path: ${{ runner.temp }}/bridge-code17-private
          github-token: ${{ github.token }}
          run-id: 32198477191

      - name: Recuperar e validar chave Android original
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/signing-code17"
          base64 --decode .github/ci-signing-bridge-code17.cms.b64 > "$RUNNER_TEMP/signing-code17/recovery.cms"
          test "$(sha256sum "$RUNNER_TEMP/signing-code17/recovery.cms" | awk '{print $1}')" = "$EXPECTED_CMS_SHA256"
          openssl cms -decrypt -binary -inform DER \
            -in "$RUNNER_TEMP/signing-code17/recovery.cms" \
            -recip .github/bridge-code17-public-cert.pem \
            -inkey "$RUNNER_TEMP/bridge-code17-private/private.pem" \
            -out "$RUNNER_TEMP/signing-code17/recovery.zip"
          unzip -q "$RUNNER_TEMP/signing-code17/recovery.zip" -d "$RUNNER_TEMP/signing-code17/recovery"
          JKS="$RUNNER_TEMP/signing-code17/recovery/santa-luzia-release.jks"
          PASS_FILE="$RUNNER_TEMP/signing-code17/recovery/signing-password.txt"
          ALIAS_FILE="$RUNNER_TEMP/signing-code17/recovery/santa-luzia-signing-alias.txt"
          PASS="$(tr -d '\r\n' < "$PASS_FILE")"
          ALIAS="$(tr -d '\r\n' < "$ALIAS_FILE")"
          echo "::add-mask::$PASS"
          test "$ALIAS" = "santa-luzia"
          keytool -list -v -keystore "$JKS" -storepass "$PASS" -alias "$ALIAS" > "$RUNNER_TEMP/signing-code17/key-info.txt"
          CERT="$(awk -F'SHA256: ' 'tolower($0) ~ /sha256:/ {print $2; exit}' "$RUNNER_TEMP/signing-code17/key-info.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$CERT" = "$EXPECTED_CERT"
          echo "KEYSTORE_PATH=$JKS" >> "$GITHUB_ENV"
          echo "SIGNING_PASSWORD_FILE=$PASS_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Configurar assinatura original
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(tr -d '\r\n' < "$SIGNING_PASSWORD_FILE")"
          echo "::add-mask::$PASS"
          ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH" ANDROID_KEYSTORE_PASSWORD="$PASS" ANDROID_KEY_ALIAS="$SIGNING_ALIAS" ANDROID_KEY_PASSWORD="$PASS" node scripts/configure-android-signing.cjs

      - name: Gerar APK release assinada
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          PASS="$(tr -d '\r\n' < "$SIGNING_PASSWORD_FILE")"
          echo "::add-mask::$PASS"
          for tentativa in 1 2 3; do
            if ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH" ANDROID_KEYSTORE_PASSWORD="$PASS" ANDROID_KEY_ALIAS="$SIGNING_ALIAS" ANDROID_KEY_PASSWORD="$PASS" ./gradlew assembleRelease --no-daemon; then exit 0; fi
            [ "$tentativa" -eq 3 ] || sleep $((tentativa * 30))
          done
          exit 1

      - name: Validar APK final
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner-code17-v2.txt"
          CERT="$(awk -F': ' 'tolower($0) ~ /certificate sha-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/apksigner-code17-v2.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$CERT" = "$EXPECTED_CERT"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/badging-code17-v2.txt"
          grep -Eq "versionCode='17'.*versionName='1.0.6'" "$RUNNER_TEMP/badging-code17-v2.txt"
          unzip -l "$APK" | grep -Fq 'assets/public/offline.html'
          unzip -l "$APK" | grep -Fq 'assets/public/caminho-da-luz/index.html'
          echo "FINAL_APK=$APK" >> "$GITHUB_ENV"

      - name: Preparar APK oficial
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$FINAL_APK" dist/santa-luzia.apk
          cp "$FINAL_APK" dist/Santa-Luzia-1.0.6.apk
          (cd dist && sha256sum santa-luzia.apk > santa-luzia.apk.sha256)
          (cd dist && sha256sum Santa-Luzia-1.0.6.apk > Santa-Luzia-1.0.6.apk.sha256)
          echo "APK_SHA256=$(sha256sum dist/santa-luzia.apk | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c%s dist/santa-luzia.apk)" >> "$GITHUB_ENV"

      - name: Guardar APK assinada
        uses: actions/upload-artifact@v4
        with:
          name: Santa-Luzia-1.0.6-code17-assinado-v2
          path: |
            dist/santa-luzia.apk
            dist/Santa-Luzia-1.0.6.apk
            dist/santa-luzia.apk.sha256
            dist/Santa-Luzia-1.0.6.apk.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Publicar release 1.0.6 code 17
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-v1.0.6"
          NOTES="Santa Luzia 1.0.6 — build interna 17. Navegação autenticada com Início, Escala, Formação e Quiz; Visitante removido para contas logadas; modo local reorganizado sem telas de erro/reconexão; notificações com validade de 24 horas; Formação sem selo Confirmada; splash nativa marfim e barra de progresso mais visível. Assinada com a mesma chave Android original."
          gh release upload "$TAG" dist/santa-luzia.apk dist/Santa-Luzia-1.0.6.apk dist/santa-luzia.apk.sha256 dist/Santa-Luzia-1.0.6.apk.sha256 --clobber
          gh release edit "$TAG" --latest --title "Santa Luzia Android 1.0.6" --notes "$NOTES"

      - name: Atualizar metadados do atualizador
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const crypto = require('crypto')
          const path = 'config/android-release.json'
          const bytes = fs.readFileSync('dist/santa-luzia.apk')
          const atual = JSON.parse(fs.readFileSync(path, 'utf8'))
          atual.versionCode = 17
          atual.versionName = '1.0.6'
          atual.publishedAt = '2026-08-18'
          atual.required = false
          atual.apkSize = bytes.length
          atual.apkSha256 = crypto.createHash('sha256').update(bytes).digest('hex')
          atual.highlights = [
            'Navegação autenticada reorganizada para Início, Escala, Formação e Quiz, sem Visitante',
            'Modo local com a identidade do aplicativo e sem telas de Tentar conectar',
            'Notificações expiram após 24 horas e a central respeita a navegação inferior',
            'Formação sem selo Confirmada e presença liberada somente na data correta',
            'Splash marfim e barra de carregamento mais visível',
            'APK 1.0.6 code 17 assinada com a mesma chave Android original'
          ]
          fs.writeFileSync(path, JSON.stringify(atual, null, 2) + '\n')
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add config/android-release.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publica Android 1.0.6 code 17 apos auditoria completa'
            git push origin HEAD:main
          fi

      - name: Registrar resultado final code 17
        shell: bash
        run: |
          set -euo pipefail
          printf '{\n  "versionCode": 17,\n  "versionName": "1.0.6",\n  "apkSize": %s,\n  "apkSha256": "%s",\n  "certificateSha256": "%s",\n  "runId": %s\n}\n' "$APK_SIZE" "$APK_SHA256" "$EXPECTED_CERT" '${{ github.run_id }}' > .github/publish-code17-result.json
          git pull --rebase origin main
          git add .github/publish-code17-result.json
          git commit -m 'Registra resultado da publicacao Android code 17'
          git push origin HEAD:main

      - name: Limpar material sensivel do runner
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/signing-code17" "$RUNNER_TEMP/bridge-code17-private" || true
