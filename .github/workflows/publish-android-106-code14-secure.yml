name: Publicar Santa Luzia 1.0.6 code 14 com chave original

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-android-106-code14-secure.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL || 'https://comunidade-santa-luzia-production.up.railway.app' }}
      AUTH_SECRET: ci-apenas-para-validacao-nao-usar-em-producao-123456789
      APP_VERSION_CODE: "14"
      APP_VERSION_NAME: "1.0.6"
      EXPECTED_CERT: 1602f064eed7dba5aca9c54e9cfb0a7a9850d18a426059566f3e725320866e18
      EXPECTED_CMS_SHA256: 50ccd280f2abb916e80cb11b0f527949058706d3bd80cf04d57c7c5313332d1e
      BRIDGE_RUN_ID: "31968330318"

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restaurar cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validar configuracao da build 14
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'require("./config/android-build.json").versionCode')" = "14"
          test "$(node -p 'require("./config/android-build.json").versionName')" = "1.0.6"
          test -f scripts/build-whatajong-original.cjs
          test -f native-assets/whatajong/pt.ts
          test -f THIRD_PARTY_NOTICES.md
          test -f .github/bridge-code14-public-cert.pem
          test -f .github/ci-signing-bridge-code14.cms.b64
          test -n "$CAPACITOR_SERVER_URL"
          echo "$CAPACITOR_SERVER_URL" | grep -q '^https://'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Auditar robustez critica
        run: npm run audit:robustez

      - name: Validar aplicacao web
        run: npm run build

      - name: Criar e sincronizar Android com Whatajong original
        shell: bash
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android
          APP_VERSION_CODE="$APP_VERSION_CODE" APP_VERSION_NAME="$APP_VERSION_NAME" node scripts/prepare-android.cjs
          grep -Eq 'applicationId[[:space:]]+"br\.com\.comunidadesantaluzia\.app"' android/app/build.gradle
          grep -Eq "versionCode[[:space:]]+${APP_VERSION_CODE}" android/app/build.gradle
          grep -Eq "versionName[[:space:]]+\"${APP_VERSION_NAME}\"" android/app/build.gradle
          test -f android/app/src/main/assets/public/whatajong/index.html
          test -f android/app/src/main/assets/public/whatajong/build-info.json
          test -f android/app/src/main/assets/public/whatajong/WHATAJONG-LICENSE.txt
          test -f android/app/src/main/java/br/com/comunidadesantaluzia/app/WhatajongActivity.java
          test -f android/app/src/main/java/br/com/comunidadesantaluzia/app/WhatajongPlugin.java
          grep -Fq 'file:///android_asset/public/whatajong/index.html' android/app/src/main/java/br/com/comunidadesantaluzia/app/WhatajongActivity.java
          grep -Fq '"locale": "pt-BR"' android/app/src/main/assets/public/whatajong/build-info.json
          grep -Fq '"theme": "Santa Luzia rubi-ouro"' android/app/src/main/assets/public/whatajong/build-info.json

      - name: Baixar chave privada efemera da ponte
        uses: actions/download-artifact@v4
        with:
          name: bridge-code14-private-key
          path: ${{ runner.temp }}/bridge-code14-private
          github-token: ${{ github.token }}
          run-id: 31968330318

      - name: Recuperar e validar chave original sem expor segredos
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/signing-code14"
          base64 --decode .github/ci-signing-bridge-code14.cms.b64 > "$RUNNER_TEMP/signing-code14/recovery.cms"
          ACTUAL_CMS_SHA="$(sha256sum "$RUNNER_TEMP/signing-code14/recovery.cms" | awk '{print $1}')"
          test "$ACTUAL_CMS_SHA" = "$EXPECTED_CMS_SHA256"
          test -f "$RUNNER_TEMP/bridge-code14-private/private.pem"
          openssl cms -decrypt -binary -inform DER \
            -in "$RUNNER_TEMP/signing-code14/recovery.cms" \
            -recip .github/bridge-code14-public-cert.pem \
            -inkey "$RUNNER_TEMP/bridge-code14-private/private.pem" \
            -out "$RUNNER_TEMP/signing-code14/recovery.zip"
          unzip -q "$RUNNER_TEMP/signing-code14/recovery.zip" -d "$RUNNER_TEMP/signing-code14/recovery"
          JKS="$RUNNER_TEMP/signing-code14/recovery/santa-luzia-release.jks"
          PASS_FILE="$RUNNER_TEMP/signing-code14/recovery/signing-password.txt"
          ALIAS_FILE="$RUNNER_TEMP/signing-code14/recovery/santa-luzia-signing-alias.txt"
          test -s "$JKS"
          test -s "$PASS_FILE"
          test -s "$ALIAS_FILE"
          PASS="$(tr -d '\r\n' < "$PASS_FILE")"
          ALIAS="$(tr -d '\r\n' < "$ALIAS_FILE")"
          echo "::add-mask::$PASS"
          test "$ALIAS" = "santa-luzia"
          keytool -list -v -keystore "$JKS" -storepass "$PASS" -alias "$ALIAS" > "$RUNNER_TEMP/signing-code14/key-info.txt"
          CERT="$(awk -F'SHA256: ' 'tolower($0) ~ /sha256:/ {print $2; exit}' "$RUNNER_TEMP/signing-code14/key-info.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$CERT" = "$EXPECTED_CERT"
          echo "KEYSTORE_PATH=$JKS" >> "$GITHUB_ENV"
          echo "SIGNING_PASSWORD_FILE=$PASS_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo 'Chave original da 1.0.5 validada pelo fingerprint historico.'

      - name: Configurar assinatura original
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(tr -d '\r\n' < "$SIGNING_PASSWORD_FILE")"
          echo "::add-mask::$PASS"
          ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH" \
          ANDROID_KEYSTORE_PASSWORD="$PASS" \
          ANDROID_KEY_ALIAS="$SIGNING_ALIAS" \
          ANDROID_KEY_PASSWORD="$PASS" \
          node scripts/configure-android-signing.cjs

      - name: Gerar APK assinado code 14
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          PASS="$(tr -d '\r\n' < "$SIGNING_PASSWORD_FILE")"
          echo "::add-mask::$PASS"
          for tentativa in 1 2 3; do
            if ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH" \
               ANDROID_KEYSTORE_PASSWORD="$PASS" \
               ANDROID_KEY_ALIAS="$SIGNING_ALIAS" \
               ANDROID_KEY_PASSWORD="$PASS" \
               ./gradlew assembleRelease --no-daemon; then
              exit 0
            fi
            if [ "$tentativa" -lt 3 ]; then
              espera=$((tentativa * 30))
              echo "Gradle falhou na tentativa ${tentativa}; aguardando ${espera}s."
              sleep "$espera"
            fi
          done
          exit 1

      - name: Validar APK final, assinatura e conteudo local
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner-code14.txt"
          CERT="$(awk -F': ' 'tolower($0) ~ /certificate sha-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/apksigner-code14.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$CERT" = "$EXPECTED_CERT"
          unzip -l "$APK" | grep -Fq 'assets/public/whatajong/index.html'
          unzip -l "$APK" | grep -Fq 'assets/public/whatajong/build-info.json'
          unzip -l "$APK" | grep -Fq 'assets/public/whatajong/WHATAJONG-LICENSE.txt'
          MP3_COUNT="$(unzip -Z1 "$APK" | grep -E '^assets/public/whatajong/assets/.*\.mp3$' | wc -l | tr -d ' ')"
          test "$MP3_COUNT" -ge 30
          unzip -p "$APK" assets/public/whatajong/build-info.json | grep -Fq '"locale": "pt-BR"'
          unzip -p "$APK" assets/public/whatajong/build-info.json | grep -Fq '"theme": "Santa Luzia rubi-ouro"'
          echo "FINAL_APK=$APK" >> "$GITHUB_ENV"
          echo "Whatajong validado no APK com ${MP3_COUNT} arquivos MP3 locais."

      - name: Preparar arquivos oficiais
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$FINAL_APK" dist/santa-luzia.apk
          cp "$FINAL_APK" "dist/Santa-Luzia-${APP_VERSION_NAME}.apk"
          (cd dist && sha256sum santa-luzia.apk > santa-luzia.apk.sha256)
          (cd dist && sha256sum "Santa-Luzia-${APP_VERSION_NAME}.apk" > "Santa-Luzia-${APP_VERSION_NAME}.apk.sha256")
          echo "APK_SHA256=$(sha256sum dist/santa-luzia.apk | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c%s dist/santa-luzia.apk)" >> "$GITHUB_ENV"

      - name: Guardar APK assinado como artefato de seguranca
        uses: actions/upload-artifact@v4
        with:
          name: Santa-Luzia-1.0.6-code14-assinado
          path: |
            dist/santa-luzia.apk
            dist/Santa-Luzia-1.0.6.apk
            dist/santa-luzia.apk.sha256
            dist/Santa-Luzia-1.0.6.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publicar release oficial 1.0.6 code 14
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-v${APP_VERSION_NAME}"
          NOTES="Santa Luzia ${APP_VERSION_NAME} — build interna ${APP_VERSION_CODE}. Corrige o Whatajong para usar o jogo-base original apresentado, totalmente em português do Brasil e com identidade Santa Luzia em rubi/vinho/dourado/marfim. Mantém peças ilustradas, animações, partículas, loja, recompensas, poderes, músicas e efeitos sonoros locais. O jogo fica empacotado dentro do APK e funciona offline; a pontuação sincroniza com o ranking quando houver conexão. APK assinado com a mesma chave original da 1.0.5 e validado pelo certificado histórico."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/santa-luzia.apk \
              "dist/Santa-Luzia-${APP_VERSION_NAME}.apk" \
              dist/santa-luzia.apk.sha256 \
              "dist/Santa-Luzia-${APP_VERSION_NAME}.apk.sha256" \
              --clobber
            gh release edit "$TAG" --latest --title "Santa Luzia Android ${APP_VERSION_NAME}" --notes "$NOTES"
          else
            gh release create "$TAG" \
              dist/santa-luzia.apk \
              "dist/Santa-Luzia-${APP_VERSION_NAME}.apk" \
              dist/santa-luzia.apk.sha256 \
              "dist/Santa-Luzia-${APP_VERSION_NAME}.apk.sha256" \
              --target main --latest \
              --title "Santa Luzia Android ${APP_VERSION_NAME}" \
              --notes "$NOTES"
          fi

      - name: Atualizar metadados do atualizador para code 14
        env:
          RELEASE_DATE: "2026-08-16"
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const crypto = require('crypto')
          const path = 'config/android-release.json'
          const apk = 'dist/santa-luzia.apk'
          const atual = JSON.parse(fs.readFileSync(path, 'utf8'))
          const bytes = fs.readFileSync(apk)
          atual.versionCode = 14
          atual.versionName = '1.0.6'
          atual.publishedAt = process.env.RELEASE_DATE
          atual.required = false
          atual.apkSize = bytes.length
          atual.apkSha256 = crypto.createHash('sha256').update(bytes).digest('hex')
          atual.highlights = [
            'Whatajong completo baseado no jogo original apresentado, totalmente em português do Brasil',
            'Tema Santa Luzia em rubi, vinho, dourado e marfim, mantendo peças, animações, partículas, loja, recompensas e poderes',
            'Músicas e efeitos sonoros permanecem dentro do APK para funcionamento offline',
            'Pontuação do Whatajong integrada ao ranking do Santa Luzia e sincronizada quando houver conexão',
            'APK 1.0.6 code 14 assinado com a mesma chave original da versão 1.0.5'
          ]
          fs.writeFileSync(path, JSON.stringify(atual, null, 2) + '\n')
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add config/android-release.json
          if git diff --cached --quiet; then
            echo 'Metadados ja estavam atualizados.'
          else
            git commit -m "Publica Android 1.0.6 code 14 com Whatajong original"
            git push origin HEAD:main
          fi

      - name: Limpar material sensivel do runner
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/signing-code14" "$RUNNER_TEMP/bridge-code14-private" || true
