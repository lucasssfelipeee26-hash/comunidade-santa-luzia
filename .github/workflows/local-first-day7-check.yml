name: Local-first Dia 7 — auditoria Android final

on:
  push:
    branches:
      - agent/local-first-day7-final
    paths:
      - scripts/day7-apply-offline-github-updater.cjs
      - config/android-build.json
      - .github/workflows/local-first-day7-check.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AUTH_SECRET: ci-local-first-dia7-12345678901234567890
      CAPACITOR_SERVER_URL: https://comunidade-santa-luzia-production.up.railway.app
      APP_VERSION_CODE: 18
      APP_VERSION_NAME: 1.0.6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-first-day7-final
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Aplicar auditoria final e compilar Android
        shell: bash
        run: |
          set +e
          node scripts/day7-apply-offline-github-updater.cjs
          CODEMOD=$?
          INSTALL=99; TYPESCRIPT=99; AUDIT=99; WEBBUILD=99; ANDROIDPREP=99; ANDROIDBUILD=99; FINALCHECK=99
          if [ "$CODEMOD" -eq 0 ]; then npm install --no-audit --no-fund; INSTALL=$?; fi
          if [ "$INSTALL" -eq 0 ]; then
            npx tsc --noEmit; TYPESCRIPT=$?
            npm run audit:robustez; AUDIT=$?
            npm run build; WEBBUILD=$?
          fi
          if [ "$WEBBUILD" -eq 0 ]; then
            npx cap add android && npx cap sync android && node scripts/prepare-android.cjs
            ANDROIDPREP=$?
          fi
          if [ "$ANDROIDPREP" -eq 0 ]; then
            (cd android && ./gradlew assembleRelease --no-daemon)
            ANDROIDBUILD=$?
          fi
          grep -Fq 'versionCode": 18' config/android-build.json \
            && grep -Fq 'UPDATE_MANIFEST="https://raw.githubusercontent.com/' android-web/offline.html \
            && grep -Fq 'AppUpdater' android-web/offline.html \
            && grep -Fq 'tryRemoteServer' android-web/offline.html \
            && grep -Fq 'SQLiteOpenHelper' native-assets/android/src/main/java/br/com/comunidadesantaluzia/app/OfflineStorePlugin.java \
            && grep -Fq 'AndroidUpdateGithubRuntime' components/app-runtime.tsx \
            && grep -Fq 'const INTERVALO_STATUS = 60_000' components/server-sync-runtime.tsx \
            && grep -Fq 'notificacao-lida' lib/local-first-queue.ts
          FINALCHECK=$?
          export CODEMOD INSTALL TYPESCRIPT AUDIT WEBBUILD ANDROIDPREP ANDROIDBUILD FINALCHECK
          node <<'NODE'
          const fs=require('fs'); const n=k=>Number(process.env[k]);
          const r={checkedAt:new Date().toISOString(),codemodExit:n('CODEMOD'),installExit:n('INSTALL'),typescriptExit:n('TYPESCRIPT'),auditExit:n('AUDIT'),webBuildExit:n('WEBBUILD'),androidPrepareExit:n('ANDROIDPREP'),androidBuildExit:n('ANDROIDBUILD'),finalCheckExit:n('FINALCHECK')};
          r.ok=Object.entries(r).filter(([k])=>k.endsWith('Exit')).every(([,v])=>v===0);
          fs.writeFileSync('.github/local-first-day7-validation.json',JSON.stringify(r,null,2)+'\n');console.log(JSON.stringify(r,null,2));
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-web/offline.html .github/local-first-day7-validation.json
          git commit -m 'Aplica auditoria final local-first code 18' || true
          git pull --rebase origin agent/local-first-day7-final
          git push origin HEAD:agent/local-first-day7-final
          test "$CODEMOD" -eq 0 && test "$INSTALL" -eq 0 && test "$TYPESCRIPT" -eq 0 && test "$AUDIT" -eq 0 && test "$WEBBUILD" -eq 0 && test "$ANDROIDPREP" -eq 0 && test "$ANDROIDBUILD" -eq 0 && test "$FINALCHECK" -eq 0
