name: Temporário — corrigir job assinatura code 18

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-fix-sign-code18.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remover cache npm incompatível com projeto sem lockfile
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^[[:space:]]*cache: npm$/d' .github/workflows/temp-sign-publish-code18.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/temp-sign-publish-code18.yml
          git commit -m 'Corrige setup Node da assinatura code 18'
          git pull --rebase origin main
          git push origin HEAD:main
