name: Temporário — acompanhar segunda assinatura code 18

on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-watch-sign-code18-v2.yml]

permissions:
  actions: read
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --workflow temp-sign-publish-code18.yml --limit 1 --json databaseId,status,conclusion,headSha,createdAt,updatedAt > .github/temp-watch-sign-code18-v2.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/temp-watch-sign-code18-v2.json
          git commit -m 'Registra segunda tentativa da assinatura code 18'
          git pull --rebase origin main
          git push origin HEAD:main
