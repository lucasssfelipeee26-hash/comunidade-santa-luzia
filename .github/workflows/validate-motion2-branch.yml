name: Validar Santa Luzia Motion 2.0

on:
  push:
    branches: [feature/santa-luzia-motion-2]
    paths:
      - .github/workflows/validate-motion2-branch.yml
      - components/motion-2-runtime.tsx
      - components/motion-2-update-banner.tsx
      - components/android-update-router-runtime.tsx
      - components/app-runtime.tsx
      - components/pull-to-refresh.tsx
      - app/loading.tsx
      - config/android-build.json
      - package.json
      - lib/app-release.ts
      - scripts/auditar-ux-106.cjs

permissions:
  contents: write

concurrency:
  group: validate-motion2-branch
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AUTH_SECRET: ci-motion2-validation-12345678901234567890
      CAPACITOR_SERVER_URL: https://comunidade-santa-luzia-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Executar validação completa
        shell: bash
        run: |
          set +e
          RESULTADO=success
          FALHOU_EM=""
          : > "$RUNNER_TEMP/motion-validation.log"

          npm install --no-audit --no-fund > "$RUNNER_TEMP/check.log" 2>&1
          CODE=$?
          cat "$RUNNER_TEMP/check.log"
          if [ $CODE -ne 0 ]; then RESULTADO=failure; FALHOU_EM="npm-install"; cp "$RUNNER_TEMP/check.log" "$RUNNER_TEMP/motion-validation.log"; fi

          if [ "$RESULTADO" = success ]; then
            npx tsc --noEmit > "$RUNNER_TEMP/check.log" 2>&1
            CODE=$?
            cat "$RUNNER_TEMP/check.log"
            if [ $CODE -ne 0 ]; then RESULTADO=failure; FALHOU_EM="typescript"; cp "$RUNNER_TEMP/check.log" "$RUNNER_TEMP/motion-validation.log"; fi
          fi

          if [ "$RESULTADO" = success ]; then
            npm run audit:robustez > "$RUNNER_TEMP/check.log" 2>&1
            CODE=$?
            cat "$RUNNER_TEMP/check.log"
            if [ $CODE -ne 0 ]; then RESULTADO=failure; FALHOU_EM="audit-robustez"; cp "$RUNNER_TEMP/check.log" "$RUNNER_TEMP/motion-validation.log"; fi
          fi

          if [ "$RESULTADO" = success ]; then
            npm run build > "$RUNNER_TEMP/check.log" 2>&1
            CODE=$?
            cat "$RUNNER_TEMP/check.log"
            if [ $CODE -ne 0 ]; then RESULTADO=failure; FALHOU_EM="next-build"; cp "$RUNNER_TEMP/check.log" "$RUNNER_TEMP/motion-validation.log"; fi
          fi

          echo "RESULTADO=$RESULTADO" >> "$GITHUB_ENV"
          echo "FALHOU_EM=$FALHOU_EM" >> "$GITHUB_ENV"
      - name: Registrar resultado na branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const logPath = process.env.RUNNER_TEMP + '/motion-validation.log'
          const details = fs.existsSync(logPath) ? fs.readFileSync(logPath,'utf8').trim().slice(-6000) : ''
          const path = '.github/motion2-validation-result.json'
          const result = {
            validatedAt: new Date().toISOString(),
            branch: 'feature/santa-luzia-motion-2',
            versionName: '2.0.0',
            versionCode: 19,
            result: process.env.RESULTADO || 'failure',
            failedAt: process.env.FALHOU_EM || null,
            checks: ['npm-install','typescript','audit-robustez','next-build'],
            details: details || null
          }
          fs.writeFileSync(path, JSON.stringify(result,null,2)+'\n')
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/motion2-validation-result.json
          if ! git diff --cached --quiet; then
            git commit -m "Registra validação Motion 2.0: ${RESULTADO:-failure}"
            git push origin HEAD:feature/santa-luzia-motion-2
          fi
      - name: Falhar job se validação falhou
        if: always()
        shell: bash
        run: test "${RESULTADO:-failure}" = success
