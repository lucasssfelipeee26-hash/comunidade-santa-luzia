name: Windows Beta EXE

on:
  push:
    branches:
      - main
      - feature/windows-beta
    paths:
      - electron/**
      - components/windows-beta-runtime.tsx
      - app/windows-beta.css
      - app/layout.tsx
      - components/app-runtime.tsx
      - config/windows-beta.json
      - electron-builder.config.cjs
      - package.json
      - .github/workflows/windows-beta-release.yml
  pull_request:
    branches:
      - main
    paths:
      - electron/**
      - components/windows-beta-runtime.tsx
      - app/windows-beta.css
      - app/layout.tsx
      - components/app-runtime.tsx
      - config/windows-beta.json
      - electron-builder.config.cjs
      - package.json
      - .github/workflows/windows-beta-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-beta:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      AUTH_SECRET: ci-windows-beta-santa-luzia-12345678901234567890
      CAPACITOR_SERVER_URL: https://comunidade-santa-luzia-production.up.railway.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Validar TypeScript
        shell: pwsh
        run: npx tsc --noEmit

      - name: Auditar robustez
        shell: pwsh
        run: npm run audit:robustez

      - name: Gerar build web
        shell: pwsh
        run: npm run build

      - name: Gerar EXE portátil da Beta Windows
        shell: pwsh
        run: npm run windows:beta:dist

      - name: Validar artefato Windows
        shell: pwsh
        run: |
          $beta = Get-Content config/windows-beta.json | ConvertFrom-Json
          $exe = Get-ChildItem dist-windows -Filter "Santa-Luzia-Beta-Windows-$($beta.versionName)-x64.exe" | Select-Object -First 1
          if (-not $exe) { throw "EXE da Beta Windows não foi gerado." }
          if ($exe.Length -lt 20MB) { throw "EXE gerado é menor que o esperado: $($exe.Length) bytes" }
          $sha = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "WINDOWS_BETA_VERSION=$($beta.versionName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_BETA_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_BETA_EXE_NAME=$($exe.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_BETA_SIZE=$($exe.Length)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_BETA_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Guardar EXE para teste
        uses: actions/upload-artifact@v4
        with:
          name: santa-luzia-windows-beta-${{ env.WINDOWS_BETA_VERSION }}
          path: dist-windows/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publicar prerelease da Beta Windows
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-beta-v$env:WINDOWS_BETA_VERSION"
          $notes = @"
          Santa Luzia Beta para Windows — $env:WINDOWS_BETA_VERSION

          Canal exclusivo para testar alterações antes de levá-las ao Android.
          - executável portátil x64 (.exe);
          - identifica-se como SantaLuziaWindowsBeta;
          - interface Beta pode ser ativada somente neste cliente;
          - Android 1.0.6 / code 18 permanece no canal estável;
          - esta release é prerelease e não substitui a release latest do Android.

          Observação: por ser uma Beta interna ainda sem certificado de assinatura de código do Windows, o Windows pode exibir aviso de editor desconhecido ao abrir o executável.
          "@
          $notes | Set-Content -Path "$env:RUNNER_TEMP\windows-beta-notes.md" -Encoding utf8
          if (gh release view $tag 2>$null) {
            gh release upload $tag "$env:WINDOWS_BETA_EXE" --clobber
            gh release edit $tag --prerelease --title "Santa Luzia Beta Windows $env:WINDOWS_BETA_VERSION" --notes-file "$env:RUNNER_TEMP\windows-beta-notes.md"
          } else {
            gh release create $tag "$env:WINDOWS_BETA_EXE" --prerelease --title "Santa Luzia Beta Windows $env:WINDOWS_BETA_VERSION" --notes-file "$env:RUNNER_TEMP\windows-beta-notes.md"
          }

      - name: Registrar recibo da publicação Windows Beta
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $receipt = [ordered]@{
            publishedAt = (Get-Date).ToUniversalTime().ToString("o")
            channel = "windows-beta"
            versionName = $env:WINDOWS_BETA_VERSION
            buildNumber = (Get-Content config/windows-beta.json | ConvertFrom-Json).buildNumber
            artifact = $env:WINDOWS_BETA_EXE_NAME
            artifactSize = [int64]$env:WINDOWS_BETA_SIZE
            artifactSha256 = $env:WINDOWS_BETA_SHA256
            releaseTag = "windows-beta-v$env:WINDOWS_BETA_VERSION"
            prerelease = $true
            androidStableVersionName = "1.0.6"
            androidStableVersionCode = 18
          }
          $receipt | ConvertTo-Json | Set-Content -Path .github/windows-beta-result.json -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/windows-beta-result.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "Publica Santa Luzia Beta Windows $env:WINDOWS_BETA_VERSION"
            git pull --rebase origin main
            git push origin HEAD:main
          }
