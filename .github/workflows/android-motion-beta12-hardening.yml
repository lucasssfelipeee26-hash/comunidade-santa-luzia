name: Android — Santa Luzia Motion Beta 12 Hardening

on:
  push:
    branches:
      - work/android-motion-beta12-hardening-audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-motion-beta12-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta12-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SANTA_LUZIA_MOTION_BETA: "1"
      AUTH_SECRET: ci-motion-beta-santa-luzia-12345678901234567890
      MOTION_BETA_KEYSTORE: /home/runner/.android/santa-luzia-motion-beta.keystore
      MOTION_BETA_STORE_PASSWORD: android
      MOTION_BETA_KEY_ALIAS: santa-luzia-motion-beta
      MOTION_BETA_KEY_PASSWORD: android

    steps:
      - name: Checkout Beta 12
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restaurar Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-motion-beta12-hardening-gradle-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-motion-beta12-gradle-
            ${{ runner.os }}-motion-beta11-gradle-
            ${{ runner.os }}-gradle-

      - name: Restaurar assinatura persistente da Beta
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/santa-luzia-motion-beta.keystore
          key: santa-luzia-motion-beta-keystore-v2

      - name: Validar assinatura Beta 11+
        run: |
          set -euo pipefail
          test -s "$MOTION_BETA_KEYSTORE"
          keytool -list -keystore "$MOTION_BETA_KEYSTORE" -storepass "$MOTION_BETA_STORE_PASSWORD" -alias "$MOTION_BETA_KEY_ALIAS" >/dev/null
          EXPECTED="$(keytool -exportcert -keystore "$MOTION_BETA_KEYSTORE" -storepass "$MOTION_BETA_STORE_PASSWORD" -alias "$MOTION_BETA_KEY_ALIAS" | sha256sum | awk '{print $1}')"
          test "$EXPECTED" = "0cf42dad25bd2673c81c6e47b87b77d5581c3de5cf23552e23088bdc447a4a21"
          echo "MOTION_EXPECTED_CERT=$EXPECTED" >> "$GITHUB_ENV"

      - name: Carregar configuração
        run: |
          node <<'NODE'
          const fs = require('fs')
          const c = require('./config/android-motion-beta.json')
          if (c.versionName !== '2.0.0-beta.12' || c.versionCode !== 20012) throw new Error('Configuração Beta 12 incorreta')
          const vars = {
            APP_VERSION_CODE: c.versionCode,
            APP_VERSION_NAME: c.versionName,
            SANTA_LUZIA_MOTION_VERSION: c.versionName,
            MOTION_APP_ID: c.applicationId,
            WINDOWS_BETA_COMMIT: c.windowsBeta.commit,
            SYNC_SERVER_URL: c.serverUrl,
          }
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(vars).map(([k,v]) => `${k}=${v}\n`).join(''))
          NODE

      - name: Instalar dependências
        run: npm install --include=dev --no-audit --no-fund

      - name: Validar JavaScript da Beta 12
        run: |
          set -euo pipefail
          for f in \
            android-web/motion/android-auditor-beta12.js \
            android-web/motion/android-db-health-beta12.js \
            android-web/motion/android-performance-beta12.js \
            android-web/motion/android-scroll-stability-beta12.js \
            android-web/motion/android-podium-beta12.js \
            scripts/build-android-local.cjs \
            scripts/prepare-motion-beta.cjs \
            scripts/validate-android-web.cjs \
            scripts/auditar-motion-beta.cjs \
            scripts/auditar-offline-beta12.cjs \
            scripts/auditar-icones-beta12.cjs; do node --check "$f"; done

      - name: Fixar Windows Beta 19
        run: node scripts/fetch-windows-beta-stack.cjs

      - name: Validar TypeScript
        run: npx tsc --noEmit

      - name: Auditar núcleo e requisitos Beta 12
        run: |
          node scripts/auditar-robustez.cjs
          npm run audit:offline
          node scripts/auditar-motion-beta.cjs
          node scripts/auditar-offline-beta12.cjs
          node scripts/auditar-icones-beta12.cjs
          grep -Fq 'data-team-profile-rail' components/equipe-no-painel.tsx
          grep -Fq 'AdministracaoModerador' components/moderador-dashboard.tsx
          grep -Fq 'resetar_ranking' app/api/app/admin-dados/route.ts
          grep -Fq 'excluir_cadastro' app/api/app/admin-dados/route.ts
          grep -Fq 'slDoorPersonEnterLoop' components/profile-door-icon.tsx
          grep -Fq 'slDoorPersonExitLoop' components/profile-door-icon.tsx
          grep -Fq 'object-contain object-center' components/hero.tsx
          grep -Fq 'data-original-home-icon' app/visitante/page.tsx
          grep -Fq 'DB_VERSION = 2' native-assets/android/src/main/java/br/com/comunidadesantaluzia/app/OfflineStorePlugin.java
          grep -Fq 'PRAGMA integrity_check' native-assets/android/src/main/java/br/com/comunidadesantaluzia/app/OfflineStorePlugin.java
          grep -Fq 'TABLE_BACKUPS' native-assets/android/src/main/java/br/com/comunidadesantaluzia/app/OfflineStorePlugin.java

      - name: Compilar Next de referência
        run: npm run build

      - name: Empacotar frontend local Android
        run: npm run build:android-local

      - name: Validar frontend local
        run: |
          node scripts/validate-android-web.cjs
          test -s android-web/local-app.js
          test "$(stat -c%s android-web/local-app.js)" -gt 250000
          for f in android-auditor-beta12.js android-db-health-beta12.js android-performance-beta12.js android-scroll-stability-beta12.js android-podium-beta12.js; do
            test -s "android-web/motion/$f"
            grep -Fq "$f" android-web/index.html
          done
          test ! -e android-web/offline.html
          test ! -e android-web/offline-bridge.html

      - name: Criar projeto Android e aplicar Beta
        run: |
          npx cap add android
          npx cap sync android
          APP_VERSION_CODE="$APP_VERSION_CODE" APP_VERSION_NAME="$APP_VERSION_NAME" node scripts/prepare-android.cjs
          node scripts/prepare-motion-beta.cjs

      - name: Validar projeto Android
        run: |
          set -euo pipefail
          grep -Eq "applicationId[[:space:]]+\"${MOTION_APP_ID//./\\.}\"" android/app/build.gradle
          grep -Eq "versionCode[[:space:]]+${APP_VERSION_CODE}" android/app/build.gradle
          grep -Fq "versionName \"${APP_VERSION_NAME}\"" android/app/build.gradle
          CONFIG=android/app/src/main/assets/capacitor.config.json
          if grep -Fq '"server"' "$CONFIG"; then echo 'ERRO: server.url presente' >&2; exit 1; fi
          for f in android-auditor-beta12.js android-db-health-beta12.js android-performance-beta12.js android-scroll-stability-beta12.js android-podium-beta12.js; do test -s "android/app/src/main/assets/public/motion/$f"; done
          STORE=android/app/src/main/java/br/com/comunidadesantaluzia/app/OfflineStorePlugin.java
          grep -Fq 'DB_VERSION = 2' "$STORE"
          grep -Fq 'setWriteAheadLoggingEnabled(true)' "$STORE"
          grep -Fq 'PRAGMA integrity_check' "$STORE"
          grep -Fq 'recoverDocument' "$STORE"

      - name: Compilar APK Beta 12
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Auditar APK final
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test "$(stat -c%s "$APK")" -gt 20000000
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -Fq "package: name='$MOTION_APP_ID' versionCode='$APP_VERSION_CODE' versionName='$APP_VERSION_NAME'" "$RUNNER_TEMP/badging.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/sign.txt"
          CERT="$(awk -F': ' 'tolower($0) ~ /certificate sha-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/sign.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$CERT" = "$MOTION_EXPECTED_CERT"
          unzip -l "$APK" > "$RUNNER_TEMP/files.txt"
          for f in android-auditor-beta12.js android-db-health-beta12.js android-performance-beta12.js android-scroll-stability-beta12.js android-podium-beta12.js; do grep -Fq "assets/public/motion/$f" "$RUNNER_TEMP/files.txt"; done
          unzip -p "$APK" assets/capacitor.config.json > "$RUNNER_TEMP/cap.json"
          if grep -Fq '"server"' "$RUNNER_TEMP/cap.json"; then echo 'ERRO: APK remoto' >&2; exit 1; fi
          mkdir -p dist
          cp "$APK" dist/Santa-Luzia-Motion-2.0-beta12.apk
          SHA="$(sha256sum dist/Santa-Luzia-Motion-2.0-beta12.apk | awk '{print $1}')"
          SIZE="$(stat -c%s dist/Santa-Luzia-Motion-2.0-beta12.apk)"
          cat > dist/RELATORIO-MOTION-BETA12.txt <<EOF
          Santa Luzia Motion Beta 12
          Versão: $APP_VERSION_NAME / code $APP_VERSION_CODE
          Pacote: $MOTION_APP_ID
          Tamanho: $SIZE bytes
          SHA-256: $SHA
          Certificado Beta SHA-256: $CERT
          Interface: React original local dentro do APK; sem server.url.
          Beta 12: Home compacta e banner original integral; ícones originais restaurados/animações; Perfil entrando e Logout saindo pela porta; perfis horizontais pesquisáveis; histórico de escalas; pódio atual deduplicado; estabilização de rolagem/transições/FPS; administração moderador; SQLite v2 com WAL, transações, backup anterior, recuperação e integrity_check; Auditor Santa Luzia e auditoria funcional offline.
          Android oficial 1.0.6/code18 preservado.
          EOF
          echo "APK_SHA=$SHA" >> "$GITHUB_ENV"
          echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "APK_CERT=$CERT" >> "$GITHUB_ENV"

      - name: Guardar APK Beta 12
        uses: actions/upload-artifact@v4
        with:
          name: santa-luzia-motion-2.0-beta12-hardening
          path: |
            dist/Santa-Luzia-Motion-2.0-beta12.apk
            dist/RELATORIO-MOTION-BETA12.txt
          if-no-files-found: error
          retention-days: 14

      - name: Resumo
        run: |
          echo '### Santa Luzia Motion Beta 12 Hardening' >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: $APK_SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: $APK_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Certificado: $APK_CERT" >> "$GITHUB_STEP_SUMMARY"
          echo '- Android oficial permaneceu intocado.' >> "$GITHUB_STEP_SUMMARY"
