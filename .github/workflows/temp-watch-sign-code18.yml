name: Temporário — acompanhar assinatura code 18

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-watch-sign-code18.yml

permissions:
  actions: read
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Registrar status do job de assinatura
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list --workflow temp-sign-publish-code18.yml --limit 1 --json databaseId,status,conclusion,headSha,createdAt,updatedAt > .github/temp-watch-sign-code18.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/temp-watch-sign-code18.json
          git commit -m 'Registra status temporário da assinatura code 18'
          git pull --rebase origin main
          git push origin HEAD:main
