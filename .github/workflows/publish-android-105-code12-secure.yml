name: Publicar Android 1.0.5 build interna 12 robusta

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-android-105-code12-secure.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: publicar-android-105-code12-seguro
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CAPACITOR_SERVER_URL: https://comunidade-santa-luzia-production.up.railway.app
      AUTH_SECRET: ci-apenas-para-validacao-nao-usar-em-producao-123456789
      APP_VERSION_CODE: '12'
      APP_VERSION_NAME: '1.0.5'
      EXPECTED_CERT: 1602f064eed7dba5aca9c54e9cfb0a7a9850d18a426059566f3e725320866e18
      BRIDGE_RUN_ID: '31959072179'
      BRIDGE_PRIVATE_ARTIFACT_ID: '9266741343'
      BRIDGE_PUBLIC_ARTIFACT_ID: '9266741213'
      ENCRYPTED_CMS_SHA256: eb0f3f08df4083292811bb76be0050402671e7f01261821752c851a5ca5763f2

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Baixar chave privada temporaria da ponte
        uses: actions/download-artifact@v4
        with:
          name: bridge-v8-private-key
          path: ${{ runner.temp }}/bridge-v8-private
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BRIDGE_RUN_ID }}

      - name: Baixar certificado publico da ponte
        uses: actions/download-artifact@v4
        with:
          name: bridge-v8-public-cert
          path: ${{ runner.temp }}/bridge-v8-public
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BRIDGE_RUN_ID }}

      - name: Recuperar e validar chave Android original somente no runner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          base64 --decode .github/ci-signing-bridge-v8.cms.b64 > "$RUNNER_TEMP/signing-recovery-v8.cms"
          printf '%s  %s\n' "$ENCRYPTED_CMS_SHA256" "$RUNNER_TEMP/signing-recovery-v8.cms" | sha256sum -c -
          openssl cms -decrypt -binary -inform DER \
            -in "$RUNNER_TEMP/signing-recovery-v8.cms" \
            -recip "$RUNNER_TEMP/bridge-v8-public/public-cert.pem" \
            -inkey "$RUNNER_TEMP/bridge-v8-private/private.pem" \
            -out "$RUNNER_TEMP/signing-recovery-v8.zip"
          mkdir -p "$RUNNER_TEMP/android-signing"
          unzip -q "$RUNNER_TEMP/signing-recovery-v8.zip" -d "$RUNNER_TEMP/android-signing"
          test -f "$RUNNER_TEMP/android-signing/santa-luzia-release.jks"
          test -f "$RUNNER_TEMP/android-signing/signing-password.txt"
          test "$(cat "$RUNNER_TEMP/android-signing/santa-luzia-signing-alias.txt")" = 'santa-luzia'
          chmod 600 "$RUNNER_TEMP/android-signing/santa-luzia-release.jks" "$RUNNER_TEMP/android-signing/signing-password.txt"
          keytool -list -v \
            -keystore "$RUNNER_TEMP/android-signing/santa-luzia-release.jks" \
            -storetype PKCS12 \
            -storepass:file "$RUNNER_TEMP/android-signing/signing-password.txt" \
            -alias santa-luzia > "$RUNNER_TEMP/key-info.txt"
          CERT="$(awk -F'SHA256: ' 'tolower($0) ~ /sha256:/ {print $2; exit}' "$RUNNER_TEMP/key-info.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$CERT" = "$EXPECTED_CERT"
          cp "$RUNNER_TEMP/android-signing/signing-password.txt" "$RUNNER_TEMP/android-signing/store-password.txt"
          cp "$RUNNER_TEMP/android-signing/signing-password.txt" "$RUNNER_TEMP/android-signing/key-password.txt"
          chmod 600 "$RUNNER_TEMP/android-signing/store-password.txt" "$RUNNER_TEMP/android-signing/key-password.txt"
          echo 'Chave original validada sem expor credenciais.'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Auditar robustez critica
        run: npm run audit:robustez

      - name: Validar aplicacao web
        run: npm run build

      - name: Criar e sincronizar Android 1.0.5 build 12
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          npx cap sync android
          node scripts/prepare-android.cjs
          grep -Eq 'applicationId[[:space:]]+"br\.com\.comunidadesantaluzia\.app"' android/app/build.gradle
          grep -Eq 'versionCode[[:space:]]+12' android/app/build.gradle
          grep -Eq 'versionName[[:space:]]+"1\.0\.5"' android/app/build.gradle
          test -f android/app/src/main/java/br/com/comunidadesantaluzia/app/AppUpdaterPlugin.java
          grep -Fq 'networkStatusChange' components/android-update-runtime.tsx
          grep -Fq 'appStateChange' components/android-update-runtime.tsx
          grep -Fq 'setHandleNativeActionModesEnabled(false)' android/app/src/main/java/br/com/comunidadesantaluzia/app/MainActivity.java
          ! grep -Fq '<item name="android:background">' android/app/src/main/res/values/styles.xml
          ! grep -Fq 'actionModeBackground' android/app/src/main/res/values/styles.xml
          ! grep -Fq 'actionMenuTextColor' android/app/src/main/res/values/styles.xml
          ! grep -Fq 'colorBackgroundFloating' android/app/src/main/res/values/styles.xml

      - name: Gerar APK release sem assinatura
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          for tentativa in 1 2 3; do
            if ./gradlew assembleRelease --no-daemon; then exit 0; fi
            if [ "$tentativa" -lt 3 ]; then
              espera=$((tentativa * 30))
              echo "Gradle falhou na tentativa ${tentativa}; aguardando ${espera}s antes de repetir."
              sleep "$espera"
            fi
          done
          exit 1

      - name: Assinar e validar APK com a chave original
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          UNSIGNED="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$UNSIGNED"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          KS="$RUNNER_TEMP/android-signing/santa-luzia-release.jks"
          STORE_PW="$RUNNER_TEMP/android-signing/store-password.txt"
          KEY_PW="$RUNNER_TEMP/android-signing/key-password.txt"
          OUT="dist/Santa-Luzia-1.0.5.apk"
          "$APKSIGNER" sign \
            --ks "$KS" \
            --ks-key-alias santa-luzia \
            --ks-pass "file:$STORE_PW" \
            --key-pass "file:$KEY_PW" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT" "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$OUT" | tee "$RUNNER_TEMP/apksigner-code12.txt"
          CERT="$(awk -F': ' 'tolower($0) ~ /certificate sha-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/apksigner-code12.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$CERT" = "$EXPECTED_CERT"
          grep -Eq 'Verified using v2 scheme.*true' "$RUNNER_TEMP/apksigner-code12.txt"
          grep -Eq 'Verified using v3 scheme.*true' "$RUNNER_TEMP/apksigner-code12.txt"
          BADGING="$("$AAPT" dump badging "$OUT" | head -1)"
          echo "$BADGING" | grep -q "name='br.com.comunidadesantaluzia.app'"
          echo "$BADGING" | grep -q "versionCode='12'"
          echo "$BADGING" | grep -q "versionName='1.0.5'"
          cp "$OUT" dist/santa-luzia.apk
          SHA="$(sha256sum "$OUT" | awk '{print $1}')"
          SIZE="$(stat -c%s "$OUT")"
          printf '%s  %s\n' "$SHA" 'Santa-Luzia-1.0.5.apk' > dist/Santa-Luzia-1.0.5.apk.sha256
          echo "APK_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "APK code12 validada: $SIZE bytes; SHA-256 $SHA"

      - name: Publicar APK oficial mantendo a versao 1.0.5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='android-v1.0.5'
          NOTES='Santa Luzia 1.0.5 — build interna 12. Atualização de robustez técnica: detecção instantânea de nova versão ao reconectar à internet ou retornar ao aplicativo, sincronização reforçada, sessão e permissões revalidadas no servidor, validações administrativas ampliadas, proteção de ranking/atrasos/quizzes/jogo, fila offline do Joias da Luz mais segura, APK validada por pacote/versionCode/certificado/hash antes da instalação, recuperação de interface e auditoria automática de regressões. Menus e submenus Android permanecem sob controle nativo do aparelho. A versão pública continua 1.0.5.'
          gh release upload "$TAG" dist/santa-luzia.apk dist/Santa-Luzia-1.0.5.apk dist/Santa-Luzia-1.0.5.apk.sha256 --clobber
          gh release edit "$TAG" --latest --title 'Santa Luzia Android 1.0.5' --notes "$NOTES"

      - name: Atualizar metadados oficiais e limpar ponte temporaria
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const releasePath = 'config/android-release.json'
          const atual = JSON.parse(fs.readFileSync(releasePath, 'utf8'))
          atual.versionCode = 12
          atual.versionName = '1.0.5'
          atual.publishedAt = '2026-08-16'
          atual.required = false
          atual.apkSize = Number(process.env.APK_SIZE)
          atual.apkSha256 = process.env.APK_SHA256
          atual.highlights = [
            'Atualização detectada imediatamente ao reconectar à internet ou voltar ao aplicativo',
            'Auditoria de robustez ampliada para autenticação, membro, moderador, escalas, formação, atrasos, ranking, quizzes, offline e jogo',
            'APK validada por pacote, versionCode, certificado de assinatura, tamanho e SHA-256 antes da instalação',
            'Menus e submenus Android permanecem sob controle nativo do próprio aparelho'
          ]
          fs.writeFileSync(releasePath, JSON.stringify(atual, null, 2) + '\n')

          const auditPath = 'scripts/auditar-robustez.cjs'
          let audit = fs.readFileSync(auditPath, 'utf8')
          audit = audit.replace(
            'exigir(build.versionCode > release.versionCode, "Build preparada é mais nova que a publicada", `${build.versionCode} > ${release.versionCode}`)',
            'exigir(build.versionCode >= release.versionCode, "Build Android não está atrás da release publicada", `${build.versionCode} >= ${release.versionCode}`)'
          )
          fs.writeFileSync(auditPath, audit)

          const docPath = 'AUDITORIA-ROBUSTEZ.md'
          if (fs.existsSync(docPath)) {
            let doc = fs.readFileSync(docPath, 'utf8')
            doc = doc.replace('publicada está no code 11 e a candidata é code 12', 'publicada está no code 12')
            doc = doc.replace('A publicação da APK code 12 só ocorre com a chave original e o certificado histórico esperado.', 'A APK code 12 foi publicada com a chave original e o certificado histórico esperado.')
            doc = doc.replace('APROVADO PARA BUILD 12', 'APROVADO / PUBLICADO CODE 12')
            fs.writeFileSync(docPath, doc)
          }
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/android-release.json scripts/auditar-robustez.cjs AUDITORIA-ROBUSTEZ.md
          git rm -f .github/ci-signing-bridge-v8.cms.b64 .github/workflows/ephemeral-signing-bridge-v8.yml .github/workflows/publish-android-105-code12-secure.yml
          git commit -m 'Publica Android 1.0.5 build 12 robusta e atualizacao instantanea'
          git push origin HEAD:main

      - name: Guardar APK final assinado para auditoria
        uses: actions/upload-artifact@v4
        with:
          name: santa-luzia-1.0.5-code12-signed-original-key
          path: dist/Santa-Luzia-1.0.5.apk
          if-no-files-found: error
          retention-days: 30

      - name: Limpar material sensivel do runner
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/android-signing" "$RUNNER_TEMP/signing-recovery-v8.cms" "$RUNNER_TEMP/signing-recovery-v8.zip" "$RUNNER_TEMP/bridge-v8-private" "$RUNNER_TEMP/bridge-v8-public" "$RUNNER_TEMP/key-info.txt" "$RUNNER_TEMP/apksigner-code12.txt" || true

      - name: Apagar artefatos da ponte temporaria
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$BRIDGE_PRIVATE_ARTIFACT_ID" || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$BRIDGE_PUBLIC_ARTIFACT_ID" || true
