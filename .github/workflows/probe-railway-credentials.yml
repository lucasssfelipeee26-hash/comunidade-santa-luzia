name: Verificar configuração Railway no Actions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-railway-credentials.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SECRET_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SECRET_RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      SECRET_RAILWAY_DEPLOY_HOOK: ${{ secrets.RAILWAY_DEPLOY_HOOK }}
      VAR_RAILWAY_TOKEN: ${{ vars.RAILWAY_TOKEN }}
      VAR_RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      VAR_RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      VAR_RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      VAR_RAILWAY_DEPLOY_HOOK: ${{ vars.RAILWAY_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
      - name: Registrar apenas presença/ausência das configurações
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const keys = [
            'SECRET_RAILWAY_TOKEN',
            'SECRET_RAILWAY_API_TOKEN',
            'SECRET_RAILWAY_DEPLOY_HOOK',
            'VAR_RAILWAY_TOKEN',
            'VAR_RAILWAY_PROJECT_ID',
            'VAR_RAILWAY_SERVICE_ID',
            'VAR_RAILWAY_ENVIRONMENT_ID',
            'VAR_RAILWAY_DEPLOY_HOOK',
          ]
          const configured = Object.fromEntries(keys.map((key) => [key, Boolean((process.env[key] || '').trim())]))
          fs.writeFileSync('.github/railway-credentials-probe.json', JSON.stringify({ checkedAt: new Date().toISOString(), configured }, null, 2) + '\n')
          console.log(JSON.stringify(configured, null, 2))
          NODE
      - name: Registrar resultado sem segredos
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/railway-credentials-probe.json
          git commit -m 'Registra presença de configuração Railway' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
