name: Validar Caminho da Luz

on:
  push:
    branches:
      - agent/caminho-da-luz

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTH_SECRET: ci-apenas-para-validacao-nao-usar-em-producao-123456789
      CAPACITOR_SERVER_URL: https://comunidade-santa-luzia-production.up.railway.app
      APP_VERSION_CODE: 3
      APP_VERSION_NAME: 1.0.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar build Next.js
        run: npm run build
      - name: Criar e sincronizar Android
        run: |
          npx cap add android
          npx cap sync android
          node scripts/prepare-android.cjs
      - name: Compilar Android de validação
        working-directory: android
        run: ./gradlew assembleDebug
