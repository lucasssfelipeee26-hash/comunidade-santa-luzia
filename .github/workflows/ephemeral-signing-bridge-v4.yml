name: Ponte temporaria de assinatura Android v4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ephemeral-signing-bridge-v4.yml

permissions:
  contents: read
  actions: read

jobs:
  gerar-ponte:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar chave RSA temporaria
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/bridge-v4"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/bridge-v4/private.pem"
          openssl req -new -x509 \
            -key "$RUNNER_TEMP/bridge-v4/private.pem" \
            -out "$RUNNER_TEMP/bridge-v4/public-cert.pem" \
            -days 1 \
            -subj '/CN=Santa Luzia Ephemeral Signing Bridge v4'
          chmod 600 "$RUNNER_TEMP/bridge-v4/private.pem"
          openssl x509 -in "$RUNNER_TEMP/bridge-v4/public-cert.pem" -noout -fingerprint -sha256

      - name: Guardar certificado publico temporario
        uses: actions/upload-artifact@v4
        with:
          name: bridge-v4-public-cert
          path: ${{ runner.temp }}/bridge-v4/public-cert.pem
          retention-days: 1
          if-no-files-found: error

      - name: Guardar chave privada temporaria
        uses: actions/upload-artifact@v4
        with:
          name: bridge-v4-private-key
          path: ${{ runner.temp }}/bridge-v4/private.pem
          retention-days: 1
          if-no-files-found: error
