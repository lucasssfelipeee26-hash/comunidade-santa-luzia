name: Local-first Dia 4 — sincronização inteligente

on:
  push:
    branches:
      - agent/local-first-day4-smart-sync
    paths:
      - scripts/day4-apply-smart-sync.cjs
      - .github/workflows/local-first-day4-check.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTH_SECRET: ci-local-first-dia4-12345678901234567890
      CAPACITOR_SERVER_URL: https://comunidade-santa-luzia-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-first-day4-smart-sync
          fetch-depth: 0

      - name: Aplicar e validar sincronização por revisão
        shell: bash
        run: |
          set +e
          node scripts/day4-apply-smart-sync.cjs
          CODEMOD=$?
          INSTALL=99
          TYPESCRIPT=99
          AUDIT=99
          BUILD=99
          SYNCCHECK=99

          if [ "$CODEMOD" -eq 0 ]; then
            npm install --no-audit --no-fund
            INSTALL=$?
          fi
          if [ "$INSTALL" -eq 0 ]; then
            npx tsc --noEmit
            TYPESCRIPT=$?
            npm run audit:robustez
            AUDIT=$?
            npm run build
            BUILD=$?
          fi

          grep -Fq 'SNAPSHOT_REVISION_KEY' components/android-offline-snapshot-runtime.tsx \
            && grep -Fq 'mesmaRevisao' components/android-offline-snapshot-runtime.tsx \
            && grep -Fq 'mesmoUsuario' components/android-offline-snapshot-runtime.tsx \
            && grep -Fq 'snapshot:perfil' components/android-offline-snapshot-runtime.tsx \
            && grep -Fq 'INTERVALO_SNAPSHOT' components/android-offline-snapshot-runtime.tsx
          SYNCCHECK=$?

          export CODEMOD INSTALL TYPESCRIPT AUDIT BUILD SYNCCHECK
          node <<'NODE'
          const fs = require('fs')
          const n = k => Number(process.env[k])
          const r = {
            checkedAt: new Date().toISOString(),
            codemodExit: n('CODEMOD'), installExit: n('INSTALL'), typescriptExit: n('TYPESCRIPT'),
            auditExit: n('AUDIT'), buildExit: n('BUILD'), syncCheckExit: n('SYNCCHECK'),
          }
          r.ok = [r.codemodExit,r.installExit,r.typescriptExit,r.auditExit,r.buildExit,r.syncCheckExit].every(v => v === 0)
          fs.writeFileSync('.github/local-first-day4-validation.json', JSON.stringify(r, null, 2) + '\n')
          console.log(JSON.stringify(r, null, 2))
          NODE

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/android-offline-snapshot-runtime.tsx .github/local-first-day4-validation.json
          git commit -m 'Aplica sincronização local-first por revisão' || true
          git pull --rebase origin agent/local-first-day4-smart-sync
          git push origin HEAD:agent/local-first-day4-smart-sync

          test "$CODEMOD" -eq 0 && test "$INSTALL" -eq 0 && test "$TYPESCRIPT" -eq 0 && test "$AUDIT" -eq 0 && test "$BUILD" -eq 0 && test "$SYNCCHECK" -eq 0
