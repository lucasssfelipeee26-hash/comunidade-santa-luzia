name: Android — Santa Luzia Motion Beta 18 Audit Build

on:
  push:
    branches:
      - work/android-motion-beta18-audit-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-motion-beta18-audit-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-build-beta18:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      SANTA_LUZIA_MOTION_BETA: "1"
      AUTH_SECRET: ci-motion-beta-santa-luzia-12345678901234567890
      MOTION_BETA_KEYSTORE: /home/runner/.android/santa-luzia-motion-beta.keystore
      MOTION_BETA_STORE_PASSWORD: android
      MOTION_BETA_KEY_ALIAS: santa-luzia-motion-beta
      MOTION_BETA_KEY_PASSWORD: android

    steps:
      - name: Checkout Beta 18 corrigida
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Restaurar cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-motion-beta18-gradle-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-motion-beta18-gradle-
            ${{ runner.os }}-motion-beta12-gradle-
            ${{ runner.os }}-gradle-

      - name: Restaurar assinatura persistente da linha Motion Beta
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/santa-luzia-motion-beta.keystore
          key: santa-luzia-motion-beta-keystore-v2

      - name: Validar assinatura histórica da Beta
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MOTION_BETA_KEYSTORE")"
          if [ ! -s "$MOTION_BETA_KEYSTORE" ]; then
            echo "ERRO: keystore persistente da linha Motion Beta não foi restaurado; não será criada uma chave diferente." >&2
            exit 1
          fi
          keytool -list -keystore "$MOTION_BETA_KEYSTORE" -storepass "$MOTION_BETA_STORE_PASSWORD" -alias "$MOTION_BETA_KEY_ALIAS" >/dev/null
          CERT="$(keytool -exportcert -keystore "$MOTION_BETA_KEYSTORE" -storepass "$MOTION_BETA_STORE_PASSWORD" -alias "$MOTION_BETA_KEY_ALIAS" | sha256sum | awk '{print $1}')"
          test "$CERT" = "0cf42dad25bd2673c81c6e47b87b77d5581c3de5cf23552e23088bdc447a4a21"
          echo "MOTION_EXPECTED_CERT=$CERT" >> "$GITHUB_ENV"

      - name: Carregar configuração Beta 18
        run: |
          node <<'NODE'
          const fs = require('fs')
          const c = require('./config/android-motion-beta.json')
          const stable = require('./config/android-build.json')
          if (c.versionName !== '2.0.0-beta.18' || c.versionCode !== 20018) throw new Error('A branch não está na Beta 18 correta')
          if (c.applicationId !== 'br.com.comunidadesantaluzia.motionbeta') throw new Error('ApplicationId Beta incorreto')
          if (stable.versionName !== '1.0.6' || stable.versionCode !== 18) throw new Error('Android oficial foi alterado')
          const vars = {
            APP_VERSION_CODE: c.versionCode,
            APP_VERSION_NAME: c.versionName,
            SANTA_LUZIA_MOTION_VERSION: c.versionName,
            MOTION_APP_ID: c.applicationId,
            WINDOWS_BETA_COMMIT: c.windowsBeta.commit,
            SYNC_SERVER_URL: c.serverUrl,
          }
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(vars).map(([k,v]) => `${k}=${v}\n`).join(''))
          NODE

      - name: Instalar dependências
        run: npm install --include=dev --no-audit --no-fund

      - name: Validar scripts da recuperação Beta 18
        run: |
          set -euo pipefail
          for f in \
            scripts/fetch-windows-beta-stack.cjs \
            scripts/patch-windows-polish-android-beta18.cjs \
            scripts/build-android-local.cjs \
            scripts/prepare-android.cjs \
            scripts/prepare-motion-beta18.cjs \
            scripts/auditar-beta18-recovery.cjs \
            scripts/auditar-robustez.cjs \
            scripts/auditar-offline.cjs \
            scripts/validate-android-web.cjs; do
              node --check "$f"
          done

      - name: Fixar stack visual Windows usada pela Beta 18
        run: |
          set -euo pipefail
          test "$WINDOWS_BETA_COMMIT" = "1c798019ebcb7ace6fbaa762fab398b92385a361"
          node scripts/fetch-windows-beta-stack.cjs
          node scripts/patch-windows-polish-android-beta18.cjs

      - name: Auditoria completa de código e offline
        run: |
          set -euo pipefail
          npx tsc --noEmit
          node scripts/auditar-robustez.cjs
          npm run audit:offline
          node scripts/auditar-beta18-recovery.cjs

      - name: Empacotar interface React local aprovada
        run: npm run build:android-local

      - name: Validar frontend Android produzido
        run: |
          set -euo pipefail
          node scripts/validate-android-web.cjs
          test -s android-web/index.html
          test -s android-web/local-app.js
          test "$(stat -c%s android-web/local-app.js)" -gt 250000
          grep -Fq '/local-app.js' android-web/index.html
          test ! -e android-web/offline.html
          test ! -e android-web/offline-bridge.html
          grep -Fq 'data-escala-history-enabled' components/escala-publica.tsx
          grep -Fq 'data-home-public-shortcuts="4"' android-local/entry.tsx
          grep -Fq 'data-auditor-santa-luzia="beta18"' components/diagnostico-santa-luzia.tsx
          node scripts/auditar-beta18-recovery.cjs

      - name: Criar e sincronizar projeto Capacitor Android
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          npx cap sync android
          APP_VERSION_CODE="$APP_VERSION_CODE" APP_VERSION_NAME="$APP_VERSION_NAME" node scripts/prepare-android.cjs
          node scripts/prepare-motion-beta18.cjs

      - name: Auditar projeto Android gerado
        run: |
          set -euo pipefail
          grep -Eq "applicationId[[:space:]]+\"${MOTION_APP_ID//./\\.}\"" android/app/build.gradle
          grep -Eq "versionCode[[:space:]]+${APP_VERSION_CODE}" android/app/build.gradle
          grep -Fq "versionName \"${APP_VERSION_NAME}\"" android/app/build.gradle
          grep -Fq "signingConfig signingConfigs.motionBeta" android/app/build.gradle
          grep -Fq "MOTION_BETA_KEYSTORE" android/app/build.gradle
          grep -Fq "Santa Luzia Motion Beta" android/app/src/main/res/values/strings.xml
          CONFIG=android/app/src/main/assets/capacitor.config.json
          test -f "$CONFIG"
          if grep -Fq '"server"' "$CONFIG"; then echo "ERRO: Beta 18 contém server.url" >&2; exit 1; fi
          if grep -Eq 'offline\.html|offline-bridge\.html|errorPath' "$CONFIG"; then echo "ERRO: interface alternativa no Capacitor" >&2; exit 1; fi
          grep -Fq "SantaLuziaMotionBeta/$APP_VERSION_NAME" "$CONFIG"
          grep -Fq "SantaLuziaOriginalUIOffline/2" "$CONFIG"
          test -s android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/public/local-app.js
          test "$(stat -c%s android/app/src/main/assets/public/local-app.js)" -gt 250000
          test -d android/app/src/main/assets/public/_next/static
          test -d android/app/src/main/assets/public/images
          test -s android/app/src/main/assets/public/motion/windows-beta-runtime.js
          test -s android/app/src/main/assets/public/motion/windows-beta7-polish.js
          test -s android/app/src/main/assets/public/motion/android-deep-auditor-beta16.js
          test -s android/app/src/main/assets/public/motion/android-auditor-patch-beta16.js
          MAIN=android/app/src/main/java/br/com/comunidadesantaluzia/app/MainActivity.java
          grep -Fq 'OfflineStorePlugin.class' "$MAIN"
          grep -Fq 'DiagnosticReportPlugin.class' "$MAIN"
          if grep -Eq 'MotionOfflineWebViewClient|LOAD_CACHE_ELSE_NETWORK|evaluateJavascript' "$MAIN"; then echo "ERRO: arquitetura remota antiga no MainActivity" >&2; exit 1; fi

      - name: Compilar APK Motion Beta 18 corrigida
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Auditar APK final e gerar relatório
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test "$(stat -c%s "$APK")" -gt 20000000
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/motion-badging.txt"
          grep -Fq "package: name='$MOTION_APP_ID' versionCode='$APP_VERSION_CODE' versionName='$APP_VERSION_NAME'" "$RUNNER_TEMP/motion-badging.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/motion-apksigner.txt"
          CERT="$(awk -F': ' 'tolower($0) ~ /certificate sha-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/motion-apksigner.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$CERT"
          test "$CERT" = "$MOTION_EXPECTED_CERT"
          unzip -l "$APK" > "$RUNNER_TEMP/apk-files.txt"
          grep -Fq 'assets/public/index.html' "$RUNNER_TEMP/apk-files.txt"
          grep -Fq 'assets/public/local-app.js' "$RUNNER_TEMP/apk-files.txt"
          grep -Fq 'assets/public/_next/static/' "$RUNNER_TEMP/apk-files.txt"
          grep -Fq 'assets/public/motion/windows-beta-runtime.js' "$RUNNER_TEMP/apk-files.txt"
          grep -Fq 'assets/public/motion/android-deep-auditor-beta16.js' "$RUNNER_TEMP/apk-files.txt"
          grep -Fq 'assets/public/motion/android-auditor-patch-beta16.js' "$RUNNER_TEMP/apk-files.txt"
          if grep -Eq 'assets/public/(offline\.html|offline-bridge\.html)' "$RUNNER_TEMP/apk-files.txt"; then echo "ERRO: interface offline antiga dentro do APK" >&2; exit 1; fi
          unzip -p "$APK" assets/capacitor.config.json > "$RUNNER_TEMP/motion-capacitor-config.json"
          if grep -Fq '"server"' "$RUNNER_TEMP/motion-capacitor-config.json"; then echo "ERRO: APK depende de server.url" >&2; exit 1; fi
          grep -Fq "SantaLuziaOriginalUIOffline/2" "$RUNNER_TEMP/motion-capacitor-config.json"
          mkdir -p dist
          OUT="dist/Santa-Luzia-Motion-Beta18-Corrigida.apk"
          cp "$APK" "$OUT"
          SHA="$(sha256sum "$OUT" | awk '{print $1}')"
          SIZE="$(stat -c%s "$OUT")"
          cat > dist/RELATORIO-MOTION-BETA18-CORRIGIDA.txt <<EOF
          Santa Luzia Motion Beta 18 — Auditoria e Build Corrigida
          Versão: $APP_VERSION_NAME
          VersionCode: $APP_VERSION_CODE
          ApplicationId: $MOTION_APP_ID
          Tamanho: $SIZE bytes
          SHA-256: $SHA
          Certificado Beta SHA-256: $CERT
          Assinatura: mesma chave persistente da linha Motion Beta.
          Fonte: recuperação Beta 18 sobre a Beta 16 aprovada, sem regressão visual da Beta 17.
          Auditorias: TypeScript, robustez, offline, contrato Beta 18, frontend Android, projeto Capacitor, pacote, assinatura e conteúdo do APK.
          Offline: interface React local empacotada no APK; sem server.url; SQLite/CacheStorage/IndexedDB e filas locais preservados.
          Android oficial preservado: 1.0.6 / code18.
          Canal: artefato Beta de teste; nenhuma release oficial publicada.
          EOF
          echo "MOTION_APK_SHA=$SHA" >> "$GITHUB_ENV"
          echo "MOTION_APK_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "MOTION_CERT=$CERT" >> "$GITHUB_ENV"

      - name: Publicar artefato Beta 18 corrigido
        uses: actions/upload-artifact@v4
        with:
          name: santa-luzia-motion-beta18-corrigida
          path: |
            dist/Santa-Luzia-Motion-Beta18-Corrigida.apk
            dist/RELATORIO-MOTION-BETA18-CORRIGIDA.txt
          if-no-files-found: error
          retention-days: 30

      - name: Resumo final
        run: |
          {
            echo "## Santa Luzia Motion Beta 18 corrigida"
            echo "- Versão: $APP_VERSION_NAME (code $APP_VERSION_CODE)"
            echo "- Pacote: $MOTION_APP_ID"
            echo "- APK: $MOTION_APK_SIZE bytes"
            echo "- SHA-256: $MOTION_APK_SHA"
            echo "- Certificado Beta SHA-256: $MOTION_CERT"
            echo "- Auditoria e build concluídos sem alterar o Android oficial."
          } >> "$GITHUB_STEP_SUMMARY"
