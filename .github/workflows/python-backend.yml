name: Python Backend — Santa Luzia

on:
  push:
    branches:
      - work/android-kotlin-compose-native
    paths:
      - python-backend/**
      - .github/workflows/python-backend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: santa-luzia-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: python-backend
      AUTH_SECRET: ci-santa-luzia-python-secret-comprido-e-seguro
      DATA_DIR: ${{ github.workspace }}/.ci-data

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python-backend/requirements.txt

      - name: Dependências
        run: python -m pip install -r python-backend/requirements.txt

      - name: Compilar módulos Python
        run: python -m compileall -q python-backend/santa_luzia_backend

      - name: Importar FastAPI e auditar rotas migradas
        run: |
          python - <<'PY'
          from santa_luzia_backend.main import app
          methods = {(method, route.path) for route in app.routes for method in getattr(route, "methods", set())}
          required = {
              ("POST", "/api/auth/login"),
              ("GET", "/api/auth/me"),
              ("GET", "/api/perfis"),
              ("GET", "/api/escalas"),
              ("POST", "/api/escalas"),
              ("GET", "/api/formacoes"),
              ("PUT", "/api/formacoes/{formation_id}/minha-presenca"),
              ("GET", "/api/ranking"),
              ("POST", "/api/ranking"),
              ("GET", "/api/jogo/caminho-da-luz/resultado"),
              ("POST", "/api/jogo/whatajong/resultado"),
              ("GET", "/api/quizzes"),
              ("POST", "/api/quizzes/liturgia/offline"),
          }
          missing = sorted(required - methods)
          if missing:
              raise SystemExit(f"Rotas migradas ausentes: {missing}")
          print(f"FastAPI importado: {len(methods)} combinações método/rota.")
          PY
