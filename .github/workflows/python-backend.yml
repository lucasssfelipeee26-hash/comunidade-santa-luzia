name: Python Backend — Santa Luzia

on:
  push:
    branches:
      - work/android-kotlin-compose-native
    paths:
      - python-backend/**
      - .github/workflows/python-backend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: santa-luzia-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: python-backend
      AUTH_SECRET: ci-santa-luzia-python-secret-comprido-e-seguro
      DATA_DIR: ${{ github.workspace }}/.ci-data

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python-backend/requirements.txt

      - name: Dependências
        run: python -m pip install -r python-backend/requirements.txt

      - name: Compilar módulos Python
        run: python -m compileall -q python-backend/santa_luzia_backend python-backend/scripts

      - name: Auditar paridade endpoint a endpoint
        run: python python-backend/scripts/audit_endpoint_parity.py

      - name: Auditar paridade semântica crítica
        run: python python-backend/scripts/audit_semantic_parity.py

      - name: Auditar regras de negócio críticas
        run: python python-backend/scripts/audit_business_rules.py

      - name: Auditar uploads multipart reais
        run: python python-backend/scripts/audit_multipart_uploads.py

      - name: Smoke test FastAPI
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from santa_luzia_backend.main import app

          client = TestClient(app)
          health = client.get('/health')
          assert health.status_code == 200, health.text
          assert health.json().get('backend') == 'python'

          scales = client.get('/api/escalas')
          assert scales.status_code == 200, scales.text
          assert isinstance(scales.json().get('escalas'), list)

          library = client.get('/api/biblioteca')
          assert library.status_code == 200, library.text
          assert isinstance(library.json().get('livros'), list)

          theme = client.get('/api/configuracao/tema')
          assert theme.status_code == 200, theme.text
          assert theme.json().get('tema')

          status = client.get('/api/app/status')
          assert status.status_code == 200, status.text
          assert status.json().get('appRelease') == '0.11.0'

          print('Smoke FastAPI: OK')
          PY

      - name: Auditar proteção do banco
        run: |
          python - <<'PY'
          from pathlib import Path
          from santa_luzia_backend.data_protection import protect_database
          from santa_luzia_backend.store import DATA_DIR, mutate_main

          mutate_main(lambda store: store.setdefault('ci_probe', []).append('ok'))
          health = protect_database()
          assert health['status'] == 'ok', health
          assert health['backupCount'] >= 1, health
          assert (Path(DATA_DIR) / 'database-health.json').exists()
          print('Proteção do banco: OK')
          PY
