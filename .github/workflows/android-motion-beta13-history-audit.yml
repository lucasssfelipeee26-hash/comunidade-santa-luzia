name: Android — Santa Luzia Motion Beta 13 — auditoria histórica

on:
  push:
    branches:
      - work/android-motion-beta11-video-audit
    paths:
      - .github/beta13-history-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-motion-beta13-history-signing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta13:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SANTA_LUZIA_MOTION_BETA: "1"
      AUTH_SECRET: ci-motion-beta-santa-luzia-12345678901234567890
      MOTION_BETA_KEYSTORE: /home/runner/.android/santa-luzia-motion-beta.keystore
      MOTION_BETA_STORE_PASSWORD: android
      MOTION_BETA_KEY_ALIAS: santa-luzia-motion-beta
      MOTION_BETA_KEY_PASSWORD: android

    steps:
      - name: Checkout código auditado da Beta 13
        uses: actions/checkout@v4
        with:
          ref: work/android-motion-beta13-history-audit
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restaurar cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-motion-beta13-gradle-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-motion-beta12-gradle-
            ${{ runner.os }}-motion-beta11-gradle-
            ${{ runner.os }}-gradle-

      - name: Restaurar assinatura persistente da Motion Beta
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/santa-luzia-motion-beta.keystore
          key: santa-luzia-motion-beta-keystore-v2

      - name: Validar certificado herdado da Beta 11/12
        run: |
          set -euo pipefail
          test -s "$MOTION_BETA_KEYSTORE"
          keytool -list -keystore "$MOTION_BETA_KEYSTORE" -storepass "$MOTION_BETA_STORE_PASSWORD" -alias "$MOTION_BETA_KEY_ALIAS" >/dev/null
          EXPECTED="$(keytool -exportcert -keystore "$MOTION_BETA_KEYSTORE" -storepass "$MOTION_BETA_STORE_PASSWORD" -alias "$MOTION_BETA_KEY_ALIAS" | sha256sum | awk '{print $1}')"
          test "$EXPECTED" = "0cf42dad25bd2673c81c6e47b87b77d5581c3de5cf23552e23088bdc447a4a21"
          echo "MOTION_EXPECTED_CERT=$EXPECTED" >> "$GITHUB_ENV"

      - name: Carregar configuração Beta 13
        run: |
          node <<'NODE'
          const fs = require('fs')
          const c = require('./config/android-motion-beta.json')
          if (c.versionName !== '2.0.0-beta.13' || c.versionCode !== 20013) throw new Error(`Esperada Beta 13, encontrado ${c.versionName}/code${c.versionCode}`)
          if (c.applicationId !== 'br.com.comunidadesantaluzia.motionbeta') throw new Error('Pacote Beta incorreto')
          const vars = {
            APP_VERSION_CODE: c.versionCode,
            APP_VERSION_NAME: c.versionName,
            SANTA_LUZIA_MOTION_VERSION: c.versionName,
            MOTION_APP_ID: c.applicationId,
            WINDOWS_BETA_COMMIT: c.windowsBeta.commit,
            SYNC_SERVER_URL: c.serverUrl,
          }
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(vars).map(([k,v]) => `${k}=${v}\n`).join(''))
          NODE

      - name: Instalar dependências
        run: npm install --include=dev --no-audit --no-fund

      - name: Validar scripts e histórico da Beta 13
        run: |
          set -euo pipefail
          node --check scripts/auditar-beta13-historico.cjs
          node --check scripts/prepare-motion-beta13.cjs
          node --check scripts/build-android-local.cjs
          node --check scripts/validate-android-web.cjs
          node --check scripts/auditar-offline-beta12.cjs
          node --check scripts/auditar-icones-beta12.cjs
          node scripts/auditar-beta13-historico.cjs

      - name: Fixar stack visual de referência
        run: node scripts/fetch-windows-beta-stack.cjs

      - name: Auditar TypeScript
        run: npx tsc --noEmit

      - name: Auditar robustez e matriz offline
        run: |
          node scripts/auditar-robustez.cjs
          npm run audit:offline
          node scripts/auditar-offline-beta12.cjs
          node scripts/auditar-icones-beta12.cjs
          node scripts/auditar-beta13-historico.cjs

      - name: Compilar aplicação Next de referência
        run: npm run build

      - name: Empacotar interface React original para Android
        run: npm run build:android-local

      - name: Auditar frontend Android produzido
        run: |
          set -euo pipefail
          node scripts/validate-android-web.cjs
          node scripts/auditar-beta13-historico.cjs
          test -s android-web/index.html
          test -s android-web/local-app.js
          test "$(stat -c%s android-web/local-app.js)" -gt 250000
          grep -Fq 'slDoorPersonEnterLoop' android-web/local-app.js
          grep -Fq 'slDoorPersonExitLoop' android-web/local-app.js
          grep -Fq 'data-login-door-transition' android-web/local-app.js
          grep -Fq 'data-logout-door-transition' android-web/local-app.js
          grep -Fq 'data-team-profile-rail' android-web/local-app.js
          grep -Fq 'data-escala-history-enabled' android-web/local-app.js
          grep -Fq 'AdministracaoModerador' components/moderador-dashboard.tsx
          if grep -Fq 'Meu relatório' components/moderador-dashboard.tsx; then echo 'ERRO: Meu relatório reapareceu no painel.' >&2; exit 1; fi
          test ! -e android-web/offline.html
          test ! -e android-web/offline-bridge.html

      - name: Criar e sincronizar Capacitor Android
        run: |
          npx cap add android
          npx cap sync android
          APP_VERSION_CODE="$APP_VERSION_CODE" APP_VERSION_NAME="$APP_VERSION_NAME" node scripts/prepare-android.cjs
          node scripts/prepare-motion-beta13.cjs

      - name: Auditar projeto Android gerado
        run: |
          set -euo pipefail
          grep -Eq "applicationId[[:space:]]+\"${MOTION_APP_ID//./\\.}\"" android/app/build.gradle
          grep -Eq "versionCode[[:space:]]+${APP_VERSION_CODE}" android/app/build.gradle
          grep -Fq "versionName \"${APP_VERSION_NAME}\"" android/app/build.gradle
          grep -Fq "signingConfig signingConfigs.motionBeta" android/app/build.gradle
          CONFIG=android/app/src/main/assets/capacitor.config.json
          if grep -Fq '"server"' "$CONFIG"; then echo "ERRO: Motion Beta 13 contém server.url" >&2; exit 1; fi
          grep -Fq "SantaLuziaMotionBeta/$APP_VERSION_NAME" "$CONFIG"
          grep -Fq "SantaLuziaOriginalUIOffline/2" "$CONFIG"
          STORE=android/app/src/main/java/br/com/comunidadesantaluzia/app/OfflineStorePlugin.java
          grep -Fq 'DB_VERSION = 2' "$STORE"
          grep -Fq 'setWriteAheadLoggingEnabled(true)' "$STORE"
          grep -Fq 'PRAGMA integrity_check' "$STORE"
          grep -Fq 'recoverDocument' "$STORE"

      - name: Compilar APK Motion Beta 13
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Auditar APK final e assinatura
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test "$(stat -c%s "$APK")" -gt 20000000
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/motion-badging.txt"
          grep -Fq "package: name='$MOTION_APP_ID' versionCode='$APP_VERSION_CODE' versionName='$APP_VERSION_NAME'" "$RUNNER_TEMP/motion-badging.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/motion-apksigner.txt"
          CERT="$(awk -F': ' 'tolower($0) ~ /certificate sha-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/motion-apksigner.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$CERT" = "$MOTION_EXPECTED_CERT"
          unzip -l "$APK" > "$RUNNER_TEMP/apk-files.txt"
          grep -Fq 'assets/public/local-app.js' "$RUNNER_TEMP/apk-files.txt"
          for f in android-auditor-beta12.js android-performance-beta12.js android-scroll-stability-beta12.js android-podium-beta12.js android-local-first-beta8.js android-domain-bridge-beta10.js; do grep -Fq "assets/public/motion/$f" "$RUNNER_TEMP/apk-files.txt"; done
          unzip -p "$APK" assets/public/local-app.js > "$RUNNER_TEMP/local-app.js"
          grep -Fq 'slDoorPersonEnterLoop' "$RUNNER_TEMP/local-app.js"
          grep -Fq 'slDoorPersonExitLoop' "$RUNNER_TEMP/local-app.js"
          grep -Fq 'data-login-door-transition' "$RUNNER_TEMP/local-app.js"
          grep -Fq 'data-logout-door-transition' "$RUNNER_TEMP/local-app.js"
          unzip -p "$APK" assets/capacitor.config.json > "$RUNNER_TEMP/motion-capacitor-config.json"
          if grep -Fq '"server"' "$RUNNER_TEMP/motion-capacitor-config.json"; then echo "ERRO: APK depende de server.url" >&2; exit 1; fi
          mkdir -p dist
          cp "$APK" "dist/Santa-Luzia-Motion-2.0-beta13.apk"
          SHA="$(sha256sum dist/Santa-Luzia-Motion-2.0-beta13.apk | awk '{print $1}')"
          SIZE="$(stat -c%s dist/Santa-Luzia-Motion-2.0-beta13.apk)"
          cat > dist/RELATORIO-MOTION-BETA13.txt <<EOF
          Santa Luzia Motion Beta Android
          Versão: $APP_VERSION_NAME
          VersionCode: $APP_VERSION_CODE
          ApplicationId: $MOTION_APP_ID
          Tamanho: $SIZE bytes
          SHA-256: $SHA
          Certificado Beta SHA-256: $CERT
          Assinatura: certificado idêntico às Betas 11 e 12.
          Interface: React original local dentro do APK; sem server.url e sem shell offline alternativo.
          Offline: SQLite + CacheStorage/IndexedDB + filas locais e sincronização posterior.
          Banco local: SQLite v2, WAL, synchronous FULL, transações, backup anterior, recuperação e integrity_check.
          Banco do servidor: gravação atômica, fsync, até 8 backups, saúde e recuperação automática.
          Auditor Santa Luzia: erros, rede, rotas, FPS, scroll, ícones, auditoria offline e relatório JSON.
          Visual/funcional: Home e ícones, perfis horizontais, pódio sem troféu duplicado, administração segura do moderador.
          Porta Beta 13: entrada acionada somente após login aceito; saída acionada ao tocar em Sair antes de voltar ao login.
          Android oficial preservado: 1.0.6 / code18.
          Windows não alterado.
          EOF
          echo "MOTION_APK_SHA=$SHA" >> "$GITHUB_ENV"
          echo "MOTION_APK_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "MOTION_CERT=$CERT" >> "$GITHUB_ENV"

      - name: Guardar APK Beta 13
        uses: actions/upload-artifact@v4
        with:
          name: santa-luzia-motion-2.0-beta13
          path: |
            dist/Santa-Luzia-Motion-2.0-beta13.apk
            dist/RELATORIO-MOTION-BETA13.txt
          if-no-files-found: error
          retention-days: 14

      - name: Resumo
        run: |
          echo "### Santa Luzia Motion Beta 13" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fonte: work/android-motion-beta13-history-audit" >> "$GITHUB_STEP_SUMMARY"
          echo "- Versão: $APP_VERSION_NAME / code $APP_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: $MOTION_APK_SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: $MOTION_APK_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Certificado: $MOTION_CERT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android oficial 1.0.6/code18 e Windows preservados." >> "$GITHUB_STEP_SUMMARY"
