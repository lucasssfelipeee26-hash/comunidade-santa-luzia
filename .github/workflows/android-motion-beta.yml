name: Android — Santa Luzia Motion Beta 10

on:
  push:
    branches:
      - beta/android-motion-2.0-beta1
      - work/android-motion-beta10-original-ui-offline
  pull_request:
    branches:
      - main
      - beta/android-motion-2.0-beta1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-motion-beta10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motion-beta10:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SANTA_LUZIA_MOTION_BETA: "1"
      AUTH_SECRET: ci-motion-beta-santa-luzia-12345678901234567890

    steps:
      - name: Checkout Motion Beta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restaurar cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-motion-beta10-gradle-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-motion-beta10-gradle-
            ${{ runner.os }}-gradle-

      # A chave debug é exclusiva do pacote Motion Beta. O cache constante faz a
      # primeira chave criada na Beta 10 ser reutilizada nas próximas builds,
      # preservando SQLite/sessão quando o APK Beta for atualizado.
      - name: Restaurar assinatura estável da Motion Beta
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: santa-luzia-motion-beta-debug-keystore-v1

      - name: Carregar configuração da Beta
        run: |
          node <<'NODE'
          const fs = require('fs')
          const c = require('./config/android-motion-beta.json')
          const vars = {
            APP_VERSION_CODE: c.versionCode,
            APP_VERSION_NAME: c.versionName,
            SANTA_LUZIA_MOTION_VERSION: c.versionName,
            MOTION_APP_ID: c.applicationId,
            WINDOWS_BETA_COMMIT: c.windowsBeta.commit,
            SYNC_SERVER_URL: c.serverUrl,
          }
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(vars).map(([k,v]) => `${k}=${v}\n`).join(''))
          NODE

      - name: Instalar dependências
        run: npm install --include=dev --no-audit --no-fund

      - name: Validar scripts Beta 10
        run: |
          node --check android-web/motion/android-motion-beta.js
          node --check android-web/motion/android-native-fetch-beta10.js
          node --check android-web/motion/android-local-first-beta8.js
          node --check android-web/motion/android-member-state-beta8.js
          node --check android-web/motion/android-domain-bridge-beta10.js
          node --check android-web/motion/android-quiz-offline-beta10.js
          node --check android-web/motion/android-local-navigation-beta10.js
          node --check android-web/motion/android-original-ui-beta10.js
          node --check scripts/fetch-windows-beta-stack.cjs
          node --check scripts/build-android-local.cjs
          node --check scripts/prepare-motion-beta.cjs
          node --check scripts/auditar-motion-beta.cjs

      - name: Fixar stack completa da Windows Beta 19
        run: node scripts/fetch-windows-beta-stack.cjs

      - name: Confirmar referência Windows Beta
        run: |
          test "$WINDOWS_BETA_COMMIT" = "1c798019ebcb7ace6fbaa762fab398b92385a361"
          test -s android-web/motion/windows-motion-fixes.css
          test -s android-web/motion/windows-behavior-fixes.js
          test -s android-web/motion/windows-beta7-polish.js
          test -s android-web/motion/windows-preload-v5.js
          test -s android-web/motion/windows-beta-runtime.js
          grep -Fq 'weekly-presence-v3' android-web/motion/windows-beta7-polish.js
          grep -Fq 'Constância de Luz' android-web/motion/windows-beta7-polish.js
          grep -Fq 'Pódio da equipe' android-web/motion/windows-preload-v5.js
          grep -Fq 'sl-r10-profile-icon' android-web/motion/windows-beta-runtime.js
          grep -Fq 'sl-r12-quiz-visible' android-web/motion/windows-beta-runtime.js

      - name: Auditar TypeScript
        run: npx tsc --noEmit

      - name: Auditar dependências
        run: npm ls --depth=0

      # A auditoria UX da 1.0.6 ainda exige android-web/offline.html. A Motion
      # Beta 10 remove esse shell intencionalmente, então aqui executamos a
      # auditoria robusta compartilhada e a auditoria offline específica sem
      # reintroduzir a arquitetura antiga.
      - name: Auditar robustez e núcleo offline
        run: |
          node scripts/auditar-robustez.cjs
          npm run audit:offline

      - name: Auditar contrato Beta 10
        run: node scripts/auditar-motion-beta.cjs

      - name: Compilar aplicação Next de referência
        run: npm run build

      - name: Empacotar interface React original para Android
        run: npm run build:android-local

      - name: Validar frontend local produzido
        run: |
          test -s android-web/index.html
          test -s android-web/local-app.js
          test "$(stat -c%s android-web/local-app.js)" -gt 250000
          grep -Fq '/local-app.js' android-web/index.html
          grep -Fq 'android-native-fetch-beta10.js' android-web/index.html
          grep -Fq 'android-domain-bridge-beta10.js' android-web/index.html
          grep -Fq 'android-quiz-offline-beta10.js' android-web/index.html
          grep -Fq 'android-local-navigation-beta10.js' android-web/index.html
          grep -Fq 'windows-beta-runtime.js' android-web/index.html
          test ! -e android-web/offline.html
          test ! -e android-web/offline-bridge.html
          test ! -e android-web/motion/android-offline-first-beta7.js
          test ! -e android-web/motion/android-rsc-guard-beta8.js

      - name: Criar e sincronizar Capacitor Android
        run: |
          npx cap add android
          npx cap sync android
          APP_VERSION_CODE="$APP_VERSION_CODE" APP_VERSION_NAME="$APP_VERSION_NAME" node scripts/prepare-android.cjs
          node scripts/prepare-motion-beta.cjs

      - name: Auditar projeto Android gerado
        run: |
          set -euo pipefail
          grep -Eq "applicationId[[:space:]]+\"${MOTION_APP_ID//./\\.}\"" android/app/build.gradle
          grep -Eq "versionCode[[:space:]]+${APP_VERSION_CODE}" android/app/build.gradle
          grep -Fq "versionName \"${APP_VERSION_NAME}\"" android/app/build.gradle
          grep -Fq "Santa Luzia Motion Beta" android/app/src/main/res/values/strings.xml
          CONFIG=android/app/src/main/assets/capacitor.config.json
          test -f "$CONFIG"
          if grep -Fq '"server"' "$CONFIG"; then echo "ERRO: Motion Beta 10 ainda contém server.url" >&2; cat "$CONFIG" >&2; exit 1; fi
          if grep -Eq 'offline\.html|offline-bridge\.html|errorPath' "$CONFIG"; then echo "ERRO: interface alternativa no Capacitor" >&2; exit 1; fi
          grep -Fq "SantaLuziaMotionBeta/$APP_VERSION_NAME" "$CONFIG"
          grep -Fq "SantaLuziaOriginalUIOffline/2" "$CONFIG"
          grep -Fq "SantaLuziaWindowsBeta/0.1.0-beta.19" "$CONFIG"
          test -s android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/public/local-app.js
          test "$(stat -c%s android/app/src/main/assets/public/local-app.js)" -gt 250000
          test -d android/app/src/main/assets/public/_next/static
          test -d android/app/src/main/assets/public/images
          for f in windows-motion-fixes.css windows-behavior-fixes.js windows-beta7-polish.js windows-preload-v5.js windows-beta-runtime.js android-motion-beta.js android-native-fetch-beta10.js android-local-first-beta8.js android-member-state-beta8.js android-domain-bridge-beta10.js android-quiz-offline-beta10.js android-local-navigation-beta10.js android-original-ui-beta10.js; do test -s "android/app/src/main/assets/public/motion/$f"; done
          MAIN=android/app/src/main/java/br/com/comunidadesantaluzia/app/MainActivity.java
          grep -Fq 'SyncHttpPlugin.class' "$MAIN"
          grep -Fq 'OfflineStorePlugin.class' "$MAIN"
          grep -Fq 'CaminhoDaLuzPlugin.class' "$MAIN"
          grep -Fq 'WhatajongPlugin.class' "$MAIN"
          if grep -Eq 'MotionOfflineWebViewClient|LOAD_CACHE_ELSE_NETWORK|evaluateJavascript' "$MAIN"; then echo "ERRO: arquitetura remota antiga no MainActivity" >&2; exit 1; fi
          test ! -e android/app/src/main/java/br/com/comunidadesantaluzia/app/MotionOfflineWebViewClient.java

      - name: Compilar APK Motion Beta 10
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Auditar APK final
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test "$(stat -c%s "$APK")" -gt 20000000
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/motion-badging.txt"
          grep -Fq "package: name='$MOTION_APP_ID' versionCode='$APP_VERSION_CODE' versionName='$APP_VERSION_NAME'" "$RUNNER_TEMP/motion-badging.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/motion-apksigner.txt"
          CERT="$(awk -F': ' 'tolower($0) ~ /certificate sha-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/motion-apksigner.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$CERT"
          unzip -l "$APK" > "$RUNNER_TEMP/apk-files.txt"
          grep -Fq 'assets/public/index.html' "$RUNNER_TEMP/apk-files.txt"
          grep -Fq 'assets/public/local-app.js' "$RUNNER_TEMP/apk-files.txt"
          grep -Fq 'assets/public/_next/static/' "$RUNNER_TEMP/apk-files.txt"
          grep -Fq 'assets/public/images/' "$RUNNER_TEMP/apk-files.txt"
          for f in windows-motion-fixes.css windows-behavior-fixes.js windows-beta7-polish.js windows-preload-v5.js windows-beta-runtime.js android-motion-beta.js android-native-fetch-beta10.js android-local-first-beta8.js android-member-state-beta8.js android-domain-bridge-beta10.js android-quiz-offline-beta10.js android-local-navigation-beta10.js android-original-ui-beta10.js; do grep -Fq "assets/public/motion/$f" "$RUNNER_TEMP/apk-files.txt"; done
          if grep -Eq 'assets/public/(offline\.html|offline-bridge\.html)|android-offline-first-beta7|android-rsc-guard-beta8' "$RUNNER_TEMP/apk-files.txt"; then echo "ERRO: arquitetura offline antiga dentro do APK" >&2; exit 1; fi
          unzip -p "$APK" assets/capacitor.config.json > "$RUNNER_TEMP/motion-capacitor-config.json"
          if grep -Fq '"server"' "$RUNNER_TEMP/motion-capacitor-config.json"; then echo "ERRO: APK depende de server.url" >&2; exit 1; fi
          grep -Fq "SantaLuziaOriginalUIOffline/2" "$RUNNER_TEMP/motion-capacitor-config.json"
          mkdir -p dist
          cp "$APK" "dist/Santa-Luzia-Motion-2.0-beta10.apk"
          SHA="$(sha256sum dist/Santa-Luzia-Motion-2.0-beta10.apk | awk '{print $1}')"
          SIZE="$(stat -c%s dist/Santa-Luzia-Motion-2.0-beta10.apk)"
          cat > dist/RELATORIO-MOTION-BETA10.txt <<EOF
          Santa Luzia Motion Beta Android
          Versão: $APP_VERSION_NAME
          VersionCode: $APP_VERSION_CODE
          ApplicationId: $MOTION_APP_ID
          Tamanho: $SIZE bytes
          SHA-256: $SHA
          Certificado Beta SHA-256: $CERT
          Windows Beta fixada: $WINDOWS_BETA_COMMIT (0.1.0-beta.19)
          Servidor: $SYNC_SERVER_URL — usado somente para autenticação/sincronização de dados.
          Arquitetura: frontend React original empacotado no APK; sem server.url, sem offline.html, sem shell reduzido e sem proxy/cache de páginas remotas.
          Persistência: SQLite nativo + CacheStorage/IndexedDB para snapshots, leituras, fila de mutações e anexos pendentes.
          Interface original exigida: painéis de membro/moderador, menus, ícones, Escala, Formação, Atrasos, Jornada/Quiz, Ranking, Perfis, Presenças, Registros, Cores, Biblioteca, Liturgia e jogos.
          Quiz Litúrgico: runtime offline empacotado e auditado no APK; respostas elegíveis ficam locais até a sincronização.
          Sincronização: ações elegíveis funcionam localmente e aguardam rede; novidades do servidor descem quando a conexão retorna.
          Jogos locais: Joias da Luz/Caminho da Luz e Whatajong empacotados no APK.
          Android estável preservado: 1.0.6 / code18.
          Canal: artefato de teste; nenhuma release oficial publicada.
          EOF
          echo "MOTION_APK_SHA=$SHA" >> "$GITHUB_ENV"
          echo "MOTION_APK_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "MOTION_CERT=$CERT" >> "$GITHUB_ENV"

      - name: Guardar APK Beta 10
        uses: actions/upload-artifact@v4
        with:
          name: santa-luzia-motion-2.0-beta10
          path: |
            dist/Santa-Luzia-Motion-2.0-beta10.apk
            dist/RELATORIO-MOTION-BETA10.txt
          if-no-files-found: error
          retention-days: 14

      - name: Resumo
        run: |
          echo "### Santa Luzia Motion Beta 10" >> "$GITHUB_STEP_SUMMARY"
          echo "- Versão: $APP_VERSION_NAME / code $APP_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pacote: $MOTION_APP_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: $MOTION_APK_SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: $MOTION_APK_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Certificado Beta: $MOTION_CERT" >> "$GITHUB_STEP_SUMMARY"
          echo "- UI original empacotada; servidor somente sincronizador; Windows Beta 19 fixada." >> "$GITHUB_STEP_SUMMARY"
          echo "- Quiz Litúrgico offline está incluído e validado nos assets do APK." >> "$GITHUB_STEP_SUMMARY"
          echo "- Android oficial 1.0.6/code18 não foi publicado nem alterado." >> "$GITHUB_STEP_SUMMARY"
