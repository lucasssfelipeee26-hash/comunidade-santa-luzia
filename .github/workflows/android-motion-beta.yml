name: Android — Santa Luzia Motion Beta 12

on:
  push:
    branches:
      - beta/android-motion-2.0-beta1
      - work/android-motion-beta12-stability-audit
  pull_request:
    branches:
      - main
      - beta/android-motion-2.0-beta1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-motion-beta12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motion-beta12:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SANTA_LUZIA_MOTION_BETA: "1"
      AUTH_SECRET: ci-motion-beta-santa-luzia-12345678901234567890
      MOTION_BETA_KEYSTORE: /home/runner/.android/santa-luzia-motion-beta.keystore
      MOTION_BETA_STORE_PASSWORD: android
      MOTION_BETA_KEY_ALIAS: santa-luzia-motion-beta
      MOTION_BETA_KEY_PASSWORD: android

    steps:
      - name: Checkout Motion Beta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restaurar cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-motion-beta12-gradle-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-motion-beta12-gradle-
            ${{ runner.os }}-motion-beta11-gradle-
            ${{ runner.os }}-motion-beta10-gradle-
            ${{ runner.os }}-gradle-

      - name: Restaurar assinatura persistente da Motion Beta
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/santa-luzia-motion-beta.keystore
          key: santa-luzia-motion-beta-keystore-v2

      - name: Validar keystore da linha Beta
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MOTION_BETA_KEYSTORE")"
          if [ ! -s "$MOTION_BETA_KEYSTORE" ]; then
            echo "ERRO: keystore persistente da Beta 11 não foi restaurado; não gerar nova chave na Beta 12." >&2
            exit 1
          fi
          keytool -list -keystore "$MOTION_BETA_KEYSTORE" -storepass "$MOTION_BETA_STORE_PASSWORD" -alias "$MOTION_BETA_KEY_ALIAS" >/dev/null
          EXPECTED="$(keytool -exportcert -keystore "$MOTION_BETA_KEYSTORE" -storepass "$MOTION_BETA_STORE_PASSWORD" -alias "$MOTION_BETA_KEY_ALIAS" | sha256sum | awk '{print $1}')"
          test "$EXPECTED" = "0cf42dad25bd2673c81c6e47b87b77d5581c3de5cf23552e23088bdc447a4a21"
          echo "MOTION_EXPECTED_CERT=$EXPECTED" >> "$GITHUB_ENV"

      - name: Carregar configuração da Beta
        run: |
          node <<'NODE'
          const fs = require('fs')
          const c = require('./config/android-motion-beta.json')
          const vars = {
            APP_VERSION_CODE: c.versionCode,
            APP_VERSION_NAME: c.versionName,
            SANTA_LUZIA_MOTION_VERSION: c.versionName,
            MOTION_APP_ID: c.applicationId,
            WINDOWS_BETA_COMMIT: c.windowsBeta.commit,
            SYNC_SERVER_URL: c.serverUrl,
          }
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(vars).map(([k,v]) => `${k}=${v}\n`).join(''))
          NODE

      - name: Instalar dependências
        run: npm install --include=dev --no-audit --no-fund

      - name: Validar scripts Beta 12
        run: |
          set -euo pipefail
          for f in \
            android-web/motion/android-motion-beta.js \
            android-web/motion/android-native-fetch-beta10.js \
            android-web/motion/android-local-first-beta8.js \
            android-web/motion/android-member-state-beta8.js \
            android-web/motion/android-domain-bridge-beta10.js \
            android-web/motion/android-quiz-offline-beta10.js \
            android-web/motion/android-local-navigation-beta10.js \
            android-web/motion/android-constancia-luz-beta11.js \
            android-web/motion/android-report-bridge-beta11.js \
            android-web/motion/android-motion-parity-beta11.js \
            android-web/motion/android-original-ui-beta10.js \
            android-web/motion/android-auditor-beta12.js \
            android-web/motion/android-performance-beta12.js \
            android-web/motion/android-podium-beta12.js \
            scripts/fetch-windows-beta-stack.cjs \
            scripts/build-android-local.cjs \
            scripts/prepare-motion-beta.cjs \
            scripts/auditar-motion-beta.cjs \
            scripts/auditar-offline-beta12.cjs \
            scripts/auditar-icones-beta12.cjs \
            scripts/validate-android-web.cjs; do
              node --check "$f"
          done

      - name: Fixar stack completa da Windows Beta 19
        run: node scripts/fetch-windows-beta-stack.cjs

      - name: Confirmar referência visual Windows Beta
        run: |
          test "$WINDOWS_BETA_COMMIT" = "1c798019ebcb7ace6fbaa762fab398b92385a361"
          test -s android-web/motion/windows-motion-fixes.css
          test -s android-web/motion/windows-behavior-fixes.js
          test -s android-web/motion/windows-beta7-polish.js
          test -s android-web/motion/windows-preload-v5.js
          test -s android-web/motion/windows-beta-runtime.js
          grep -Fq '.sl-r5-card-trophy' android-web/motion/windows-beta-runtime.js
          grep -Fq 'slR5CupFloat' android-web/motion/windows-beta-runtime.js
          grep -Fq 'sl-r10-profile-icon' android-web/motion/windows-beta-runtime.js

      - name: Auditar TypeScript
        run: npx tsc --noEmit

      - name: Auditar dependências
        run: npm ls --depth=0

      - name: Auditar robustez e acervo offline
        run: |
          node scripts/auditar-robustez.cjs
          npm run audit:offline

      - name: Auditar contrato Beta 12
        run: node scripts/auditar-motion-beta.cjs

      - name: Auditar matriz de funcionalidades offline
        run: node scripts/auditar-offline-beta12.cjs

      - name: Auditar ícones essenciais
        run: node scripts/auditar-icones-beta12.cjs

      - name: Compilar aplicação Next de referência
        run: npm run build

      - name: Empacotar interface React original para Android
        run: npm run build:android-local

      - name: Pré-validar frontend Android produzido
        run: |
          set -euo pipefail
          node scripts/validate-android-web.cjs
          test -s android-web/index.html
          test -s android-web/local-app.js
          test "$(stat -c%s android-web/local-app.js)" -gt 250000
          for f in android-native-fetch-beta10.js android-domain-bridge-beta10.js android-quiz-offline-beta10.js android-local-navigation-beta10.js android-constancia-luz-beta11.js android-report-bridge-beta11.js android-motion-parity-beta11.js android-original-ui-beta10.js android-auditor-beta12.js android-performance-beta12.js android-podium-beta12.js windows-beta-runtime.js; do grep -Fq "$f" android-web/index.html; done
          grep -Fq '/local-app.js' android-web/index.html
          grep -Fq 'data-escala-history-enabled' components/escala-publica.tsx
          grep -Fq 'DiagnosticoSantaLuzia' android-local/entry.tsx
          test ! -e android-web/offline.html
          test ! -e android-web/offline-bridge.html
          test ! -e android-web/motion/android-offline-first-beta7.js
          test ! -e android-web/motion/android-rsc-guard-beta8.js

      - name: Criar e sincronizar Capacitor Android
        run: |
          npx cap add android
          npx cap sync android
          APP_VERSION_CODE="$APP_VERSION_CODE" APP_VERSION_NAME="$APP_VERSION_NAME" node scripts/prepare-android.cjs
          node scripts/prepare-motion-beta.cjs

      - name: Auditar projeto Android gerado
        run: |
          set -euo pipefail
          grep -Eq "applicationId[[:space:]]+\"${MOTION_APP_ID//./\\.}\"" android/app/build.gradle
          grep -Eq "versionCode[[:space:]]+${APP_VERSION_CODE}" android/app/build.gradle
          grep -Fq "versionName \"${APP_VERSION_NAME}\"" android/app/build.gradle
          grep -Fq "signingConfig signingConfigs.motionBeta" android/app/build.gradle
          grep -Fq "MOTION_BETA_KEYSTORE" android/app/build.gradle
          grep -Fq "Santa Luzia Motion Beta" android/app/src/main/res/values/strings.xml
          CONFIG=android/app/src/main/assets/capacitor.config.json
          test -f "$CONFIG"
          if grep -Fq '"server"' "$CONFIG"; then echo "ERRO: Motion Beta 12 contém server.url" >&2; exit 1; fi
          if grep -Eq 'offline\.html|offline-bridge\.html|errorPath' "$CONFIG"; then echo "ERRO: interface alternativa no Capacitor" >&2; exit 1; fi
          grep -Fq "SantaLuziaMotionBeta/$APP_VERSION_NAME" "$CONFIG"
          grep -Fq "SantaLuziaOriginalUIOffline/2" "$CONFIG"
          grep -Fq "SantaLuziaWindowsBeta/0.1.0-beta.19" "$CONFIG"
          test -s android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/public/local-app.js
          test "$(stat -c%s android/app/src/main/assets/public/local-app.js)" -gt 250000
          test -d android/app/src/main/assets/public/_next/static
          test -d android/app/src/main/assets/public/images
          for f in windows-motion-fixes.css windows-behavior-fixes.js windows-beta7-polish.js windows-preload-v5.js windows-beta-runtime.js android-motion-beta.js android-native-fetch-beta10.js android-local-first-beta8.js android-member-state-beta8.js android-domain-bridge-beta10.js android-quiz-offline-beta10.js android-local-navigation-beta10.js android-constancia-luz-beta11.js android-report-bridge-beta11.js android-motion-parity-beta11.js android-original-ui-beta10.js android-auditor-beta12.js android-performance-beta12.js android-podium-beta12.js; do test -s "android/app/src/main/assets/public/motion/$f"; done
          MAIN=android/app/src/main/java/br/com/comunidadesantaluzia/app/MainActivity.java
          grep -Fq 'SyncHttpPlugin.class' "$MAIN"
          grep -Fq 'OfflineStorePlugin.class' "$MAIN"
          grep -Fq 'CaminhoDaLuzPlugin.class' "$MAIN"
          grep -Fq 'WhatajongPlugin.class' "$MAIN"
          if grep -Eq 'MotionOfflineWebViewClient|LOAD_CACHE_ELSE_NETWORK|evaluateJavascript' "$MAIN"; then echo "ERRO: arquitetura remota antiga no MainActivity" >&2; exit 1; fi

      - name: Compilar APK Motion Beta 12
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Auditar APK final
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test "$(stat -c%s "$APK")" -gt 20000000
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/motion-badging.txt"
          grep -Fq "package: name='$MOTION_APP_ID' versionCode='$APP_VERSION_CODE' versionName='$APP_VERSION_NAME'" "$RUNNER_TEMP/motion-badging.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/motion-apksigner.txt"
          CERT="$(awk -F': ' 'tolower($0) ~ /certificate sha-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/motion-apksigner.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$CERT"
          test "$CERT" = "$MOTION_EXPECTED_CERT"
          unzip -l "$APK" > "$RUNNER_TEMP/apk-files.txt"
          grep -Fq 'assets/public/index.html' "$RUNNER_TEMP/apk-files.txt"
          grep -Fq 'assets/public/local-app.js' "$RUNNER_TEMP/apk-files.txt"
          grep -Fq 'assets/public/_next/static/' "$RUNNER_TEMP/apk-files.txt"
          for f in windows-beta-runtime.js android-native-fetch-beta10.js android-local-first-beta8.js android-domain-bridge-beta10.js android-quiz-offline-beta10.js android-local-navigation-beta10.js android-constancia-luz-beta11.js android-report-bridge-beta11.js android-motion-parity-beta11.js android-original-ui-beta10.js android-auditor-beta12.js android-performance-beta12.js android-podium-beta12.js; do grep -Fq "assets/public/motion/$f" "$RUNNER_TEMP/apk-files.txt"; done
          if grep -Eq 'assets/public/(offline\.html|offline-bridge\.html)|android-offline-first-beta7|android-rsc-guard-beta8' "$RUNNER_TEMP/apk-files.txt"; then echo "ERRO: arquitetura offline antiga dentro do APK" >&2; exit 1; fi
          unzip -p "$APK" assets/capacitor.config.json > "$RUNNER_TEMP/motion-capacitor-config.json"
          if grep -Fq '"server"' "$RUNNER_TEMP/motion-capacitor-config.json"; then echo "ERRO: APK depende de server.url" >&2; exit 1; fi
          grep -Fq "SantaLuziaOriginalUIOffline/2" "$RUNNER_TEMP/motion-capacitor-config.json"
          mkdir -p dist
          cp "$APK" "dist/Santa-Luzia-Motion-2.0-beta12.apk"
          SHA="$(sha256sum dist/Santa-Luzia-Motion-2.0-beta12.apk | awk '{print $1}')"
          SIZE="$(stat -c%s dist/Santa-Luzia-Motion-2.0-beta12.apk)"
          cat > dist/RELATORIO-MOTION-BETA12.txt <<EOF
          Santa Luzia Motion Beta Android
          Versão: $APP_VERSION_NAME
          VersionCode: $APP_VERSION_CODE
          ApplicationId: $MOTION_APP_ID
          Tamanho: $SIZE bytes
          SHA-256: $SHA
          Certificado Beta SHA-256: $CERT
          Assinatura: mesma chave persistente da Beta 11; atualização sobre a Beta 11 preserva os dados locais.
          Windows Beta visual fixada: $WINDOWS_BETA_COMMIT (0.1.0-beta.19)
          Servidor: $SYNC_SERVER_URL — somente autenticação/sincronização; UI continua local no APK.
          Beta 12: histórico de escalas online/offline; Auditor Santa Luzia com relatório JSON; auditoria de funcionalidades offline e ícones; proteção/backup/recuperação do banco do servidor; transições e rolagem estabilizadas; medição de FPS/latência; pódio usando o desenho .sl-r5-card-trophy da referência atual, com deduplicação.
          Persistência Android: SQLite nativo + CacheStorage/IndexedDB + filas locais.
          Android estável preservado: 1.0.6 / code18.
          Canal: artefato de teste; nenhuma release oficial publicada.
          EOF
          echo "MOTION_APK_SHA=$SHA" >> "$GITHUB_ENV"
          echo "MOTION_APK_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "MOTION_CERT=$CERT" >> "$GITHUB_ENV"

      - name: Guardar APK Beta 12
        uses: actions/upload-artifact@v4
        with:
          name: santa-luzia-motion-2.0-beta12
          path: |
            dist/Santa-Luzia-Motion-2.0-beta12.apk
            dist/RELATORIO-MOTION-BETA12.txt
          if-no-files-found: error
          retention-days: 14

      - name: Resumo
        run: |
          echo "### Santa Luzia Motion Beta 12" >> "$GITHUB_STEP_SUMMARY"
          echo "- Versão: $APP_VERSION_NAME / code $APP_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pacote: $MOTION_APP_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: $MOTION_APK_SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: $MOTION_APK_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Certificado Beta persistente: $MOTION_CERT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Histórico de Escalas + Auditor + banco protegido + performance/rolagem + pódio atual." >> "$GITHUB_STEP_SUMMARY"
          echo "- Android oficial 1.0.6/code18 não foi publicado nem alterado." >> "$GITHUB_STEP_SUMMARY"
