name: Android — Santa Luzia Motion Beta

on:
  push:
    branches:
      - beta/android-motion-2.0-beta1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-motion-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motion-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SANTA_LUZIA_MOTION_BETA: "1"
      AUTH_SECRET: ci-motion-beta-santa-luzia-12345678901234567890

    steps:
      - name: Checkout Motion Beta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restaurar cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-motion-gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-motion-gradle-
            ${{ runner.os }}-gradle-

      - name: Carregar configuração da Beta
        run: |
          node <<'NODE'
          const fs = require('fs')
          const c = require('./config/android-motion-beta.json')
          const vars = {
            APP_VERSION_CODE: c.versionCode,
            APP_VERSION_NAME: c.versionName,
            SANTA_LUZIA_MOTION_VERSION: c.versionName,
            CAPACITOR_SERVER_URL: c.serverUrl,
            MOTION_APP_ID: c.applicationId,
            WINDOWS_BETA_COMMIT: c.windowsBeta.commit,
            SYNC_SERVER_URL: c.serverUrl,
          }
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(vars).map(([k,v]) => `${k}=${v}\n`).join(''))
          NODE

      - name: Instalar dependências
        run: npm install --include=dev --no-audit --no-fund

      - name: Validar sintaxe da portabilidade
        run: |
          node --check android-web/motion/android-motion-beta.js
          node --check scripts/fetch-windows-beta-stack.cjs
          node --check scripts/prepare-motion-beta.cjs
          node --check scripts/auditar-motion-beta.cjs

      - name: Fixar stack completa da Beta Windows
        run: node scripts/fetch-windows-beta-stack.cjs

      - name: Confirmar cinco camadas Windows
        run: |
          test -s android-web/motion/windows-motion-fixes.css
          test -s android-web/motion/windows-behavior-fixes.js
          test -s android-web/motion/windows-beta7-polish.js
          test -s android-web/motion/windows-preload-v5.js
          test -s android-web/motion/windows-beta-runtime.js
          grep -Fq 'weekly-presence-v3' android-web/motion/windows-beta7-polish.js
          grep -Fq 'Constância de Luz' android-web/motion/windows-beta7-polish.js
          grep -Fq 'Pódio da equipe' android-web/motion/windows-preload-v5.js
          grep -Fq 'sl-r10-profile-icon' android-web/motion/windows-beta-runtime.js
          grep -Fq 'sl-r12-quiz-visible' android-web/motion/windows-beta-runtime.js

      - name: Auditar TypeScript
        run: npx tsc --noEmit

      - name: Auditar dependências declaradas
        run: npm ls --depth=0

      - name: Auditar robustez crítica
        run: npm run audit:robustez

      - name: Auditar núcleo offline
        run: npm run audit:offline

      - name: Auditar paridade Windows para Android
        run: node scripts/auditar-motion-beta.cjs

      - name: Validar aplicação web
        run: npm run build

      - name: Criar e sincronizar Capacitor Android
        run: |
          npx cap add android
          npx cap sync android
          APP_VERSION_CODE="$APP_VERSION_CODE" APP_VERSION_NAME="$APP_VERSION_NAME" node scripts/prepare-android.cjs
          node scripts/prepare-motion-beta.cjs
          grep -Eq "applicationId[[:space:]]+\"${MOTION_APP_ID//./\\.}\"" android/app/build.gradle
          grep -Eq "versionCode[[:space:]]+${APP_VERSION_CODE}" android/app/build.gradle
          grep -Fq "versionName \"${APP_VERSION_NAME}\"" android/app/build.gradle
          grep -Fq "Santa Luzia Motion Beta" android/app/src/main/res/values/strings.xml
          test -f android/app/src/main/assets/capacitor.config.json
          grep -Fq '"server"' android/app/src/main/assets/capacitor.config.json
          grep -Fq "$CAPACITOR_SERVER_URL" android/app/src/main/assets/capacitor.config.json
          if grep -Fq '"errorPath"' android/app/src/main/assets/capacitor.config.json; then
            echo "Motion Beta não pode cair em offline.html; deve manter a mesma interface via cache/Service Worker." >&2
            cat android/app/src/main/assets/capacitor.config.json >&2
            exit 1
          fi
          if grep -Fq 'offline.html' android/app/src/main/assets/capacitor.config.json; then
            echo "APK final ainda aponta para a interface offline separada." >&2
            cat android/app/src/main/assets/capacitor.config.json >&2
            exit 1
          fi
          for f in windows-motion-fixes.css windows-behavior-fixes.js windows-beta7-polish.js windows-preload-v5.js windows-beta-runtime.js android-motion-beta.js; do test -s "android/app/src/main/assets/public/motion/$f"; done
          grep -Fq "windows-beta7-polish.js" android/app/src/main/java/br/com/comunidadesantaluzia/app/MainActivity.java
          grep -Fq "windows-preload-v5.js" android/app/src/main/java/br/com/comunidadesantaluzia/app/MainActivity.java
          grep -Fq "30000" android/app/src/main/java/br/com/comunidadesantaluzia/app/MainActivity.java
          grep -Fq "LOAD_CACHE_ELSE_NETWORK" android/app/src/main/java/br/com/comunidadesantaluzia/app/MainActivity.java
          grep -Fq "SantaLuziaWindowsBeta/0.1.0-beta.19" android/app/src/main/assets/capacitor.config.json
          grep -Fq "SantaLuziaMotionBeta/$APP_VERSION_NAME" android/app/src/main/assets/capacitor.config.json

      - name: Compilar APK Motion Beta de teste
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Auditar APK final
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test "$(stat -c%s "$APK")" -gt 20000000
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/motion-badging.txt"
          grep -Fq "package: name='$MOTION_APP_ID' versionCode='$APP_VERSION_CODE' versionName='$APP_VERSION_NAME'" "$RUNNER_TEMP/motion-badging.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/motion-apksigner.txt"
          CERT="$(awk -F': ' 'tolower($0) ~ /certificate sha-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/motion-apksigner.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$CERT"
          for f in windows-motion-fixes.css windows-behavior-fixes.js windows-beta7-polish.js windows-preload-v5.js windows-beta-runtime.js android-motion-beta.js; do unzip -l "$APK" | grep -Fq "assets/public/motion/$f"; done
          unzip -p "$APK" assets/capacitor.config.json | tee "$RUNNER_TEMP/motion-capacitor-config.json"
          grep -Fq '"server"' "$RUNNER_TEMP/motion-capacitor-config.json"
          grep -Fq "$CAPACITOR_SERVER_URL" "$RUNNER_TEMP/motion-capacitor-config.json"
          if grep -Fq '"errorPath"' "$RUNNER_TEMP/motion-capacitor-config.json"; then
            echo "APK final ainda contém errorPath/offline.html." >&2
            exit 1
          fi
          if grep -Fq 'offline.html' "$RUNNER_TEMP/motion-capacitor-config.json"; then
            echo "APK final ainda contém a segunda interface offline." >&2
            exit 1
          fi
          grep -Fq "SantaLuziaWindowsBeta/0.1.0-beta.19" "$RUNNER_TEMP/motion-capacitor-config.json"
          grep -Fq "SantaLuziaMotionBeta/$APP_VERSION_NAME" "$RUNNER_TEMP/motion-capacitor-config.json"
          mkdir -p dist
          cp "$APK" "dist/Santa-Luzia-Motion-2.0-beta6.apk"
          SHA="$(sha256sum dist/Santa-Luzia-Motion-2.0-beta6.apk | awk '{print $1}')"
          SIZE="$(stat -c%s dist/Santa-Luzia-Motion-2.0-beta6.apk)"
          cat > dist/RELATORIO-MOTION-BETA6.txt <<EOF
          Santa Luzia Motion Beta Android
          Versão: $APP_VERSION_NAME
          VersionCode: $APP_VERSION_CODE
          ApplicationId: $MOTION_APP_ID
          Tamanho: $SIZE bytes
          SHA-256: $SHA
          Certificado debug: $CERT
          Windows Beta fixada: $WINDOWS_BETA_COMMIT
          Servidor de sincronização/abertura funcional: $SYNC_SERVER_URL
          Correção da Beta 6: remove errorPath/offline.html da experiência normal offline. O Android deve manter as mesmas rotas e interface via Service Worker/cache privado, SQLite/snapshot e fila local; a internet fica para sincronização.
          Identidade do WebView: SantaLuziaMotionBeta/$APP_VERSION_NAME e SantaLuziaWindowsBeta/0.1.0-beta.19.
          Camadas de referência: motion-fixes.css; behavior-fixes.js; beta7-polish.js; preload-v5.cjs; windows-beta-runtime.js revisão 14; complemento Android.
          Paridade exigida: Atrasos, Presenças, Registros, Escala, Formação, Perfil/Painel, Ranking, Login diário, Quiz/Kiss/Jornada, Jogos, transições, animações e offline.
          Android estável preservado: 1.0.6 / code18.
          Canal: artefato de teste; nenhuma release oficial publicada.
          EOF
          echo "MOTION_APK_SHA=$SHA" >> "$GITHUB_ENV"
          echo "MOTION_APK_SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: Guardar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: santa-luzia-motion-2.0-beta6
          path: |
            dist/Santa-Luzia-Motion-2.0-beta6.apk
            dist/RELATORIO-MOTION-BETA6.txt
          if-no-files-found: error
          retention-days: 14

      - name: Resumo
        run: |
          echo "### Santa Luzia Motion Beta 6" >> "$GITHUB_STEP_SUMMARY"
          echo "- Versão: $APP_VERSION_NAME / code $APP_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pacote separado: $MOTION_APP_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: $MOTION_APK_SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: $MOTION_APK_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Remove a interface offline separada e mantém a mesma experiência via cache/Service Worker." >> "$GITHUB_STEP_SUMMARY"
          echo "- Android oficial não foi publicado nem alterado." >> "$GITHUB_STEP_SUMMARY"
