name: Android — Santa Luzia Motion Beta

on:
  push:
    branches:
      - beta/android-motion-2.0-beta1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-motion-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motion-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SANTA_LUZIA_MOTION_BETA: "1"
      AUTH_SECRET: ci-motion-beta-santa-luzia-12345678901234567890

    steps:
      - name: Checkout Motion Beta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restaurar cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-motion-gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-motion-gradle-
            ${{ runner.os }}-gradle-

      - name: Carregar configuração da Beta
        run: |
          node <<'NODE'
          const fs = require('fs')
          const c = require('./config/android-motion-beta.json')
          if (c.versionName !== '2.0.0-beta.9' || c.versionCode !== 20009) throw new Error('Workflow exige Beta 9/code20009')
          const vars = {
            APP_VERSION_CODE: c.versionCode,
            APP_VERSION_NAME: c.versionName,
            SANTA_LUZIA_MOTION_VERSION: c.versionName,
            MOTION_APP_ID: c.applicationId,
            SYNC_SERVER_URL: c.serverUrl,
          }
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(vars).map(([k,v]) => `${k}=${v}\n`).join(''))
          NODE

      - name: Instalar dependências
        run: npm install --include=dev --no-audit --no-fund

      - name: Validar sintaxe local-first
        run: |
          node --check android-web/app.js
          node --check android-web/quiz-local.js
          node --check scripts/validate-android-web.cjs
          node --check scripts/prepare-motion-beta.cjs
          node --check scripts/auditar-motion-beta.cjs
          node scripts/validate-android-web.cjs

      - name: Auditar TypeScript
        run: npx tsc --noEmit

      - name: Auditar dependências declaradas
        run: npm ls --depth=0

      - name: Auditar robustez crítica
        run: npm run audit:robustez

      - name: Auditar núcleo offline
        run: npm run audit:offline

      - name: Auditar arquitetura Motion Beta 9
        run: node scripts/auditar-motion-beta.cjs

      - name: Validar aplicação web e assets Android
        run: npm run build

      - name: Criar Android local e sincronizar Capacitor
        run: |
          npx cap add android
          npx cap sync android
          APP_VERSION_CODE="$APP_VERSION_CODE" APP_VERSION_NAME="$APP_VERSION_NAME" node scripts/prepare-android.cjs
          node scripts/prepare-motion-beta.cjs
          grep -Eq "applicationId[[:space:]]+\"${MOTION_APP_ID//./\\.}\"" android/app/build.gradle
          grep -Eq "versionCode[[:space:]]+${APP_VERSION_CODE}" android/app/build.gradle
          grep -Fq "versionName \"${APP_VERSION_NAME}\"" android/app/build.gradle
          test -s android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/public/app.js
          test -s android/app/src/main/assets/public/app.css
          test -s android/app/src/main/assets/public/quiz-local.js
          test -s android/app/src/main/assets/public/offline/liturgia-completa/2026-08.json
          test -s android/app/src/main/assets/public/whatajong/index.html
          test -s android/app/src/main/java/br/com/comunidadesantaluzia/app/SyncHttpPlugin.java
          test -s android/app/src/main/java/br/com/comunidadesantaluzia/app/OfflineStorePlugin.java
          test ! -e android/app/src/main/assets/public/offline.html
          test ! -e android/app/src/main/assets/public/offline-bridge.html
          node <<'NODE'
          const fs = require('fs')
          const c = JSON.parse(fs.readFileSync('android/app/src/main/assets/capacitor.config.json','utf8'))
          if (c.server?.url) throw new Error(`APK Beta 9 ainda possui server.url: ${c.server.url}`)
          if (!String(c.android?.appendUserAgent || '').includes('SantaLuziaLocalFirst/1')) throw new Error('User-Agent local-first ausente')
          NODE
          grep -Fq "registerPlugin(SyncHttpPlugin.class)" android/app/src/main/java/br/com/comunidadesantaluzia/app/MainActivity.java
          grep -Fq "registerPlugin(OfflineStorePlugin.class)" android/app/src/main/java/br/com/comunidadesantaluzia/app/MainActivity.java
          if grep -Eq "evaluateJavascript|android-local-first-beta8|android-offline-first-beta7" android/app/src/main/java/br/com/comunidadesantaluzia/app/MainActivity.java; then
            echo "MainActivity ainda depende do runtime remoto legado." >&2
            exit 1
          fi

      - name: Compilar APK Motion Beta 9
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Auditar APK final local-first
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test "$(stat -c%s "$APK")" -gt 20000000
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/motion-badging.txt"
          grep -Fq "package: name='$MOTION_APP_ID' versionCode='$APP_VERSION_CODE' versionName='$APP_VERSION_NAME'" "$RUNNER_TEMP/motion-badging.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/motion-apksigner.txt"
          CERT="$(awk -F': ' 'tolower($0) ~ /certificate sha-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/motion-apksigner.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$CERT"
          for f in index.html app.js app.css quiz-local.js; do unzip -l "$APK" | grep -Fq "assets/public/$f"; done
          unzip -l "$APK" | grep -Fq "assets/public/offline/liturgia-completa/2026-08.json"
          unzip -l "$APK" | grep -Fq "assets/public/whatajong/index.html"
          if unzip -l "$APK" | grep -Fq "assets/public/offline.html"; then echo "APK contém interface offline paralela." >&2; exit 1; fi
          if unzip -l "$APK" | grep -Fq "assets/public/offline-bridge.html"; then echo "APK contém bridge offline legado." >&2; exit 1; fi
          unzip -p "$APK" assets/capacitor.config.json > "$RUNNER_TEMP/motion-capacitor-config.json"
          node <<'NODE'
          const fs = require('fs')
          const c = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/motion-capacitor-config.json','utf8'))
          if (c.server?.url) throw new Error(`APK final possui server.url: ${c.server.url}`)
          if (!String(c.android?.appendUserAgent || '').includes('SantaLuziaLocalFirst/1')) throw new Error('APK final não identifica arquitetura local-first')
          NODE
          unzip -p "$APK" assets/public/index.html | grep -Fq "app.js"
          unzip -p "$APK" assets/public/app.js | grep -Fq 'const VERSION = "2.0.0-beta.9"'
          unzip -p "$APK" assets/public/app.js | grep -Fq 'plugin("OfflineStore")'
          unzip -p "$APK" assets/public/app.js | grep -Fq 'plugin("SyncHttp")'
          mkdir -p dist
          cp "$APK" "dist/Santa-Luzia-Motion-2.0-beta9.apk"
          SHA="$(sha256sum dist/Santa-Luzia-Motion-2.0-beta9.apk | awk '{print $1}')"
          SIZE="$(stat -c%s dist/Santa-Luzia-Motion-2.0-beta9.apk)"
          cat > dist/RELATORIO-MOTION-BETA9.txt <<EOF
          Santa Luzia Motion Beta Android
          Versão: $APP_VERSION_NAME
          VersionCode: $APP_VERSION_CODE
          ApplicationId: $MOTION_APP_ID
          Tamanho: $SIZE bytes
          SHA-256: $SHA
          Certificado debug: $CERT
          Servidor de sincronização: $SYNC_SERVER_URL
          Arquitetura: aplicativo local-first real. O WebView inicia sempre pelo index.html empacotado no APK e o capacitor.config.json não contém server.url.
          Interface/navegação/animações: locais no APK. Não existe offline.html nem interface paralela.
          Persistência: SQLite nativo via OfflineStore para sessão, snapshots/documentos e fila durável.
          Sincronização: SyncHttp nativo HTTPS, com sessão/cookies, envia fila pendente e recebe novidades quando há internet.
          Migração: snapshots e fila da Beta 8 são convertidos automaticamente para o modelo Beta 9.
          Dados locais: Escalas, Formações, Ranking, Perfil/Equipe, Atrasos e demais dados já sincronizados permanecem disponíveis sem rede.
          Operações locais: presença/justificativa, Atrasos, listas do moderador, novas Escalas/Formações, perfil, tema, registros, quizzes e resultados dos jogos entram em fila para sincronização posterior.
          Liturgia: acervo anual empacotado no APK.
          Jogos: Missão do Altar/Joias da Luz e Whatajong empacotados localmente; resultados podem aguardar sincronização.
          Quiz Litúrgico offline: usa endpoint idempotente /api/quizzes/liturgia/offline na reconciliação.
          Android estável preservado: 1.0.6 / code18.
          Canal: artefato de teste Beta; nenhuma release oficial publicada.
          EOF
          echo "MOTION_APK_SHA=$SHA" >> "$GITHUB_ENV"
          echo "MOTION_APK_SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: Guardar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: santa-luzia-motion-2.0-beta9
          path: |
            dist/Santa-Luzia-Motion-2.0-beta9.apk
            dist/RELATORIO-MOTION-BETA9.txt
          if-no-files-found: error
          retention-days: 14

      - name: Resumo
        run: |
          echo "### Santa Luzia Motion Beta 9" >> "$GITHUB_STEP_SUMMARY"
          echo "- Versão: $APP_VERSION_NAME / code $APP_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pacote separado: $MOTION_APP_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: $MOTION_APK_SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: $MOTION_APK_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- WebView local: sem server.url; interface nasce do APK." >> "$GITHUB_STEP_SUMMARY"
          echo "- SQLite + fila durável + SyncHttp nativo para sincronização posterior." >> "$GITHUB_STEP_SUMMARY"
          echo "- Android oficial não foi publicado nem alterado." >> "$GITHUB_STEP_SUMMARY"
