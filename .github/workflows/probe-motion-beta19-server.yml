name: Motion Beta 19 — Probe servidor

on:
  push:
    branches:
      - work/android-motion-beta19-regression-fix
    paths:
      - .github/workflows/probe-motion-beta19-server.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnosticar domínio e contrato sem credenciais reais
        shell: bash
        run: |
          set -u
          BASE='https://comunidade-santa-luzia-production.up.railway.app'
          for path in / /api/app/status /api/auth/me; do
            echo "=== GET $path ==="
            curl -sS -L --max-time 20 -o "$RUNNER_TEMP/body" -D "$RUNNER_TEMP/headers" -w 'HTTP=%{http_code} EFFECTIVE=%{url_effective}\n' "$BASE$path" || true
            grep -Ei '^(server|location|content-type|x-powered-by|x-railway|railway|cache-control):' "$RUNNER_TEMP/headers" || true
            printf 'BODY_PREFIX='
            head -c 260 "$RUNNER_TEMP/body" 2>/dev/null | tr '\n\r' '  ' || true
            echo
          done
          echo '=== POST /api/auth/login ==='
          curl -sS -L --max-time 20 -o "$RUNNER_TEMP/login" -D "$RUNNER_TEMP/login.headers" -w 'HTTP=%{http_code} EFFECTIVE=%{url_effective}\n' -H 'Content-Type: application/json' -d '{"usuario":"__probe_beta19_inexistente__","senha":"__senha_probe_invalida__"}' "$BASE/api/auth/login" || true
          grep -Ei '^(server|location|content-type|x-powered-by|x-railway|railway|cache-control):' "$RUNNER_TEMP/login.headers" || true
          printf 'BODY_PREFIX='
          head -c 500 "$RUNNER_TEMP/login" 2>/dev/null | tr '\n\r' '  ' || true
          echo
