name: Motion Beta 19 — Probe servidor

on:
  push:
    branches:
      - work/android-motion-beta19-regression-fix
    paths:
      - .github/workflows/probe-motion-beta19-server.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar status e contrato de login
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://comunidade-santa-luzia-production.up.railway.app'
          curl -fsS --max-time 20 -D "$RUNNER_TEMP/status.headers" "$BASE/api/app/status" -o "$RUNNER_TEMP/status.json"
          cat "$RUNNER_TEMP/status.json"
          CODE="$(curl -sS --max-time 20 -o "$RUNNER_TEMP/login.json" -w '%{http_code}' -H 'Content-Type: application/json' -d '{"usuario":"__probe_beta19_inexistente__","senha":"__senha_probe_invalida__"}' "$BASE/api/auth/login")"
          cat "$RUNNER_TEMP/login.json"
          test "$CODE" = '401' || test "$CODE" = '403' || test "$CODE" = '429'
          node - <<'NODE'
          const fs=require('fs')
          const data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/login.json','utf8'))
          if(data.ok!==false) throw new Error('Contrato de login sem ok:false')
          if(typeof data.erro!=='string'||!data.erro.trim()) throw new Error('Contrato de login sem erro descritivo')
          console.log('Contrato /api/auth/login compatível com a Motion Beta.')
          NODE
