name: Local-first Dia 6 — redução de tráfego

on:
  push:
    branches:
      - agent/local-first-day6-traffic
    paths:
      - scripts/day6-apply-traffic-reduction.cjs
      - .github/workflows/local-first-day6-check.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTH_SECRET: ci-local-first-dia6-12345678901234567890
      CAPACITOR_SERVER_URL: https://comunidade-santa-luzia-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-first-day6-traffic
          fetch-depth: 0
      - name: Aplicar e validar redução de tráfego
        shell: bash
        run: |
          set +e
          node scripts/day6-apply-traffic-reduction.cjs
          CODEMOD=$?
          INSTALL=99; TYPESCRIPT=99; AUDIT=99; BUILD=99; TRAFFICCHECK=99
          if [ "$CODEMOD" -eq 0 ]; then npm install --no-audit --no-fund; INSTALL=$?; fi
          if [ "$INSTALL" -eq 0 ]; then
            npx tsc --noEmit; TYPESCRIPT=$?
            npm run audit:robustez; AUDIT=$?
            npm run build; BUILD=$?
          fi
          grep -Fq 'const INTERVALO_STATUS = 60_000' components/server-sync-runtime.tsx \
            && grep -Fq '15 * 60_000' components/server-sync-runtime.tsx \
            && grep -Fq 'ULTIMA_COMPLETA_KEY' components/server-sync-runtime.tsx \
            && grep -Fq 'santa-luzia:manual-sync' components/server-sync-runtime.tsx \
            && grep -Fq '2 * 60_000' components/native-notification-runtime.tsx \
            && grep -Fq 'dedupingInterval: 30_000' components/notification-center.tsx
          TRAFFICCHECK=$?
          export CODEMOD INSTALL TYPESCRIPT AUDIT BUILD TRAFFICCHECK
          node <<'NODE'
          const fs=require('fs'); const n=k=>Number(process.env[k]);
          const r={checkedAt:new Date().toISOString(),codemodExit:n('CODEMOD'),installExit:n('INSTALL'),typescriptExit:n('TYPESCRIPT'),auditExit:n('AUDIT'),buildExit:n('BUILD'),trafficCheckExit:n('TRAFFICCHECK')};
          r.ok=Object.entries(r).filter(([k])=>k.endsWith('Exit')).every(([,v])=>v===0);
          fs.writeFileSync('.github/local-first-day6-validation.json',JSON.stringify(r,null,2)+'\n'); console.log(JSON.stringify(r,null,2));
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/server-sync-runtime.tsx components/native-notification-runtime.tsx components/notification-center.tsx components/pull-to-refresh.tsx .github/local-first-day6-validation.json
          git commit -m 'Aplica redução de tráfego local-first' || true
          git pull --rebase origin agent/local-first-day6-traffic
          git push origin HEAD:agent/local-first-day6-traffic
          test "$CODEMOD" -eq 0 && test "$INSTALL" -eq 0 && test "$TYPESCRIPT" -eq 0 && test "$AUDIT" -eq 0 && test "$BUILD" -eq 0 && test "$TRAFFICCHECK" -eq 0
