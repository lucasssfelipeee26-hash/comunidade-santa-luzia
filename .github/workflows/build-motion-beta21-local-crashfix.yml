name: Android — Motion Beta 21 Local Crashfix

on:
  push:
    branches:
      - fix/beta21-login
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: santa-luzia-motion-beta21-local-crashfix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SANTA_LUZIA_MOTION_BETA: "1"
      SANTA_LUZIA_MOTION_VERSION: "2.0.0-beta.21"
      APP_VERSION_CODE: "20021"
      APP_VERSION_NAME: "2.0.0-beta.21"
      MOTION_APP_ID: br.com.comunidadesantaluzia.motionbeta

    steps:
      - name: Checkout Beta 21 local
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validar isolamento e servidor local
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const beta=require('./config/android-motion-beta.json')
          const stable=require('./config/android-build.json')
          if(beta.versionName!=='2.0.0-beta.21'||beta.versionCode!==20021) throw new Error('Fonte não é Beta 21')
          if(beta.applicationId!=='br.com.comunidadesantaluzia.motionbeta') throw new Error('Pacote Motion alterado')
          if(beta.serverUrl!=='http://192.168.1.7:3000') throw new Error(`Servidor local divergente: ${beta.serverUrl}`)
          if(stable.versionName!=='1.0.6'||stable.versionCode!==18) throw new Error('Canal oficial alterado')
          NODE

      - name: Instalar dependências
        run: npm install --include=dev --no-audit --no-fund

      - name: Restaurar runtime visual histórico
        shell: bash
        run: |
          set -euo pipefail
          node scripts/fetch-windows-beta-stack.cjs
          node scripts/patch-windows-polish-android-beta18.cjs

      - name: Auditar fonte e regressões
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/auth-client.test.cjs
          npx tsc --noEmit
          node scripts/auditar-robustez.cjs
          npm run audit:offline
          node scripts/auditar-beta20-heranca-completa.cjs
          node scripts/auditar-beta20-estrutural.cjs

      - name: Compilar React local e iLiturgia offline
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-next.cjs
          npm run build:android-local
          node scripts/patch-beta19-offline-pack.cjs
          node scripts/patch-beta19-android-web.cjs
          node scripts/bundle-motion-beta20.cjs
          test -s android-web/index.html
          test -s android-web/local-app.js
          test "$(stat -c%s android-web/local-app.js)" -gt 250000
          test -s android-web/motion/android-motion-runtime-beta20.js
          grep -Fq '"androidAssetTransport": "binary-v1"' android-web/offline/iliturgia/manifest.json
          grep -Fq '"beta": "2.0.0-beta.21"' android-web/offline/iliturgia/manifest.json

      - name: Preparar Android e corrigir crash LocalNotifications
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          npx cap sync android
          APP_VERSION_CODE="$APP_VERSION_CODE" APP_VERSION_NAME="$APP_VERSION_NAME" node scripts/prepare-android.cjs
          node scripts/prepare-motion-beta20.cjs
          node scripts/patch-local-notifications-beta21.cjs
          grep -Fq 'debuggable false' android/app/build.gradle
          grep -Fq 'signingConfig signingConfigs.debug' android/app/build.gradle
          grep -Fq 'android:launchMode="singleTop"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:screenOrientation="portrait"' android/app/src/main/AndroidManifest.xml
          PLUGIN_KT="node_modules/@capacitor/local-notifications/android/src/main/kotlin/com/capacitorjs/plugins/localnotifications/LocalNotificationsPlugin.kt"
          test -s "$PLUGIN_KT"
          grep -Fq 'permissionsResultJSON.put("display", getNotificationPermissionText())' "$PLUGIN_KT"
          if grep -Fq 'super.checkPermissions(call)' "$PLUGIN_KT"; then
            echo 'ERRO: checkPermissions inseguro permaneceu no plugin' >&2
            exit 1
          fi

      - name: Compilar APK Release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Auditar e preparar APK final
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test "$(stat -c%s "$APK")" -gt 15000000
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -Fq "package: name='$MOTION_APP_ID' versionCode='$APP_VERSION_CODE' versionName='$APP_VERSION_NAME'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "application-label:'Santa Luzia Motion Beta'" "$RUNNER_TEMP/badging.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          unzip -l "$APK" > "$RUNNER_TEMP/apk-files.txt"
          for file in \
            assets/public/index.html \
            assets/public/local-app.js \
            assets/public/motion/android-motion-runtime-beta20.js \
            assets/public/offline/iliturgia/oficio-01.html.json.bin \
            assets/public/offline/iliturgia/lecionario.html.json.bin \
            assets/public/offline/iliturgia/missal.html.json.bin \
            assets/capacitor.config.json; do
              grep -Fq "$file" "$RUNNER_TEMP/apk-files.txt"
          done
          mkdir -p dist
          cp "$APK" dist/Santa-Luzia-Motion-2.0.0-beta.21-LOCAL-CRASHFIX.apk
          sha256sum dist/Santa-Luzia-Motion-2.0.0-beta.21-LOCAL-CRASHFIX.apk > dist/Santa-Luzia-Motion-2.0.0-beta.21-LOCAL-CRASHFIX.apk.sha256
          cat > dist/RELATORIO-LOCAL-CRASHFIX.txt <<'EOF'
          Santa Luzia Motion Beta 21 — servidor local + correção de crash
          Servidor: http://192.168.1.7:3000
          Pacote: br.com.comunidadesantaluzia.motionbeta
          Correção: evita NullPointerException em LocalNotificationsPlugin.checkPermissions no Android/Samsung.
          Interface local/offline, SQLite, iLiturgia e demais recursos da Beta 21 preservados.
          Aplicativo oficial 1.0.6/code18 não alterado.
          EOF

      - name: Guardar APK para teste
        uses: actions/upload-artifact@v4
        with:
          name: santa-luzia-motion-beta21-local-crashfix
          path: |
            dist/Santa-Luzia-Motion-2.0.0-beta.21-LOCAL-CRASHFIX.apk
            dist/Santa-Luzia-Motion-2.0.0-beta.21-LOCAL-CRASHFIX.apk.sha256
            dist/RELATORIO-LOCAL-CRASHFIX.txt
          retention-days: 14
          if-no-files-found: error
