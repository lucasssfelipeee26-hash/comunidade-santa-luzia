name: Ponte temporaria de assinatura Android code 17

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ephemeral-signing-bridge-code17.yml

permissions:
  contents: write
  actions: read

jobs:
  gerar-ponte:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Gerar chave RSA temporaria
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/bridge-code17"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/bridge-code17/private.pem"
          openssl req -new -x509 \
            -key "$RUNNER_TEMP/bridge-code17/private.pem" \
            -out "$RUNNER_TEMP/bridge-code17/public-cert.pem" \
            -days 1 \
            -subj '/CN=Santa Luzia Ephemeral Signing Bridge Code 17'
          chmod 600 "$RUNNER_TEMP/bridge-code17/private.pem"

      - name: Guardar chave privada temporaria somente como artefato
        uses: actions/upload-artifact@v4
        with:
          name: bridge-code17-private-key
          path: ${{ runner.temp }}/bridge-code17/private.pem
          retention-days: 1
          if-no-files-found: error

      - name: Guardar certificado publico como artefato
        uses: actions/upload-artifact@v4
        with:
          name: bridge-code17-public-cert
          path: ${{ runner.temp }}/bridge-code17/public-cert.pem
          retention-days: 1
          if-no-files-found: error

      - name: Publicar somente certificado publico e run id
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/bridge-code17/public-cert.pem" .github/bridge-code17-public-cert.pem
          printf '%s\n' '${{ github.run_id }}' > .github/bridge-code17-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/bridge-code17-public-cert.pem .github/bridge-code17-run-id.txt
          git commit -m 'Publica certificado efemero para assinatura da build 17'
          git push origin HEAD:main
