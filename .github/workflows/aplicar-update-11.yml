name: Aplicar Update 11

on:
  push:
    paths:
      - 'PATCH-SERVIDOR-SANTA-LUZIA-UPDATE-11.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch do servidor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/santa-luzia-update-11
          mkdir -p /tmp/santa-luzia-update-11
          unzip -q PATCH-SERVIDOR-SANTA-LUZIA-UPDATE-11.zip -d /tmp/santa-luzia-update-11

          while IFS= read -r arquivo; do
            [ -z "$arquivo" ] && continue
            rm -f "$arquivo"
          done < /tmp/santa-luzia-update-11/DELETE-LIST.txt
          rm -f /tmp/santa-luzia-update-11/DELETE-LIST.txt

          cp -a /tmp/santa-luzia-update-11/. ./

          rm -f PATCH-SERVIDOR-SANTA-LUZIA-UPDATE-11.zip
          rm -f deploy/TRIGGER-UPDATE-11.txt
          rm -f deploy/update11-server-overlay.tar.gz.b64

      - name: Commitar Update 11
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nenhuma alteracao para publicar.'
            exit 0
          fi
          git commit -m 'Publicar Santa Luzia 0.11.0 - acesso, visitante e sincronizacao'
          git push origin HEAD:main
