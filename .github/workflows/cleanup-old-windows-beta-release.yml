name: TEMP — remover release Windows do Android

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-old-windows-beta-release.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remover prerelease Windows antiga do repositório Android
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view windows-beta-v0.1.0-beta.1 >/dev/null 2>&1; then
            gh release delete windows-beta-v0.1.0-beta.1 --yes --cleanup-tag
          fi

      - name: Remover workflow temporário
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cleanup-old-windows-beta-release.yml
          git commit -m 'Remove workflow temporário de limpeza Windows Beta'
          git pull --rebase origin main
          git push origin HEAD:main
