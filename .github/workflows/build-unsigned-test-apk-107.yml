name: Android 1.0.7 code 19 — preparar APK de teste

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-unsigned-test-apk-107.yml

permissions:
  contents: read

concurrency:
  group: android-test-107-code19-unsigned
  cancel-in-progress: false

env:
  APP_VERSION_CODE: "19"
  APP_VERSION_NAME: "1.0.7"
  CAPACITOR_SERVER_URL: https://comunidade-santa-luzia-production.up.railway.app
  AUTH_SECRET: ci-test-107-code19-nao-usar-em-producao-123456789

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Validar projeto e preparar Android
        shell: bash
        run: |
          set -euo pipefail
          # Metadados ficam locais ao runner para não publicar code 19 antes do servidor estar validado.
          node <<'NODE'
          const fs = require('node:fs')
          const p = 'config/android-build.json'
          const b = JSON.parse(fs.readFileSync(p, 'utf8'))
          b.versionCode = 19
          b.versionName = '1.0.7'
          fs.writeFileSync(p, JSON.stringify(b, null, 2) + '\n')
          NODE
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run audit:robustez
          npm run build
          npx cap add android
          npx cap sync android
          node scripts/prepare-android.cjs
          grep -Eq 'versionCode[[:space:]]+19' android/app/build.gradle
          grep -Eq 'versionName[[:space:]]+"1\.0\.7"' android/app/build.gradle
      - name: Gerar APK release não assinado
        shell: bash
        run: |
          set -euo pipefail
          (cd android && ./gradlew assembleRelease --no-daemon)
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          APKSIGNER_JAR="$(find "$ANDROID_HOME/build-tools" -type f -path '*/lib/apksigner.jar' | sort -V | tail -1)"
          test -x "$ZIPALIGN" && test -s "$APKSIGNER_JAR"
          mkdir -p dist
          "$ZIPALIGN" -f -p 4 "$APK" dist/Santa-Luzia-1.0.7-code19-alinhado-nao-assinado.apk
          cp "$APKSIGNER_JAR" dist/apksigner.jar
          sha256sum dist/Santa-Luzia-1.0.7-code19-alinhado-nao-assinado.apk > dist/Santa-Luzia-1.0.7-code19-alinhado-nao-assinado.apk.sha256
      - name: Guardar pacote para assinatura local segura
        uses: actions/upload-artifact@v4
        with:
          name: Santa-Luzia-1.0.7-code19-para-assinar
          path: |
            dist/Santa-Luzia-1.0.7-code19-alinhado-nao-assinado.apk
            dist/Santa-Luzia-1.0.7-code19-alinhado-nao-assinado.apk.sha256
            dist/apksigner.jar
          if-no-files-found: error
          retention-days: 3
