name: Android — publicar APK gratuito

on:
  push:
    branches: [main]
    paths:
      - config/android-release.json
  workflow_dispatch:
    inputs:
      version_code:
        description: Código inteiro da versão (aumentar a cada envio)
        required: true
        default: "1"
      version_name:
        description: Nome público da versão
        required: true
        default: "1.0.0"

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL }}
      AUTH_SECRET: ci-apenas-para-validacao-nao-usar-em-producao-123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validar URL do aplicativo
        run: test -n "$CAPACITOR_SERVER_URL" && echo "$CAPACITOR_SERVER_URL" | grep -q '^https://'
      - name: Definir versão
        env:
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          echo "APP_VERSION_CODE=${INPUT_VERSION_CODE:-$(node -p 'require("./config/android-release.json").versionCode')}" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=${INPUT_VERSION_NAME:-$(node -p 'require("./config/android-release.json").versionName')}" >> "$GITHUB_ENV"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar aplicação web
        run: npm run build
      - name: Criar e sincronizar Android
        run: |
          npx cap add android
          npx cap sync android
          node scripts/prepare-android.cjs

      - name: Verificar chave permanente de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
      - name: Preparar chave de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/santa-luzia-upload.jks"
      - name: Configurar assinatura
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/santa-luzia-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-android-signing.cjs
      - name: Gerar APK assinado
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/santa-luzia-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Preparar arquivos oficiais
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/santa-luzia.apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Santa-Luzia-${APP_VERSION_NAME}.apk"
          cd dist
          sha256sum santa-luzia.apk > santa-luzia.apk.sha256
      - name: Publicar no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${APP_VERSION_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/santa-luzia.apk "dist/Santa-Luzia-${APP_VERSION_NAME}.apk" dist/santa-luzia.apk.sha256 --clobber
            gh release edit "$TAG" --latest --title "Santa Luzia ${APP_VERSION_NAME}"
          else
            gh release create "$TAG" dist/santa-luzia.apk "dist/Santa-Luzia-${APP_VERSION_NAME}.apk" dist/santa-luzia.apk.sha256 --latest --title "Santa Luzia ${APP_VERSION_NAME}" --notes "Aplicativo Android oficial da Comunidade Santa Luzia. Baixe o arquivo santa-luzia.apk para instalar ou atualizar."
          fi
