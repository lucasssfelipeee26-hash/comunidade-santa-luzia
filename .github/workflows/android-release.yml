name: Android — publicar APK gratuito

on:
  push:
    branches: [main]
    paths:
      - config/android-build.json
  workflow_dispatch:
    inputs:
      version_code:
        description: Código inteiro da build Android
        required: true
        default: "7"
      version_name:
        description: Nome público da versão
        required: true
        default: "1.0.5"

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL || 'https://comunidade-santa-luzia-production.up.railway.app' }}
      AUTH_SECRET: ci-apenas-para-validacao-nao-usar-em-producao-123456789
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validar URL do aplicativo
        run: test -n "$CAPACITOR_SERVER_URL" && echo "$CAPACITOR_SERVER_URL" | grep -q '^https://'

      - name: Definir versão
        env:
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          echo "APP_VERSION_CODE=${INPUT_VERSION_CODE:-$(node -p 'require("./config/android-build.json").versionCode')}" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=${INPUT_VERSION_NAME:-$(node -p 'require("./config/android-build.json").versionName')}" >> "$GITHUB_ENV"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar aplicação web
        run: npm run build

      - name: Criar e sincronizar Android
        run: |
          npx cap add android
          npx cap sync android
          node scripts/prepare-android.cjs

      - name: Verificar chave permanente de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "HAS_ANDROID_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "HAS_ANDROID_SIGNING=false" >> "$GITHUB_ENV"
            echo "Chave não configurada: o APK será validado e guardado como artefato, sem publicação."
          fi

      - name: Preparar chave de assinatura
        if: env.HAS_ANDROID_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/santa-luzia-upload.jks"

      - name: Configurar assinatura
        if: env.HAS_ANDROID_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/santa-luzia-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-android-signing.cjs

      - name: Gerar APK assinado
        if: env.HAS_ANDROID_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/santa-luzia-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Gerar APK para validação
        if: env.HAS_ANDROID_SIGNING != 'true'
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Guardar APK de validação
        if: env.HAS_ANDROID_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: santa-luzia-${{ env.APP_VERSION_NAME }}-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Preparar arquivos oficiais
        if: env.HAS_ANDROID_SIGNING == 'true'
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/santa-luzia.apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Santa-Luzia-${APP_VERSION_NAME}.apk"
          cd dist
          sha256sum santa-luzia.apk > santa-luzia.apk.sha256

      - name: Publicar no GitHub Releases
        if: env.HAS_ANDROID_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${APP_VERSION_NAME}"
          NOTES="Santa Luzia ${APP_VERSION_NAME}: Joias da Luz nativo com match-3 refeito, perfis da equipe com recados, classificação modernizada, notificações mais rápidas, painel compacto e correções de seleção/foco no Android. O nome público continua ${APP_VERSION_NAME}; o código interno da build aumenta para permitir atualização por cima da instalação existente."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/santa-luzia.apk "dist/Santa-Luzia-${APP_VERSION_NAME}.apk" dist/santa-luzia.apk.sha256 --clobber
            gh release edit "$TAG" --latest --title "Santa Luzia ${APP_VERSION_NAME}" --notes "$NOTES"
          else
            gh release create "$TAG" dist/santa-luzia.apk "dist/Santa-Luzia-${APP_VERSION_NAME}.apk" dist/santa-luzia.apk.sha256 --latest --title "Santa Luzia ${APP_VERSION_NAME}" --notes "$NOTES"
          fi

      - name: Publicar metadados seguros do atualizador
        if: env.HAS_ANDROID_SIGNING == 'true'
        env:
          RELEASE_DATE: "2026-08-16"
        run: |
          node <<'NODE'
          const fs = require('fs')
          const crypto = require('crypto')
          const path = 'config/android-release.json'
          const apk = 'dist/santa-luzia.apk'
          const atual = JSON.parse(fs.readFileSync(path, 'utf8'))
          const bytes = fs.readFileSync(apk)
          atual.versionCode = Number(process.env.APP_VERSION_CODE)
          atual.versionName = process.env.APP_VERSION_NAME
          atual.publishedAt = process.env.RELEASE_DATE
          atual.required = false
          atual.apkSize = bytes.length
          atual.apkSha256 = crypto.createHash('sha256').update(bytes).digest('hex')
          atual.highlights = [
            'Joias da Luz agora roda nativamente no Android com trocas, combinações, cascatas e queda das peças corrigidas',
            'Perfis da equipe ganharam recados com indicador pulsante, rank, pontos e aproveitamento',
            'Notificações chegam mais rápido e são marcadas como vistas ao abrir o sino',
            'Painel, campos de texto, seleção, copiar e colar receberam ajustes visuais e de desempenho'
          ]
          fs.writeFileSync(path, JSON.stringify(atual, null, 2) + '\n')
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add config/android-release.json
          if git diff --cached --quiet; then
            echo 'Metadados já estavam atualizados.'
          else
            git commit -m "Publica metadados Android ${APP_VERSION_NAME}"
            git push origin HEAD:main
          fi
