name: Publicar Santa Luzia 1.0.6 code 17 com chave original

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-android-106-code17-secure.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL || 'https://comunidade-santa-luzia-production.up.railway.app' }}
      AUTH_SECRET: ci-apenas-para-validacao-nao-usar-em-producao-123456789
      APP_VERSION_CODE: "17"
      APP_VERSION_NAME: "1.0.6"
      EXPECTED_CERT: 1602f064eed7dba5aca9c54e9cfb0a7a9850d18a426059566f3e725320866e18
      EXPECTED_CMS_SHA256: 966442d2eb4635792c180b2f6817c3a4ee5ccc46d57a0a911520c6db365a9a5a
      BRIDGE_RUN_ID: "32198477191"

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Registrar run id
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '${{ github.run_id }}' > .github/publish-code17-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/publish-code17-run-id.txt
          git commit -m 'Registra execucao da publicacao Android code 17'
          git push origin HEAD:main

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restaurar cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validar configuracao da build 17
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'require("./config/android-build.json").versionCode')" = "17"
          test "$(node -p 'require("./config/android-build.json").versionName')" = "1.0.6"
          test -f .github/bridge-code17-public-cert.pem
          test -f .github/ci-signing-bridge-code17.cms.b64
          test -f scripts/auditar-ux-106.cjs
          grep -Fq 'label: "Início"' components/mobile-bottom-nav.tsx
          grep -Fq 'filter((link) => link.href !== "/visitante")' components/site-header.tsx
          ! grep -Fq 'Tentar conectar' android-web/offline.html
          ! grep -Fq 'Santa Luzia Offline' android-web/offline.html
          ! grep -Fq '"CONFIRMADA"' components/formacao-membros.tsx
          grep -Fq '24 * 60 * 60 * 1000' lib/notificacoes.ts
          grep -Fq '@color/santa_luzia_surface' native-assets/android/res/values/styles.xml
          test -n "$CAPACITOR_SERVER_URL"
          echo "$CAPACITOR_SERVER_URL" | grep -q '^https://'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Auditar robustez critica e UX nativa
        run: npm run audit:robustez

      - name: Validar aplicacao web e TypeScript
        run: npm run build

      - name: Criar e sincronizar Android
        shell: bash
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android
          APP_VERSION_CODE="$APP_VERSION_CODE" APP_VERSION_NAME="$APP_VERSION_NAME" node scripts/prepare-android.cjs
          grep -Eq 'applicationId[[:space:]]+"br\.com\.comunidadesantaluzia\.app"' android/app/build.gradle
          grep -Eq "versionCode[[:space:]]+${APP_VERSION_CODE}" android/app/build.gradle
          grep -Eq "versionName[[:space:]]+\"${APP_VERSION_NAME}\"" android/app/build.gradle
          test -f android/app/src/main/assets/public/offline.html
          test -f android/app/src/main/assets/public/index.html
          ! grep -Fq 'Tentar conectar' android/app/src/main/assets/public/offline.html
          ! grep -Fq 'Santa Luzia Offline' android/app/src/main/assets/public/offline.html
          grep -Fq 'bottomTabs=[["inicio"' android/app/src/main/assets/public/offline.html
          grep -Fq '@color/santa_luzia_surface' android/app/src/main/res/values/styles.xml
          test -f android/app/src/main/java/br/com/comunidadesantaluzia/app/MainActivity.java

      - name: Baixar chave privada efemera da ponte
        uses: actions/download-artifact@v4
        with:
          name: bridge-code17-private-key
          path: ${{ runner.temp }}/bridge-code17-private
          github-token: ${{ github.token }}
          run-id: 32198477191

      - name: Recuperar e validar chave original sem expor segredos
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/signing-code17"
          base64 --decode .github/ci-signing-bridge-code17.cms.b64 > "$RUNNER_TEMP/signing-code17/recovery.cms"
          ACTUAL_CMS_SHA="$(sha256sum "$RUNNER_TEMP/signing-code17/recovery.cms" | awk '{print $1}')"
          test "$ACTUAL_CMS_SHA" = "$EXPECTED_CMS_SHA256"
          test -f "$RUNNER_TEMP/bridge-code17-private/private.pem"
          openssl cms -decrypt -binary -inform DER \
            -in "$RUNNER_TEMP/signing-code17/recovery.cms" \
            -recip .github/bridge-code17-public-cert.pem \
            -inkey "$RUNNER_TEMP/bridge-code17-private/private.pem" \
            -out "$RUNNER_TEMP/signing-code17/recovery.zip"
          unzip -q "$RUNNER_TEMP/signing-code17/recovery.zip" -d "$RUNNER_TEMP/signing-code17/recovery"
          JKS="$RUNNER_TEMP/signing-code17/recovery/santa-luzia-release.jks"
          PASS_FILE="$RUNNER_TEMP/signing-code17/recovery/signing-password.txt"
          ALIAS_FILE="$RUNNER_TEMP/signing-code17/recovery/santa-luzia-signing-alias.txt"
          test -s "$JKS" && test -s "$PASS_FILE" && test -s "$ALIAS_FILE"
          PASS="$(tr -d '\r\n' < "$PASS_FILE")"
          ALIAS="$(tr -d '\r\n' < "$ALIAS_FILE")"
          echo "::add-mask::$PASS"
          test "$ALIAS" = "santa-luzia"
          keytool -list -v -keystore "$JKS" -storepass "$PASS" -alias "$ALIAS" > "$RUNNER_TEMP/signing-code17/key-info.txt"
          CERT="$(awk -F'SHA256: ' 'tolower($0) ~ /sha256:/ {print $2; exit}' "$RUNNER_TEMP/signing-code17/key-info.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$CERT" = "$EXPECTED_CERT"
          echo "KEYSTORE_PATH=$JKS" >> "$GITHUB_ENV"
          echo "SIGNING_PASSWORD_FILE=$PASS_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Configurar assinatura original
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(tr -d '\r\n' < "$SIGNING_PASSWORD_FILE")"
          echo "::add-mask::$PASS"
          ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH" \
          ANDROID_KEYSTORE_PASSWORD="$PASS" \
          ANDROID_KEY_ALIAS="$SIGNING_ALIAS" \
          ANDROID_KEY_PASSWORD="$PASS" \
          node scripts/configure-android-signing.cjs

      - name: Gerar APK assinado code 17
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          PASS="$(tr -d '\r\n' < "$SIGNING_PASSWORD_FILE")"
          echo "::add-mask::$PASS"
          for tentativa in 1 2 3; do
            if ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH" \
               ANDROID_KEYSTORE_PASSWORD="$PASS" \
               ANDROID_KEY_ALIAS="$SIGNING_ALIAS" \
               ANDROID_KEY_PASSWORD="$PASS" \
               ./gradlew assembleRelease --no-daemon; then
              exit 0
            fi
            if [ "$tentativa" -lt 3 ]; then sleep $((tentativa * 30)); fi
          done
          exit 1

      - name: Validar APK final, versao e assinatura
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner-code17.txt"
          CERT="$(awk -F': ' 'tolower($0) ~ /certificate sha-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/apksigner-code17.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$CERT" = "$EXPECTED_CERT"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/badging-code17.txt"
          grep -Eq "versionCode='17'.*versionName='1.0.6'" "$RUNNER_TEMP/badging-code17.txt"
          unzip -l "$APK" | grep -Fq 'assets/public/offline.html'
          unzip -p "$APK" assets/public/offline.html | grep -Fq 'bottomTabs=[["inicio"'
          ! unzip -p "$APK" assets/public/offline.html | grep -Fq 'Tentar conectar'
          echo "FINAL_APK=$APK" >> "$GITHUB_ENV"

      - name: Preparar arquivos oficiais
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$FINAL_APK" dist/santa-luzia.apk
          cp "$FINAL_APK" "dist/Santa-Luzia-${APP_VERSION_NAME}.apk"
          (cd dist && sha256sum santa-luzia.apk > santa-luzia.apk.sha256)
          (cd dist && sha256sum "Santa-Luzia-${APP_VERSION_NAME}.apk" > "Santa-Luzia-${APP_VERSION_NAME}.apk.sha256")
          echo "APK_SHA256=$(sha256sum dist/santa-luzia.apk | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c%s dist/santa-luzia.apk)" >> "$GITHUB_ENV"

      - name: Guardar APK assinado como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Santa-Luzia-1.0.6-code17-assinado
          path: |
            dist/santa-luzia.apk
            dist/Santa-Luzia-1.0.6.apk
            dist/santa-luzia.apk.sha256
            dist/Santa-Luzia-1.0.6.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Substituir release oficial 1.0.6 pela build code 17
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-v${APP_VERSION_NAME}"
          NOTES="Santa Luzia ${APP_VERSION_NAME} — build interna ${APP_VERSION_CODE}. Reorganiza a navegacao autenticada com Inicio, Escala, Formacao e Quiz; remove Visitante para contas logadas; melhora a interface local sem mensagens de reconexao; notificacoes expiram em 24 horas; remove o selo Confirmada da formacao; moderniza splash e icone adaptativo; reposiciona a barra de progresso. APK assinada com a mesma chave original e validada pelo certificado historico."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/santa-luzia.apk "dist/Santa-Luzia-${APP_VERSION_NAME}.apk" dist/santa-luzia.apk.sha256 "dist/Santa-Luzia-${APP_VERSION_NAME}.apk.sha256" --clobber
            gh release edit "$TAG" --latest --title "Santa Luzia Android ${APP_VERSION_NAME}" --notes "$NOTES"
          else
            gh release create "$TAG" dist/santa-luzia.apk "dist/Santa-Luzia-${APP_VERSION_NAME}.apk" dist/santa-luzia.apk.sha256 "dist/Santa-Luzia-${APP_VERSION_NAME}.apk.sha256" --target main --latest --title "Santa Luzia Android ${APP_VERSION_NAME}" --notes "$NOTES"
          fi

      - name: Atualizar metadados do atualizador interno
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const crypto = require('crypto')
          const path = 'config/android-release.json'
          const apk = 'dist/santa-luzia.apk'
          const atual = JSON.parse(fs.readFileSync(path, 'utf8'))
          const bytes = fs.readFileSync(apk)
          atual.versionCode = 17
          atual.versionName = '1.0.6'
          atual.publishedAt = '2026-08-18'
          atual.required = false
          atual.apkSize = bytes.length
          atual.apkSha256 = crypto.createHash('sha256').update(bytes).digest('hex')
          atual.highlights = [
            'Barra inferior autenticada reorganizada para Início, Escala, Formação e Quiz, sem aba Visitante',
            'Modo local abre com a mesma identidade do aplicativo, sem Tentar conectar ou tela de erro',
            'Notificações expiram após 24 horas e a central não conflita mais com a navegação inferior',
            'Formação sem selo Confirmada; presença continua liberada somente no dia correto',
            'Splash nativa modernizada e barra de carregamento reposicionada para maior visibilidade',
            'APK 1.0.6 code 17 assinada com a mesma chave Android original'
          ]
          fs.writeFileSync(path, JSON.stringify(atual, null, 2) + '\n')
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add config/android-release.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publica Android 1.0.6 code 17'
            git push origin HEAD:main
          fi

      - name: Limpar material sensivel do runner
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/signing-code17" "$RUNNER_TEMP/bridge-code17-private" || true
