name: Finalizar publicacao Android code 13 e limpar ponte

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-code13-cleanup.yml

permissions:
  contents: write
  actions: write

jobs:
  finalizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirmar release e metadados code 13
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'require("./config/android-release.json").versionCode')" = "13"
          test "$(node -p 'require("./config/android-release.json").versionName')" = "1.0.5"
          test "$(node -p 'require("./config/android-release.json").apkSha256')" = "5037897221d3afc4a91e163476f6e3030dab06e66599f994662ab3db3631a296"
          test "$(node -p 'require("./config/android-release.json").apkSize')" = "6018949"
          gh release view android-v1.0.5 --json name,assets >/tmp/release.json
          grep -Fq 'Santa-Luzia-1.0.5.apk' /tmp/release.json

      - name: Apagar artefatos efemeros da ponte
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for id in 9268397507 9268397685 9268502962 9268503022; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" >/dev/null 2>&1 || true
          done

      - name: Remover materiais temporarios da main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm -f --ignore-unmatch \
            .github/ci-signing-bridge-code13.cms.b64 \
            .github/bridge-code13-public-cert.pem \
            .github/workflows/ephemeral-signing-bridge-code13.yml \
            .github/workflows/publish-android-105-code13-secure.yml \
            .github/workflows/finalize-code13-cleanup.yml
          if git diff --cached --quiet; then
            echo 'Nada temporario para remover.'
          else
            git commit -m 'Finaliza publicacao Android code 13 e remove ponte temporaria'
            git push origin HEAD:main
          fi
