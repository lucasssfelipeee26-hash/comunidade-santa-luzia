name: Validar Android 1.0.1

on:
  push:
    branches: [codex-validate-android-101]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CAPACITOR_SERVER_URL: https://comunidade-santa-luzia-production.up.railway.app
      APP_VERSION_CODE: "2"
      APP_VERSION_NAME: "1.0.1"
      AUTH_SECRET: ci-apenas-para-validacao-nao-usar-em-producao-123456789
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar web e acervo offline
        run: |
          npm run audit:offline
          npm run build
      - name: Preparar Android
        run: |
          npx cap add android
          npx cap sync android
          node scripts/prepare-android.cjs
      - name: Compilar APK release
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Guardar APK para assinatura
        uses: actions/upload-artifact@v4
        with:
          name: santa-luzia-1.0.1-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1
