<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#521123" />
  <title>Caminho da Luz</title>
  <style>
    :root{--vinho:#7b1326;--vinho2:#521123;--ouro:#b98a39;--marfim:#fffaf0;--texto:#392d30;--muted:#76696c}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#fff2cf 0,#fff 36%,#f8f1e8 100%);color:var(--texto);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}
    .app{min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom));max-width:620px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--vinho)}h1{font-family:Georgia,serif;color:var(--vinho);font-size:28px;margin:2px 0 3px}.sub{font-size:13px;color:var(--muted)}.close{width:42px;height:42px;border:1px solid #eadbd5;border-radius:16px;background:#fff;color:var(--vinho);font-size:20px;box-shadow:0 8px 24px #52112312}
    .card{border:1px solid #efe0d8;background:#ffffffdc;border-radius:26px;padding:14px;box-shadow:0 18px 50px #52112314;backdrop-filter:blur(12px)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#fff7ea;border-radius:17px;padding:9px;text-align:center}.stat small{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.stat strong{display:block;color:var(--vinho);font-size:18px;margin-top:2px}.bar{height:8px;background:#f2e7dd;border-radius:999px;overflow:hidden;margin-top:11px}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--vinho),var(--ouro));border-radius:inherit;transition:width .25s}.bartext{display:flex;justify-content:space-between;margin-top:4px;font-size:10px;color:var(--muted)}
    .boardwrap{margin-top:12px}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}.cell{aspect-ratio:1;border:1px solid #f1e6df;border-radius:12px;background:#fff;font-size:clamp(18px,6.2vw,32px);display:grid;place-items:center;box-shadow:0 4px 12px #5211230d;transition:transform .12s,border-color .12s,background .12s}.cell:active{transform:scale(.9)}.cell.sel{transform:scale(1.06);border:2px solid var(--vinho);background:#fff0f2}.cell.empty{opacity:.2}.cell:disabled{cursor:default}
    .msg{margin-top:11px;text-align:center;padding:10px 12px;border-radius:16px;background:#ffffffb8;color:var(--muted);font-size:13px;min-height:39px}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}.pill{border:1px solid #e8dad3;background:#fff;color:var(--vinho);min-height:40px;padding:0 13px;border-radius:14px;font-weight:700}.record{text-align:center;color:var(--muted);font-size:11px;margin-top:11px}
    .overlay{position:fixed;inset:0;background:#271018b8;display:none;place-items:center;padding:18px;z-index:9;backdrop-filter:blur(7px)}.overlay.show{display:grid}.modal{width:min(100%,420px);background:var(--marfim);border-radius:30px;padding:24px;text-align:center;box-shadow:0 30px 90px #0005}.seal{width:64px;height:64px;border-radius:22px;background:var(--vinho);color:#fff;display:grid;place-items:center;font-size:31px;margin:auto}.modal h2{font-family:Georgia,serif;color:var(--vinho);font-size:27px;margin:15px 0 6px}.modal p{color:var(--muted);line-height:1.55}.primary{width:100%;min-height:50px;border:0;border-radius:16px;background:var(--vinho);color:#fff;font-weight:800;margin-top:10px}.secondary{width:100%;min-height:44px;border:1px solid #e2d3ca;border-radius:14px;background:#fff;color:var(--vinho);font-weight:700;margin-top:8px}
    @media(max-width:380px){.board{gap:3px}.cell{border-radius:9px}.card{padding:10px}.stats{gap:5px}}
  </style>
</head>
<body>
  <main class="app">
    <div class="top">
      <div><div class="eyebrow" id="modo">Fase 1 de 5</div><h1>Caminho da Luz</h1><div class="sub">Jogo litúrgico instalado no seu celular</div></div>
      <button class="close" id="fechar" aria-label="Fechar jogo">×</button>
    </div>

    <section class="card">
      <div class="stats">
        <div class="stat"><small>Pontos</small><strong id="pontos">0</strong></div>
        <div class="stat"><small>Movimentos</small><strong id="movimentos">28</strong></div>
        <div class="stat"><small>Combo</small><strong id="combo">x1</strong></div>
      </div>
      <div class="bar"><i id="progresso"></i></div>
      <div class="bartext"><span>Meta da fase</span><span id="metaTexto">0/650</span></div>
    </section>

    <section class="card boardwrap"><div class="board" id="board" aria-label="Tabuleiro do Caminho da Luz"></div></section>
    <div class="msg" id="mensagem">Combine 3 ou mais símbolos litúrgicos.</div>
    <div class="controls">
      <button class="pill" id="reiniciar">↻ Reiniciar</button>
      <button class="pill" id="som">🔊 Som</button>
      <button class="pill" id="vibracao">📳 Vibração</button>
    </div>
    <div class="record" id="recorde">🏆 Recorde local: 0</div>
  </main>

  <div class="overlay" id="fim">
    <div class="modal">
      <div class="seal">✝️</div>
      <h2>Rodada concluída</h2>
      <p id="resultadoFinal"></p>
      <button class="primary" id="enviar">Voltar e sincronizar com o ranking</button>
      <button class="secondary" id="jogarNovamente">Jogar novamente</button>
    </div>
  </div>

<script>
(() => {
  "use strict";
  const SIZE=8, SYMBOLS=["✝️","🕯️","🏆","📖","🌿","🕊️","🔥","⭐"], NAMES=["Cruz","Vela","Cálice","Missal","Naveta","Paz","Turíbulo","Alfaia"];
  const KSTATE="santa-luzia:caminho-da-luz:nativo:estado:v1", KSOUND="santa-luzia:caminho-da-luz:nativo:som", KVIB="santa-luzia:caminho-da-luz:nativo:vibrar", KREC="santa-luzia:caminho-da-luz:nativo:recorde";
  const el=id=>document.getElementById(id); let board=[], selected=null, phaseScore=0,totalScore=0,level=1,moves=28,combo=0,busy=false, sound=localStorage.getItem(KSOUND)!=="0", vibrate=localStorage.getItem(KVIB)!=="0";
  const meta=l=>650+Math.max(0,l-1)*240, movesFor=l=>Math.max(18,28-Math.floor((l-1)/2)), mode=()=>level<=5?`Fase ${level} de 5`:`Jornada infinita · Nível ${level}`;
  const rnd=()=>Math.floor(Math.random()*SYMBOLS.length), adjacent=(a,b)=>Math.abs(Math.floor(a/SIZE)-Math.floor(b/SIZE))+Math.abs(a%SIZE-b%SIZE)===1;

  function matches(b){const out=new Set();for(let r=0;r<SIZE;r++){let s=0;while(s<SIZE){const t=b[r*SIZE+s],v=t&&t.t;let e=s+1;while(v!=null&&e<SIZE&&b[r*SIZE+e]&&b[r*SIZE+e].t===v)e++;if(v!=null&&e-s>=3)for(let c=s;c<e;c++)out.add(r*SIZE+c);s=e}}for(let c=0;c<SIZE;c++){let s=0;while(s<SIZE){const t=b[s*SIZE+c],v=t&&t.t;let e=s+1;while(v!=null&&e<SIZE&&b[e*SIZE+c]&&b[e*SIZE+c].t===v)e++;if(v!=null&&e-s>=3)for(let r=s;r<e;r++)out.add(r*SIZE+c);s=e}}return [...out]}
  function fresh(){let b=[];for(let tries=0;tries<50;tries++){b=Array.from({length:SIZE*SIZE},()=>({t:rnd(),id:Math.random().toString(36).slice(2)}));if(!matches(b).length)break}return b}
  function drop(b){const n=[...b];for(let c=0;c<SIZE;c++){const col=[];for(let r=SIZE-1;r>=0;r--){const p=n[r*SIZE+c];if(p)col.push(p)}for(let r=SIZE-1;r>=0;r--)n[r*SIZE+c]=col[SIZE-1-r]||{t:rnd(),id:Math.random().toString(36).slice(2)}}return n}
  const delay=ms=>new Promise(r=>setTimeout(r,ms));
  function buzz(ms=25){if(vibrate&&navigator.vibrate)navigator.vibrate(ms)}
  function beep(kind){if(!sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);const f=kind==="err"?150:kind==="phase"?720:kind==="combo"?560:420;o.frequency.value=f;o.frequency.exponentialRampToValueAtTime(kind==="err"?110:f*1.35,c.currentTime+.11);g.gain.value=.07;g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.14);o.start();o.stop(c.currentTime+.15);setTimeout(()=>c.close(),220)}catch{}}
  function save(){try{localStorage.setItem(KSTATE,JSON.stringify({board,phaseScore,totalScore,level,moves}))}catch{}}
  function load(){try{const s=JSON.parse(localStorage.getItem(KSTATE)||"null");if(s&&Array.isArray(s.board)&&s.board.length===64){board=s.board;phaseScore=Number(s.phaseScore)||0;totalScore=Number(s.totalScore)||0;level=Math.max(1,Number(s.level)||1);moves=Math.max(0,Number(s.moves)||movesFor(level));return}}catch{} board=fresh();moves=movesFor(level)}
  function render(){el("modo").textContent=mode();el("pontos").textContent=totalScore;el("movimentos").textContent=moves;el("combo").textContent=`x${Math.max(1,combo+1)}`;el("metaTexto").textContent=`${phaseScore}/${meta(level)}`;el("progresso").style.width=`${Math.min(100,Math.round(phaseScore/meta(level)*100))}%`;el("som").textContent=sound?"🔊 Som":"🔇 Sem som";el("vibracao").textContent=vibrate?"📳 Vibração":"📴 Vibração off";el("recorde").textContent=`🏆 Recorde local: ${Number(localStorage.getItem(KREC)||0)}`;const root=el("board");root.innerHTML="";board.forEach((p,i)=>{const b=document.createElement("button");b.className="cell"+(selected===i?" sel":"")+(!p?" empty":"");b.disabled=busy||moves<=0||!p;b.textContent=p?SYMBOLS[p.t]:"";b.setAttribute("aria-label",p?`${NAMES[p.t]}, posição ${i+1}`:"Espaço vazio");b.onclick=()=>choose(i);root.appendChild(b)});save()}
  function message(t){el("mensagem").textContent=t}
  async function resolveCascade(b){let cur=b,round=0,totalGain=0;while(true){const m=matches(cur);if(!m.length)break;round++;const gain=m.length*20*round;totalGain+=gain;const removed=[...cur];m.forEach(i=>removed[i]=null);board=removed;render();await delay(105);cur=drop(removed);board=cur;render();await delay(125)}combo=Math.max(0,round-1);phaseScore+=totalGain;totalScore+=totalGain;beep(round>1?"combo":"match");buzz(round>1?55:25);return round}
  async function choose(i){if(busy||moves<=0)return;if(selected==null){selected=i;buzz(10);render();return}if(selected===i){selected=null;render();return}if(!adjacent(selected,i)){selected=i;render();return}busy=true;const a=selected;selected=null;const old=[...board];[board[a],board[i]]=[board[i],board[a]];render();if(!matches(board).length){beep("err");buzz(65);await delay(120);board=old;busy=false;message("Essa troca não forma uma combinação.");render();return}moves--;const casc=await resolveCascade(board);message(casc>1?`Combo x${casc}! Continue assim.`:"Boa combinação!");if(phaseScore>=meta(level)){beep("phase");buzz(100);const done=level;level++;message(done<5?`Fase ${done} concluída!`:done===5?"As cinco fases foram concluídas. A Jornada Infinita começou!":`Nível ${done} concluído!`);await delay(600);phaseScore=0;moves=movesFor(level);combo=0;board=fresh()}else if(moves<=0){finishRound();busy=false;render();return}busy=false;render()}
  function reset(){selected=null;phaseScore=0;totalScore=0;level=1;moves=movesFor(1);combo=0;busy=false;board=fresh();localStorage.removeItem(KSTATE);el("fim").classList.remove("show");message("Nova jornada iniciada.");render()}
  function finishRound(){const rec=Number(localStorage.getItem(KREC)||0);if(totalScore>rec)localStorage.setItem(KREC,String(totalScore));localStorage.removeItem(KSTATE);el("resultadoFinal").textContent=`Você chegou ao nível ${level} com ${totalScore} ponto(s). O aplicativo vai usar esse resultado para atualizar o seu melhor bônus diário.`;el("fim").classList.add("show")}
  function send(){const m=mode();if(window.SantaLuziaGame&&typeof window.SantaLuziaGame.finish==="function"){window.SantaLuziaGame.finish(Math.max(0,Math.trunc(totalScore)),Math.max(1,Math.trunc(level)),m)}else{message("Este jogo foi aberto fora do aplicativo.")}}
  el("reiniciar").onclick=reset;el("som").onclick=()=>{sound=!sound;localStorage.setItem(KSOUND,sound?"1":"0");render()};el("vibracao").onclick=()=>{vibrate=!vibrate;localStorage.setItem(KVIB,vibrate?"1":"0");render()};el("fechar").onclick=()=>window.SantaLuziaGame&&window.SantaLuziaGame.close?window.SantaLuziaGame.close():history.back();el("enviar").onclick=send;el("jogarNovamente").onclick=reset;
  load();render();
})();
</script>
</body>
</html>
