<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#7b1326" />
    <title>Santa Luzia</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#fff8e8,#fff,#faf7f1);padding:24px;color:#342a2c;font-family:system-ui,-apple-system,sans-serif}.card{width:min(100%,420px);border:1px solid #eadfd6;border-radius:28px;background:#ffffffeb;padding:30px;text-align:center;box-shadow:0 24px 70px #52191918}.icon{width:64px;height:64px;margin:auto;display:grid;place-items:center;border-radius:22px;background:#7b1326;color:white;font-size:30px}h1{margin:18px 0 8px;color:#7b1326;font-family:Georgia,serif}p{line-height:1.6;color:#716468}button{margin-top:16px;min-height:46px;border:0;border-radius:14px;background:#7b1326;color:white;padding:0 20px;font-weight:700}
    </style>
  </head>
  <body>
    <main class="card"><div class="icon">✦</div><h1>Santa Luzia</h1><p>Conecte o aparelho à internet na primeira abertura para concluir a preparação do aplicativo. Depois, a Liturgia e os conteúdos já sincronizados ficam disponíveis sem conexão.</p><button type="button" onclick="location.reload()">Tentar novamente</button></main>
  </body>
</html>
