<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#fffaf0" />
<title>Santa Luzia</title>
<style>
:root{--p:#7b1326;--deep:#521123;--gold:#d4af37;--gold2:#f2cf62;--ivory:#fffaf0;--surface:#fffdf8;--text:#3f171c;--muted:#765e5d;--line:#e2d1c2;--ok:#18704a;--warn:#806017}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--ivory);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{touch-action:manipulation}.app{max-width:840px;margin:auto;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 92px)}.top{display:flex;align-items:center;gap:11px;border-bottom:1px solid #d4af3766;background:#fffdf8;padding:10px 4px 14px}.seal{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--gold);background:#fff;color:var(--p);font-family:Georgia,serif;font-weight:800;box-shadow:0 5px 16px #52112318}.brand strong{display:block;font-family:Georgia,serif;color:var(--p);font-size:22px;letter-spacing:.06em}.brand small{display:block;margin-top:1px;color:#5e3a3f;font-size:8px;font-weight:850;letter-spacing:.09em;text-transform:uppercase}.nav{display:flex;gap:7px;overflow:auto;padding:12px 2px 8px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap;min-height:38px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--p);padding:7px 11px;font-size:10px;font-weight:850}.nav button.on{border-color:var(--p);background:var(--p);color:#fff}.page{display:none}.page.on{display:block}.hero{margin:7px 0 12px;border-radius:25px;padding:18px;background:linear-gradient(135deg,#5a0b18,#861b35);color:#fff;box-shadow:0 14px 38px #5211231f}.hero small{font-size:9px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:var(--gold2)}.hero h2{font-family:Georgia,serif;font-size:28px;margin:5px 0 3px}.hero p{margin:0;color:#fff9ebdf;font-size:12px;line-height:1.55}.grid{display:grid;gap:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card,.row{border:1px solid #e4d5c8;border-radius:21px;background:#fff;padding:14px;box-shadow:0 6px 22px #5211230b}.card h3{font-family:Georgia,serif;color:var(--p);font-size:20px;margin:0 0 8px}.row{margin-bottom:9px}.rowhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.muted{color:var(--muted);font-size:12px;line-height:1.55}.value{font-size:24px;font-weight:850;color:var(--p)}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;background:#7b132610;color:var(--p);font-size:10px;font-weight:850}.pill.cancel{background:#a61f3112;color:#a61f31}.empty{border:1px dashed #d8c9bd;border-radius:18px;padding:18px;text-align:center;color:var(--muted);font-size:12px;background:#ffffffa8}.profile{display:flex;gap:12px;align-items:center}.avatar{width:58px;height:58px;border-radius:20px;background:#7b132611;overflow:hidden;display:grid;place-items:center;color:var(--p);font-weight:900;font-size:17px;border:2px solid #d4af3760;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.bio{margin-top:10px;border-radius:14px;background:#f8f2eb;padding:10px;font-size:12px;line-height:1.5;color:var(--muted)}.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}.quick button{min-height:78px;border:1px solid #e1d2c4;border-radius:19px;background:#fff9ef;color:var(--p);font-weight:850}.quick b{display:block;font-size:22px;margin-bottom:4px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.action{min-height:42px;border:1px solid #d7c7bb;border-radius:13px;background:#fff;padding:9px 12px;color:var(--p);font-size:11px;font-weight:850}.action.primary{border-color:var(--p);background:var(--p);color:#fff}.action.good{border-color:#9dceb3;background:#edf9f2;color:#176743}.action.warn{border-color:#e4c873;background:#fff8dd;color:#72510a}.notice{border-radius:15px;padding:10px 11px;font-size:11px;line-height:1.5}.notice.ok{border:1px solid #a5d2b8;background:#effaf3;color:#155e3e}.notice.lock{border:1px solid #e4c873;background:#fff8dd;color:#6f5517}.rank{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:8px;border-bottom:1px solid #eee4dc;padding:9px 1px}.rank:last-child{border:0}.pos{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:#7b132610;color:var(--p);font-weight:900}.points{font-weight:900;color:#9b7424}.lit h4{font-family:Georgia,serif;color:var(--p);font-size:19px;margin:16px 0 5px}.lit p{white-space:pre-line;font-size:14px;line-height:1.7;margin:4px 0}.lit .ref{display:inline-block;margin:2px 0 4px;border-radius:9px;background:#fff6dd;padding:4px 7px;color:#8b6719;font-weight:850;font-size:12px}label{display:grid;gap:5px;color:#51484a;font-size:11px;font-weight:850}input,select,textarea{width:100%;border:1px solid #d8cdc5;border-radius:13px;background:#fff;padding:10px;color:var(--text);font-size:16px;outline:none}textarea{min-height:72px;resize:vertical}.option{display:block;width:100%;margin-top:6px;text-align:left;min-height:44px;border:1px solid #ddd1c8;border-radius:13px;background:#fff;padding:10px;color:var(--text);font-size:12px}.option.sel{border-color:var(--p);background:#7b13260b;color:var(--p);font-weight:850}.bottom{position:fixed;z-index:40;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 18px),822px);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border:1px solid #ffffffd8;background:#fffffff2;backdrop-filter:blur(18px);padding:6px;border-radius:22px;box-shadow:0 12px 45px #27101825}.bottom button{border:0;background:transparent;border-radius:15px;padding:7px 2px;color:#76686b;font-size:9px;font-weight:850}.bottom button.on{background:#7b132611;color:var(--p)}.bottom b{display:block;font-size:18px;margin-bottom:2px}.progress{position:fixed;z-index:100;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));height:4px;border-radius:99px;background:#7b132610;overflow:hidden;opacity:0;transition:opacity .18s}.progress.on{opacity:1}.progress i{display:block;height:100%;width:38%;border-radius:99px;background:linear-gradient(90deg,#521123,#7b1326,#d4af37,#f2cf62,#7b1326);animation:slide .8s ease-in-out infinite}@keyframes slide{from{transform:translateX(-120%)}to{transform:translateX(300%)}}@media(max-width:520px){.two{grid-template-columns:1fr}.hero h2{font-size:25px}.card,.row{padding:13px}.app{padding-left:8px;padding-right:8px}}
</style>
</head>
<body>
<div class="progress" id="progress"><i></i></div>
<main class="app">
<header class="top"><div class="seal">SL</div><div class="brand"><strong>SANTA LUZIA</strong><small>Acólitos e Coroinhas São Padre Pio</small></div></header>
<nav class="nav" id="nav"></nav>
<section class="page" id="inicio"></section>
<section class="page" id="liturgia"></section>
<section class="page" id="escala"></section>
<section class="page" id="formacao"></section>
<section class="page" id="quiz"></section>
<section class="page" id="equipe"></section>
<section class="page" id="biblioteca"></section>
<section class="page" id="atrasos"></section>
</main>
<nav class="bottom" id="bottom"></nav>
<script>
(()=>{"use strict";
const SERVER="https://comunidade-santa-luzia-production.up.railway.app",FALLBACK_SNAPSHOT="santa-luzia:android-offline:snapshot:v1",FALLBACK_QUEUE="santa-luzia:android-offline:queue:v1";
const topTabs=[["liturgia","✝","Liturgia"],["equipe","👥","Equipe"],["biblioteca","▤","Biblioteca"],["atrasos","⏰","Atrasos"]];
const bottomTabs=[["inicio","⌂","Início"],["escala","▣","Escala"],["formacao","◇","Formação"],["quiz","✦","Quiz"]];
let active="inicio",snapshot=null,queueCache=[],liturgiaAtual=null,quizRespostas={};
const nativeStore=()=>window.Capacitor?.Plugins?.OfflineStore||null;
function readJson(k,f){try{const v=JSON.parse(localStorage.getItem(k)||"null");return v==null?f:v}catch{return f}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function isoHoje(){const p=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Cuiaba",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const m=Object.fromEntries(p.map(x=>[x.type,x.value]));return `${m.year}-${m.month}-${m.day}`}
function fmt(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(v||"")))return esc(v||"");const[y,m,d]=String(v).split("-");return `${d}/${m}/${y}`}
function rid(){return crypto?.randomUUID?crypto.randomUUID():`local-${Date.now()}-${Math.random().toString(36).slice(2)}`}
function initials(n){return String(n||"SL").split(" ").filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase()}
function session(){return snapshot?.auth?.sessao||null}function user(){return session()?.usuario||snapshot?.ranking?.eu||null}function profile(){return snapshot?.perfil||user()||null}function perfis(){return Array.isArray(snapshot?.perfis)?snapshot.perfis:[]}function formations(){return Array.isArray(snapshot?.formacoes?.formacoes)?snapshot.formacoes.formacoes:[]}function rankings(){return Array.isArray(snapshot?.ranking?.ranking)?snapshot.ranking.ranking:[]}function members(){return Array.isArray(snapshot?.ranking?.membros)?snapshot.ranking.membros:[]}function occurrences(){return Array.isArray(snapshot?.ranking?.ocorrencias)?snapshot.ranking.ocorrencias:[]}function scales(){return Array.isArray(snapshot?.escalas?.escalas)?snapshot.escalas.escalas:[]}function books(){return Array.isArray(snapshot?.biblioteca?.livros)?snapshot.biblioteca.livros:[]}
async function loadNative(){const p=nativeStore();if(p){try{const[s,q]=await Promise.all([p.loadSnapshot(),p.loadQueue()]);snapshot=s?.snapshot?JSON.parse(s.snapshot):null;queueCache=q?.queue?JSON.parse(q.queue):[];if(!Array.isArray(queueCache))queueCache=[];return}catch{}}snapshot=readJson(FALLBACK_SNAPSHOT,null);queueCache=readJson(FALLBACK_QUEUE,[]);if(!Array.isArray(queueCache))queueCache=[]}
async function saveQueue(){const p=nativeStore();if(p){try{await p.saveQueue({queue:JSON.stringify(queueCache)});return}catch{}}try{localStorage.setItem(FALLBACK_QUEUE,JSON.stringify(queueCache))}catch{}}
async function enqueue(item){queueCache.push(item);await saveQueue();renderAll()}
function progress(){const el=document.getElementById("progress");el.classList.add("on");setTimeout(()=>el.classList.remove("on"),480)}
function navs(){document.getElementById("nav").innerHTML=topTabs.map(([k,i,n])=>`<button data-tab="${k}">${i} ${n}</button>`).join("");document.getElementById("bottom").innerHTML=bottomTabs.map(([k,i,n])=>`<button data-tab="${k}"><b>${i}</b>${n}</button>`).join("");document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>setActive(b.dataset.tab))}
function setActive(k){progress();active=k;document.querySelectorAll(".page").forEach(x=>x.classList.toggle("on",x.id===k));document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x.dataset.tab===k));window.scrollTo({top:0,behavior:"instant"});if((k==="liturgia"||k==="quiz")&&!liturgiaAtual)void loadLiturgia()}
function avatar(p){return p?.foto?`<div class="avatar"><img src="${esc(p.foto)}" alt="" /></div>`:`<div class="avatar">${esc(initials(p?.nome))}</div>`}
function nextScale(){const my=String(user()?.id||"");return scales().filter(s=>String(s.data||"")>=isoHoje()&&Array.isArray(s.pessoas)&&s.pessoas.some(x=>String(x.id||x.usuario_id||"")===my)).sort((a,b)=>`${a.data}${a.horario}`.localeCompare(`${b.data}${b.horario}`))[0]}
function renderInicio(){const p=profile(),next=nextScale();document.getElementById("inicio").innerHTML=`<div class="hero"><small>Painel da Comunidade</small><h2>${esc(p?.nome||"Santa Luzia")}</h2><p>${esc(p?.funcao||session()?.tipo||"Acólitos e Coroinhas São Padre Pio")}</p></div><div class="grid two"><div class="card"><div class="profile">${avatar(p)}<div><h3 style="margin:0">Meu perfil</h3><span class="pill">${esc(p?.funcao||"Comunidade")}</span></div></div><div class="bio">${esc(p?.bio||"Servir com fé, reverência e alegria.")}</div></div><div class="card"><h3>Próxima escala</h3>${next?`<strong>${fmt(next.data)} · ${esc(next.horario||"")}</strong><p class="muted">${esc(next.titulo||"Celebração")}</p>`:`<p class="muted">Nenhuma próxima escala salva neste aparelho.</p>`}</div></div><div class="quick"><button data-go="liturgia"><b>✝</b>Liturgia</button><button data-go="escala"><b>▣</b>Escala</button><button data-go="formacao"><b>◇</b>Formação</button><button data-go="quiz"><b>✦</b>Quiz</button></div>${snapshot?"":`<div class="card" style="margin-top:10px"><h3>Santa Luzia</h3><p class="muted">Os conteúdos locais do aplicativo estão disponíveis. Seus dados pessoais aparecerão aqui assim que este aparelho tiver uma sessão sincronizada.</p></div>`}`;document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>setActive(b.dataset.go))}
function renderEscala(){const ss=scales();document.getElementById("escala").innerHTML=`<div class="hero"><small>Escalas da Comunidade</small><h2>Escala</h2><p>Programação salva no aparelho.</p></div><div>${ss.length?ss.slice().sort((a,b)=>String(a.data).localeCompare(String(b.data))).map(s=>`<div class="row"><div class="rowhead"><div><strong>${fmt(s.data)} · ${esc(s.horario||"")}</strong><div class="muted">${esc(s.titulo||"Celebração")}</div></div></div>${Array.isArray(s.pessoas)&&s.pessoas.length?`<p class="muted">${s.pessoas.map(p=>`${esc(p.nome||"Membro")}${p.funcao?` — ${esc(p.funcao)}`:""}`).join("<br>")}</p>`:""}</div>`).join(""):`<div class="empty">Nenhuma escala salva neste aparelho.</div>`}</div>`}
function renderFormacao(){const hoje=isoHoje(),fs=[...formations()].sort((a,b)=>String(a.data).localeCompare(String(b.data))),proxima=fs.find(f=>String(f.data)>=hoje),historico=fs.filter(f=>String(f.data)<hoje).reverse(),me=String(user()?.id||"");const card=f=>{const pend=queueCache.slice().reverse().find(x=>x.tipo==="formacao-presenca"&&x.formacaoId===f.id),ehHoje=String(f.data)===hoje,cancel=String(f.status)==="cancelada";return `<div class="row"><div class="rowhead"><div><strong>${esc(f.titulo)}</strong><div class="muted">${fmt(f.data)} ${f.horario?`· ${esc(f.horario)}`:""}<br>Tema: ${esc(f.tema||"")}</div></div>${cancel?`<span class="pill cancel">CANCELADA</span>`:""}</div>${f.descricao?`<p class="muted">${esc(f.descricao)}</p>`:""}${!cancel&&ehHoje?`<div class="actions"><button class="action good" data-pres="${esc(f.id)}" data-s="presente">Presente</button><button class="action warn" data-pres="${esc(f.id)}" data-s="falta">Falta</button><button class="action" data-pres="${esc(f.id)}" data-s="justificada">Justificar</button></div>`:!cancel&&String(f.data)>hoje?`<div class="notice lock" style="margin-top:10px">🔒 A presença será liberada somente no dia da formação.</div>`:""}${pend?`<div class="notice ok" style="margin-top:8px">Marcação salva neste aparelho.</div>`:""}</div>`};document.getElementById("formacao").innerHTML=`<div class="hero"><small>Formação</small><h2>Próxima formação</h2><p>Conteúdos e encontros da equipe.</p></div>${proxima?card(proxima):`<div class="empty">Nenhuma próxima formação publicada.</div>`}<div class="card" style="margin-top:12px"><h3>Histórico de formações</h3>${historico.length?historico.map(card).join(""):`<p class="muted">As formações realizadas aparecerão aqui.</p>`}</div>`;document.querySelectorAll("[data-pres]").forEach(b=>b.onclick=async()=>{if(!me)return;let justificativa="";if(b.dataset.s==="justificada"){justificativa=prompt("Informe a justificativa:","")||"";if(justificativa.trim().length<3)return}const clientRequestId=rid();await enqueue({id:clientRequestId,tipo:"formacao-presenca",criadoEm:Date.now(),formacaoId:b.dataset.pres,payload:{situacao:b.dataset.s,justificativa,clientRequestId}})})}
function renderEquipe(){const ps=perfis();document.getElementById("equipe").innerHTML=`<div class="hero"><small>Comunidade Santa Luzia</small><h2>Equipe</h2><p>Perfis públicos já sincronizados.</p></div><div>${ps.length?ps.map(p=>`<div class="row"><div class="profile">${avatar(p)}<div><strong>${esc(p.nome)}</strong><div class="muted">${esc(p.funcao||"")}</div>${p.ranking?`<span class="pill">${esc(p.ranking.posicao)}º · ${esc(p.ranking.pontos)} pts</span>`:""}</div></div><div class="bio">${esc(p.bio||"Este membro ainda não adicionou um recado.")}</div></div>`).join(""):`<div class="empty">Nenhum perfil salvo neste aparelho.</div>`}</div>`}
function renderBiblioteca(filter=""){const q=filter.trim().toLocaleLowerCase("pt-BR"),bs=books().filter(b=>!q||`${b.titulo} ${b.autor} ${b.categoria} ${b.santo||""}`.toLocaleLowerCase("pt-BR").includes(q));document.getElementById("biblioteca").innerHTML=`<div class="hero"><small>Biblioteca Católica</small><h2>Biblioteca</h2><p>Catálogo disponibilizado pela comunidade.</p></div><div class="card"><label>Pesquisar<input id="bookSearch" value="${esc(filter)}" placeholder="Livro, autor, santo ou tema" /></label></div><div style="margin-top:10px">${bs.length?bs.map(b=>`<div class="row"><strong>${esc(b.titulo)}</strong><div class="muted">${esc(b.autor||"")} · ${esc(b.categoria||"")}</div><p class="muted">${esc(b.descricao||"")}</p></div>`).join(""):`<div class="empty">Nenhuma obra encontrada.</div>`}</div>`;const s=document.getElementById("bookSearch");if(s)s.oninput=()=>renderBiblioteca(s.value)}
function renderAtrasos(){const u=user(),cs=members().filter(m=>String(m.id)!==String(u?.id)),mine=occurrences().filter(o=>String(o.usuario_id)===String(u?.id)||String(o.reportado_por)===String(u?.id));document.getElementById("atrasos").innerHTML=`<div class="hero"><small>Pontualidade</small><h2>Atrasos</h2><p>Relatos aguardam confirmação do moderador.</p></div>${cs.length?`<div class="card"><form id="delayForm"><label>Colega<select id="delayUser">${cs.map(m=>`<option value="${esc(m.id)}">${esc(m.nome)} · ${esc(m.funcao||"")}</option>`).join("")}</select></label><div class="grid two" style="margin-top:8px"><label>Data<input id="delayDate" type="date" value="${isoHoje()}" /></label><label>Horário<input id="delayTime" type="time" value="18:00" /></label></div><label style="margin-top:8px">Observação<textarea id="delayNote" maxlength="300"></textarea></label><button class="action primary" style="margin-top:9px" type="submit">Salvar relato</button></form></div>`:`<div class="empty">Lista da equipe ainda não disponível.</div>`}<div class="card" style="margin-top:10px"><h3>Meus relatos</h3>${mine.length?mine.map(o=>`<div class="row"><strong>${esc(o.usuario_nome||"Membro")}</strong><div class="muted">${fmt(o.data_missa)} · ${esc(o.horario_missa||"")} · ${esc(o.status||"pendente")}</div></div>`).join(""):`<p class="muted">Nenhum relato salvo.</p>`}</div>`;const f=document.getElementById("delayForm");if(f)f.onsubmit=async e=>{e.preventDefault();const clientRequestId=rid();await enqueue({id:clientRequestId,tipo:"atraso",criadoEm:Date.now(),payload:{action:"reportar_atraso",usuarioId:document.getElementById("delayUser").value,dataMissa:document.getElementById("delayDate").value,horarioMissa:document.getElementById("delayTime").value,observacao:document.getElementById("delayNote").value,clientRequestId}});renderAtrasos()}}
function quizFromLiturgia(l){if(!l)return[];const p=l.leituras?.primeiraLeitura?.[0],s=l.leituras?.salmo?.[0],s2=l.leituras?.segundaLeitura?.[0],e=l.leituras?.evangelho?.[0],refs=[p?.referencia,s?.referencia,s2?.referencia,e?.referencia].filter(Boolean),out=[];function opts(correct,others,rot){if(!correct)return null;const base=[correct,...others.filter(x=>x&&x!==correct)].slice(0,3);while(base.length<3)base.push(base.length===1?"Não consta na Liturgia de hoje":"Outra referência");const n=rot%3,it=[...base.slice(n),...base.slice(0,n)];return{opcoes:it,correta:it.indexOf(correct)}}function add(id,q,c,others,rot,pts){const o=opts(c,others,rot);if(o)out.push({id,enunciado:q,...o,pontos:pts})}add("lit-1","Qual é a referência da Primeira Leitura da Liturgia de hoje?",p?.referencia,refs.filter(x=>x!==p?.referencia),1,10);add("lit-2","Qual é a referência do Salmo Responsorial de hoje?",s?.referencia,refs.filter(x=>x!==s?.referencia),2,10);add("lit-3","Qual é o refrão do Salmo Responsorial apresentado hoje?",s?.refrao,["O Senhor é meu pastor e nada me faltará.","Provai e vede como o Senhor é bom."],1,15);add("lit-4","Qual é a referência do Evangelho proclamado hoje?",e?.referencia,refs.filter(x=>x!==e?.referencia),0,15);add("lit-5","Em qual período litúrgico está inserida a celebração de hoje?",l.tempoLiturgicoAtual,["Tempo do Advento","Tempo Pascal"],2,10);return out}
function renderQuiz(){const qs=quizFromLiturgia(liturgiaAtual),done=queueCache.some(x=>x.tipo==="quiz-liturgia"&&x.payload?.dataIso===isoHoje()),rs=rankings();document.getElementById("quiz").innerHTML=`<div class="hero"><small>Jornada Litúrgica</small><h2>Quiz</h2><p>Responda a Liturgia de hoje e acompanhe sua classificação.</p></div><div class="card"><h3>Quiz da Liturgia</h3>${done?`<div class="notice ok">Quiz salvo neste aparelho e aguardando sincronização.</div>`:qs.length>=3?`${qs.map((q,i)=>`<div style="margin-top:10px"><strong>${i+1}. ${esc(q.enunciado)}</strong>${q.opcoes.map((o,j)=>`<button class="option ${quizRespostas[i]===j?"sel":""}" data-q="${i}" data-o="${j}">${esc(o)}</button>`).join("")}</div>`).join("")}<button id="sendQuiz" class="action primary" style="margin-top:12px;width:100%">Salvar respostas</button>`:`<p class="muted">Preparando as perguntas da Liturgia de hoje.</p>`}</div><div class="card" style="margin-top:10px"><h3>Classificação</h3>${rs.length?rs.slice(0,20).map(r=>`<div class="rank"><div class="pos">${esc(r.posicao||"—")}</div><div><strong>${esc(r.nome)}</strong><div class="muted">${esc(r.funcao||"")}</div></div><div class="points">${esc(r.pontos||0)} pts</div></div>`).join(""):`<p class="muted">A classificação aparecerá após a primeira sincronização.</p>`}</div>`;document.querySelectorAll('#quiz [data-q]').forEach(b=>b.onclick=()=>{quizRespostas[Number(b.dataset.q)]=Number(b.dataset.o);renderQuiz()});const send=document.getElementById("sendQuiz");if(send)send.onclick=async()=>{const answers=qs.map((_,i)=>quizRespostas[i]);if(answers.some(x=>!Number.isInteger(x)))return;const clientRequestId=rid();await enqueue({id:clientRequestId,tipo:"quiz-liturgia",criadoEm:Date.now(),payload:{dataIso:isoHoje(),respostas:answers,clientRequestId}});quizRespostas={};renderQuiz()}}
async function loadLiturgia(){const iso=isoHoje(),month=iso.slice(0,7);try{const r=await fetch(`offline/liturgia-completa/${month}.json`);const pack=await r.json();liturgiaAtual=pack?.dias?.[iso]||null}catch{liturgiaAtual=null}renderLiturgia();renderQuiz()}
function renderLiturgia(){const root=document.getElementById("liturgia"),l=liturgiaAtual;if(!l){root.innerHTML=`<div class="hero"><small>Liturgia Diária</small><h2>Palavra de Deus</h2></div><div class="empty">O conteúdo desta data não está no pacote local.</div>`;return}const read=(title,a)=>Array.isArray(a)&&a.length?a.map(x=>`<h4>${esc(title)}</h4><div class="ref">${esc(x.referencia||x.titulo||"")}</div>${x.refrao?`<p><strong>${esc(x.refrao)}</strong></p>`:""}<p>${esc(x.texto||"")}</p>`).join(""):"";root.innerHTML=`<div class="hero"><small>${esc(l.cor||"Liturgia")}</small><h2>${esc(l.liturgia||"Liturgia Diária")}</h2><p>${fmt(isoHoje())} · ${esc(l.tempoLiturgicoAtual||"")}</p></div><div class="card lit">${read("Primeira Leitura",l.leituras?.primeiraLeitura)}${read("Salmo Responsorial",l.leituras?.salmo)}${read("Segunda Leitura",l.leituras?.segundaLeitura)}${read("Evangelho",l.leituras?.evangelho)}${l.oracoes?.coleta?`<h4>Oração da Coleta</h4><p>${esc(l.oracoes.coleta)}</p>`:""}</div>`}
function renderAll(){renderInicio();renderEscala();renderFormacao();renderEquipe();renderBiblioteca();renderAtrasos();renderQuiz();setActive(active)}
window.addEventListener("online",()=>{setTimeout(()=>{location.href=SERVER},300)});navs();loadNative().then(()=>{renderAll();setActive("inicio");void loadLiturgia()});
})();
</script>
