<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#7b1326" />
<title>Santa Luzia · Offline</title>
<style>
:root{--p:#7b1326;--p2:#521123;--gold:#b88724;--green:#0b4b35;--ivory:#fffaf0;--text:#342a2c;--muted:#74686a;--line:#e8ddd5;--ok:#146c43;--warn:#805707}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}::selection{background:#e8d07a;color:#4a0c18}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#fff2d1 0,#fffaf0 260px,#f6f1eb 100%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{touch-action:manipulation}input,select,textarea{font-size:16px;color:var(--text);caret-color:var(--p)}input::selection,textarea::selection{background:#d4af37;color:#351018}.app{max-width:840px;margin:auto;padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 92px)}.top{border:1px solid #ffffffc7;background:#ffffffd9;border-radius:28px;padding:16px;box-shadow:0 22px 60px #52112318;backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:12px}.seal{width:50px;height:50px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,var(--p),var(--p2));color:#fff;font-size:23px;box-shadow:0 9px 24px #52112335}.brand small{display:block;color:var(--gold);font-size:9px;font-weight:900;letter-spacing:.17em;text-transform:uppercase}.brand h1{font-family:Georgia,serif;color:var(--p);font-size:25px;margin:2px 0 0}.status{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:16px;background:#fff6db;border:1px solid #ead291;padding:10px 11px;font-size:12px;color:#6d5016}.status strong{color:#523704}.retry{min-height:38px;border:0;border-radius:13px;background:var(--p);color:#fff;padding:8px 12px;font-size:11px;font-weight:850}.nav{display:flex;gap:7px;overflow:auto;padding:12px 2px 8px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap;min-height:40px;border:1px solid var(--line);border-radius:999px;background:#fffffff0;color:var(--p);padding:8px 12px;font-size:11px;font-weight:850}.nav button.on{border-color:var(--p);background:var(--p);color:#fff;box-shadow:0 7px 18px #52112325}.page{display:none}.page.on{display:block}.hero{margin:8px 0 12px;border-radius:26px;padding:18px;background:linear-gradient(135deg,#641125,#8a1938);color:#fff;box-shadow:0 18px 48px #52112320}.hero small{font-size:9px;font-weight:900;letter-spacing:.17em;text-transform:uppercase;color:#f4d77e}.hero h2{font-family:Georgia,serif;font-size:28px;margin:5px 0 4px}.hero p{margin:0;color:#fffbe8dd;font-size:13px;line-height:1.55}.grid{display:grid;gap:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{border:1px solid #ffffffc9;border-radius:22px;background:#fffffff0;padding:15px;box-shadow:0 9px 28px #5211230c;backdrop-filter:blur(14px)}.card h3{font-family:Georgia,serif;color:var(--p);font-size:20px;margin:0 0 8px}.card h4{margin:0 0 5px;color:var(--green)}.muted{color:var(--muted);font-size:12px;line-height:1.55}.value{font-size:25px;font-weight:850;color:var(--p)}.pill{display:inline-flex;border-radius:999px;padding:4px 8px;background:#7b132610;color:var(--p);font-size:10px;font-weight:850}.empty{border:1px dashed #d7cbc2;border-radius:18px;padding:20px;text-align:center;color:var(--muted);font-size:13px;background:#ffffff99}.list{display:grid;gap:9px}.row{border:1px solid var(--line);border-radius:18px;background:#fff;padding:13px}.rowhead{display:flex;align-items:flex-start;justify-content:space-between;gap:9px}.row strong{color:var(--p)}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.action{min-height:42px;border:1px solid #d7cbc2;border-radius:14px;background:#fff;padding:9px 12px;color:var(--p);font-size:11px;font-weight:850}.action.primary{border-color:var(--p);background:var(--p);color:#fff}.action.good{border-color:#99caae;background:#edf9f2;color:#146c43}.action.warn{border-color:#e3c779;background:#fff8dd;color:#72510a}.notice{border-radius:16px;padding:11px 12px;font-size:12px;line-height:1.5}.notice.ok{border:1px solid #9ac8ac;background:#eef9f2;color:#145f3d}.notice.warn{border:1px solid #e1c36c;background:#fff8dd;color:#74520b}.rank{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:8px;border-bottom:1px solid #eee5df;padding:10px 1px}.rank:last-child{border:0}.pos{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;background:#7b132610;color:var(--p);font-weight:900}.points{font-weight:900;color:var(--gold)}label{display:grid;gap:5px;color:#51484a;font-size:11px;font-weight:850}input,select,textarea{width:100%;border:1px solid #d8cdc5;border-radius:14px;background:#fff;padding:11px;color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:#7b132666;box-shadow:0 0 0 3px #7b132612}textarea{min-height:78px;resize:vertical}.form{display:grid;gap:10px}.lit h4{font-family:Georgia,serif;color:var(--p);font-size:19px;margin:15px 0 5px}.lit p{white-space:pre-line;font-size:14px;line-height:1.68;margin:4px 0}.lit .ref{color:var(--gold);font-weight:850;font-size:12px}.profile{display:flex;gap:12px;align-items:center}.avatar{width:62px;height:62px;border-radius:22px;background:#7b132611;overflow:hidden;display:grid;place-items:center;color:var(--p);font-weight:900;font-size:18px;border:2px solid #d4af3760;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.bio{margin-top:10px;border-radius:16px;background:#f8f2eb;padding:11px;font-size:12px;line-height:1.55;color:var(--muted)}.book{display:grid;grid-template-columns:1fr auto;gap:10px}.book a{align-self:center;text-decoration:none}.quizq{margin-top:10px}.option{display:block;width:100%;margin-top:6px;text-align:left;min-height:44px;border:1px solid #ddd1c8;border-radius:14px;background:#fff;padding:10px;color:var(--text);font-size:12px}.option.sel{border-color:var(--p);background:#7b13260b;color:var(--p);font-weight:850}.bottom{position:fixed;z-index:20;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 18px),822px);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;border:1px solid #ded2c8;background:#fffffff3;backdrop-filter:blur(18px);padding:6px;border-radius:22px;box-shadow:0 15px 55px #27101825}.bottom button{border:0;background:transparent;border-radius:15px;padding:8px 2px;color:#76686b;font-size:9px;font-weight:850}.bottom button.on{background:#7b132611;color:var(--p)}.bottom b{display:block;font-size:18px;margin-bottom:2px}@media(max-width:520px){.two,.three{grid-template-columns:1fr}.hero h2{font-size:25px}.card{padding:13px}.app{padding-left:8px;padding-right:8px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><div class="seal">✦</div><div><small>Comunidade Santa Luzia</small><h1>Santa Luzia Offline</h1></div></div><div class="status"><span>📴 <strong>Modo local.</strong> O que já foi sincronizado continua disponível.</span><button class="retry" id="reconectar">Tentar conectar</button></div></header>
<nav class="nav" id="nav"></nav>
<section class="page" id="painel"></section><section class="page" id="liturgia"></section><section class="page" id="equipe"></section><section class="page" id="formacao"></section><section class="page" id="jornada"></section><section class="page" id="escala"></section><section class="page" id="biblioteca"></section><section class="page" id="atrasos"></section>
</main><nav class="bottom" id="bottom"></nav>
<script>
(()=>{"use strict";
const SERVER="https://comunidade-santa-luzia-production.up.railway.app",FALLBACK_SNAPSHOT="santa-luzia:android-offline:snapshot:v1",FALLBACK_QUEUE="santa-luzia:android-offline:queue:v1";
const tabs=[["painel","⌂","Painel"],["liturgia","✝","Liturgia"],["equipe","👥","Equipe"],["formacao","📖","Formação"],["jornada","🏆","Jornada"],["escala","📅","Escala"],["biblioteca","▤","Biblioteca"],["atrasos","⏰","Atrasos"]];
let active="painel",snapshot=null,queueCache=[],liturgiaAtual=null,quizRespostas={};
const nativeStore=()=>window.Capacitor?.Plugins?.OfflineStore||null;
function readJson(k,f){try{const v=JSON.parse(localStorage.getItem(k)||"null");return v==null?f:v}catch{return f}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function isoHoje(){const p=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Cuiaba",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const m=Object.fromEntries(p.map(x=>[x.type,x.value]));return `${m.year}-${m.month}-${m.day}`}
function fmt(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(v||"")))return esc(v||"");const[y,m,d]=String(v).split("-");return `${d}/${m}/${y}`}
function rid(){return crypto?.randomUUID?crypto.randomUUID():`local-${Date.now()}-${Math.random().toString(36).slice(2)}`}
function initials(n){return String(n||"SL").split(" ").filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase()}
async function loadNative(){const p=nativeStore();if(p){try{const[s,q]=await Promise.all([p.loadSnapshot(),p.loadQueue()]);snapshot=s?.snapshot?JSON.parse(s.snapshot):null;queueCache=q?.queue?JSON.parse(q.queue):[];if(!Array.isArray(queueCache))queueCache=[];return}catch{}}snapshot=readJson(FALLBACK_SNAPSHOT,null);queueCache=readJson(FALLBACK_QUEUE,[]);if(!Array.isArray(queueCache))queueCache=[]}
async function saveQueue(){const p=nativeStore();if(p){try{await p.saveQueue({queue:JSON.stringify(queueCache)});return}catch{}}try{localStorage.setItem(FALLBACK_QUEUE,JSON.stringify(queueCache))}catch{}}
async function enqueue(item){queueCache.push(item);await saveQueue();renderAll();}
function session(){return snapshot?.auth?.sessao||null}function user(){return session()?.usuario||snapshot?.ranking?.eu||null}function profile(){return snapshot?.perfil||user()||null}function perfis(){return Array.isArray(snapshot?.perfis)?snapshot.perfis:[]}function formations(){return Array.isArray(snapshot?.formacoes?.formacoes)?snapshot.formacoes.formacoes:[]}function rankings(){return Array.isArray(snapshot?.ranking?.ranking)?snapshot.ranking.ranking:[]}function members(){return Array.isArray(snapshot?.ranking?.membros)?snapshot.ranking.membros:[]}function occurrences(){return Array.isArray(snapshot?.ranking?.ocorrencias)?snapshot.ranking.ocorrencias:[]}function scales(){return Array.isArray(snapshot?.escalas?.escalas)?snapshot.escalas.escalas:[]}function books(){return Array.isArray(snapshot?.biblioteca?.livros)?snapshot.biblioteca.livros:[]}
function navs(){document.getElementById("nav").innerHTML=tabs.map(([k,i,n])=>`<button data-tab="${k}">${i} ${n}</button>`).join("");document.getElementById("bottom").innerHTML=[["painel","⌂","Painel"],["liturgia","✝","Liturgia"],["formacao","📖","Formação"],["jornada","🏆","Jornada"],["atrasos","⏰","Atrasos"]].map(([k,i,n])=>`<button data-tab="${k}"><b>${i}</b>${n}</button>`).join("");document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>setActive(b.dataset.tab))}
function setActive(k){active=k;document.querySelectorAll(".page").forEach(x=>x.classList.toggle("on",x.id===k));document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x.dataset.tab===k));window.scrollTo(0,0);if(k==="liturgia"&&!liturgiaAtual)void loadLiturgia()}
function avatar(p){return p?.foto?`<div class="avatar"><img src="${esc(p.foto)}" alt="" /></div>`:`<div class="avatar">${esc(initials(p?.nome))}</div>`}
function renderPainel(){const p=profile(),u=user(),upd=snapshot?.atualizadoEm?new Date(snapshot.atualizadoEm).toLocaleString("pt-BR"):"ainda não sincronizado",my=String(u?.id||"");const next=scales().filter(s=>String(s.data||"")>=isoHoje()&&Array.isArray(s.pessoas)&&s.pessoas.some(x=>String(x.id||x.usuario_id||"")===my)).sort((a,b)=>`${a.data}${a.horario}`.localeCompare(`${b.data}${b.horario}`))[0];document.getElementById("painel").innerHTML=`<div class="hero"><small>Seu aplicativo continua disponível</small><h2>${esc(p?.nome||"Santa Luzia")}</h2><p>${esc(p?.funcao||session()?.tipo||"Usuário")} · sincronizado em ${esc(upd)}</p></div>${!snapshot?`<div class="notice warn">Este aparelho ainda não recebeu seus dados privados. Conecte uma vez, entre na conta e aguarde a sincronização.</div>`:""}<div class="grid two"><div class="card"><div class="profile">${avatar(p)}<div><h3 style="margin:0">Meu perfil</h3><span class="pill">${esc(p?.funcao||"—")}</span></div></div><div class="bio">${esc(p?.bio||"Adicione uma bio quando estiver conectado para compartilhar algo com a equipe.")}</div></div><div class="card"><h3>Pendências</h3><div class="value">${queueCache.length}</div><p class="muted">Presenças, quiz e relatos feitos offline serão enviados quando a internet voltar.</p></div></div><div class="card" style="margin-top:10px"><h3>Próxima escala</h3>${next?`<h4>${fmt(next.data)} · ${esc(next.horario||"")}</h4><p class="muted">Celebrante: ${esc(next.celebrante||"Não informado")}</p>`:`<p class="muted">Nenhuma próxima escala sincronizada para este perfil.</p>`}</div><div class="notice ok" style="margin-top:10px">🔒 Faltas, advertências, justificativas e observações não são exibidas no modo público nem são copiadas para este núcleo offline.</div><div class="actions"><button class="action primary" data-go="equipe">Ver perfis da equipe</button><a class="action" style="text-decoration:none" href="caminho-da-luz/index.html">Abrir Missão do Altar</a></div>`;document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>setActive(b.dataset.go))}
function renderEquipe(){const ps=perfis();document.getElementById("equipe").innerHTML=`<div class="hero"><small>Perfis públicos</small><h2>Equipe</h2><p>Foto, função, bio e Jornada. Registros administrativos permanecem privados.</p></div><div class="list">${ps.length?ps.map(p=>`<div class="row"><div class="profile">${avatar(p)}<div><strong>${esc(p.nome)}</strong><div class="muted">${esc(p.funcao||"")} ${p.desde?`· desde ${fmt(p.desde)}`:""}</div>${p.ranking?`<span class="pill">${esc(p.ranking.posicao)}º · ${esc(p.ranking.pontos)} pts</span>`:""}</div></div><div class="bio">${esc(p.bio||"Este membro ainda não adicionou uma bio.")}</div></div>`).join(""):`<div class="empty">Perfis ainda não sincronizados neste aparelho.</div>`}</div>`}
function renderFormation(){const me=String(user()?.id||"");document.getElementById("formacao").innerHTML=`<div class="hero"><small>Central de Formação</small><h2>Formação</h2><p>Consulte os encontros e registre sua situação mesmo sem internet.</p></div><div class="list">${formations().length?formations().map(f=>{const pend=queueCache.slice().reverse().find(x=>x.tipo==="formacao-presenca"&&x.formacaoId===f.id);return `<div class="row"><div class="rowhead"><div><strong>${esc(f.titulo)}</strong><div class="muted">${fmt(f.data)} ${f.horario?`· ${esc(f.horario)}`:""}<br>${esc(f.tema||"")}</div></div><span class="pill">${esc(f.status||"agendada")}</span></div>${f.descricao?`<p class="muted">${esc(f.descricao)}</p>`:""}<div class="actions"><button class="action good" data-pres="${esc(f.id)}" data-s="presente">Presente</button><button class="action warn" data-pres="${esc(f.id)}" data-s="falta">Falta</button><button class="action" data-pres="${esc(f.id)}" data-s="justificada">Justificar</button></div>${pend?`<div class="notice ok" style="margin-top:8px">Salvo no aparelho e aguardando sincronização.</div>`:""}</div>`}).join(""):`<div class="empty">Nenhuma formação sincronizada.</div>`}</div>`;document.querySelectorAll("[data-pres]").forEach(b=>b.onclick=async()=>{let justificativa="";if(b.dataset.s==="justificada"){justificativa=prompt("Informe a justificativa:","")||"";if(justificativa.trim().length<3)return}await enqueue({id:rid(),tipo:"formacao-presenca",criadoEm:Date.now(),formacaoId:b.dataset.pres,payload:{situacao:b.dataset.s,justificativa,clientRequestId:rid(),usuarioId:me}})})}
function renderRanking(){const rs=rankings();document.getElementById("jornada").innerHTML=`<div class="hero"><small>Jornada Litúrgica</small><h2>Classificação</h2><p>Último ranking sincronizado. A Missão continua funcionando localmente.</p></div><div class="card"><div class="actions" style="margin-top:0"><a href="caminho-da-luz/index.html" class="action primary" style="text-decoration:none">Jogar Missão do Altar</a><button class="action" data-tab="liturgia">Responder Quiz da Liturgia</button></div></div><div class="card" style="margin-top:10px"><h3>Classificação</h3>${rs.length?rs.slice(0,30).map(r=>`<div class="rank"><div class="pos">${esc(r.posicao||"—")}</div><div><strong>${esc(r.nome)}</strong><div class="muted">${esc(r.funcao||"")}</div></div><div class="points">${esc(r.pontos||0)} pts</div></div>`).join(""):`<div class="empty">Ranking ainda não sincronizado.</div>`}</div>`;document.querySelectorAll('#jornada [data-tab]').forEach(b=>b.onclick=()=>setActive(b.dataset.tab))}
function renderScales(){const ss=scales();document.getElementById("escala").innerHTML=`<div class="hero"><small>Escala sincronizada</small><h2>Escalas</h2><p>Você pode consultar as escalas recebidas mesmo sem conexão.</p></div><div class="list">${ss.length?ss.slice().sort((a,b)=>String(a.data).localeCompare(String(b.data))).map(s=>`<div class="row"><div class="rowhead"><div><strong>${fmt(s.data)} · ${esc(s.horario||"")}</strong><div class="muted">Celebrante: ${esc(s.celebrante||"Não informado")}</div></div><span class="pill">${esc(s.titulo||"Missa")}</span></div>${Array.isArray(s.pessoas)&&s.pessoas.length?`<p class="muted">${s.pessoas.map(p=>`${esc(p.nome||"Membro")}${p.funcao?` — ${esc(p.funcao)}`:""}`).join("<br>")}</p>`:""}</div>`).join(""):`<div class="empty">Nenhuma escala sincronizada.</div>`}</div>`}
function renderBooks(filter=""){const q=filter.trim().toLocaleLowerCase("pt-BR"),bs=books().filter(b=>!q||`${b.titulo} ${b.autor} ${b.categoria} ${b.santo||""}`.toLocaleLowerCase("pt-BR").includes(q));document.getElementById("biblioteca").innerHTML=`<div class="hero"><small>Catálogo local</small><h2>Biblioteca Católica</h2><p>O catálogo abre offline. Para baixar uma obra hospedada externamente, conecte-se à internet.</p></div><div class="card"><label>Pesquisar<input id="bookSearch" value="${esc(filter)}" placeholder="Livro, autor, santo ou tema" /></label></div><div class="list" style="margin-top:10px">${bs.length?bs.map(b=>`<div class="row book"><div><strong>${esc(b.titulo)}</strong><div class="muted">${esc(b.autor)} · ${esc(b.categoria)}</div><p class="muted">${esc(b.descricao||"")}</p></div><a class="action" href="${esc(b.downloadUrl)}">Abrir online</a></div>`).join(""):`<div class="empty">Nenhuma obra encontrada.</div>`}</div>`;const s=document.getElementById("bookSearch");if(s)s.oninput=()=>renderBooks(s.value)}
function renderDelays(){const u=user(),cs=members().filter(m=>String(m.id)!==String(u?.id)),mine=occurrences().filter(o=>String(o.usuario_id)===String(u?.id)||String(o.reportado_por)===String(u?.id));document.getElementById("atrasos").innerHTML=`<div class="hero"><small>Pontualidade</small><h2>Atrasos</h2><p>Reporte um colega offline. O relato só conta depois da confirmação do moderador.</p></div>${cs.length?`<div class="card"><form class="form" id="delayForm"><label>Colega<select id="delayUser">${cs.map(m=>`<option value="${esc(m.id)}">${esc(m.nome)} · ${esc(m.funcao||"")}</option>`).join("")}</select></label><div class="grid two"><label>Data da Missa<input id="delayDate" type="date" value="${isoHoje()}" /></label><label>Horário<input id="delayTime" type="time" value="18:00" /></label></div><label>Observação<textarea id="delayNote" maxlength="300" placeholder="Opcional"></textarea></label><button class="action primary" type="submit">Salvar relato</button></form></div>`:`<div class="empty">Lista da equipe ainda não sincronizada.</div>`}<div class="card" style="margin-top:10px"><h3>Relatos sincronizados</h3>${mine.length?mine.map(o=>`<div class="row"><strong>${esc(o.usuario_nome||"Membro")}</strong><div class="muted">${fmt(o.data_missa)} · ${esc(o.horario_missa||"")} · ${esc(o.status||"pendente")}</div></div>`).join(""):`<p class="muted">Nenhum relato visível no último sincronismo.</p>`}</div>`;const f=document.getElementById("delayForm");if(f)f.onsubmit=async e=>{e.preventDefault();await enqueue({id:rid(),tipo:"atraso",criadoEm:Date.now(),payload:{action:"reportar_atraso",usuarioId:document.getElementById("delayUser").value,dataMissa:document.getElementById("delayDate").value,horarioMissa:document.getElementById("delayTime").value,observacao:document.getElementById("delayNote").value,clientRequestId:rid()}});alert("Relato salvo. Ele será enviado quando a conexão voltar.")}}
function quizFromLiturgia(l){if(!l)return[];const p=l.leituras?.primeiraLeitura?.[0],s=l.leituras?.salmo?.[0],s2=l.leituras?.segundaLeitura?.[0],e=l.leituras?.evangelho?.[0],refs=[p?.referencia,s?.referencia,s2?.referencia,e?.referencia].filter(Boolean),out=[];function opts(correct,others,rot){if(!correct)return null;const base=[correct,...others.filter(x=>x&&x!==correct)].slice(0,3);while(base.length<3)base.push(base.length===1?"Não consta na Liturgia de hoje":"Outra referência");const n=rot%3,it=[...base.slice(n),...base.slice(0,n)];return{opcoes:it,correta:it.indexOf(correct)}}function add(id,q,c,others,rot,pts){const o=opts(c,others,rot);if(o)out.push({id,enunciado:q,...o,pontos:pts})}add("lit-1","Qual é a referência da Primeira Leitura da Liturgia de hoje?",p?.referencia,refs.filter(x=>x!==p?.referencia),1,10);add("lit-2","Qual é a referência do Salmo Responsorial de hoje?",s?.referencia,refs.filter(x=>x!==s?.referencia),2,10);add("lit-3","Qual é o refrão do Salmo Responsorial apresentado na Liturgia de hoje?",s?.refrao,["O Senhor é meu pastor e nada me faltará.","Provai e vede como o Senhor é bom."],1,15);add("lit-4","Qual é a referência do Evangelho proclamado hoje?",e?.referencia,refs.filter(x=>x!==e?.referencia),0,15);add("lit-5","Em qual período litúrgico está inserida a celebração de hoje?",l.tempoLiturgicoAtual,["Tempo do Advento","Tempo Pascal"],2,10);return out}
function renderQuiz(l){const qs=quizFromLiturgia(l),done=queueCache.some(x=>x.tipo==="quiz-liturgia"&&x.payload?.dataIso===isoHoje());return `<div class="card" style="margin-top:10px"><h3>Quiz da Liturgia</h3>${done?`<div class="notice ok">Quiz respondido offline e aguardando sincronização com a Jornada.</div>`:qs.length>=3?`${qs.map((q,i)=>`<div class="quizq"><strong>${i+1}. ${esc(q.enunciado)}</strong>${q.opcoes.map((o,j)=>`<button class="option ${quizRespostas[i]===j?"sel":""}" data-q="${i}" data-o="${j}">${esc(o)}</button>`).join("")}</div>`).join("")}<button id="sendQuiz" class="action primary" style="margin-top:12px;width:100%">Salvar Quiz offline</button>`:`<p class="muted">Não há informações suficientes para montar o quiz desta data.</p>`}</div>`}
async function loadLiturgia(){const root=document.getElementById("liturgia"),iso=isoHoje(),month=iso.slice(0,7);root.innerHTML=`<div class="hero"><small>Conteúdo dentro do APK</small><h2>Liturgia Diária</h2><p>Leituras, orações e Quiz disponíveis localmente.</p></div><div class="card"><p class="muted">Carregando Liturgia local…</p></div>`;try{const r=await fetch(`offline/liturgia-completa/${month}.json`),pack=await r.json();liturgiaAtual=pack?.dias?.[iso]||null}catch{liturgiaAtual=null}if(!liturgiaAtual){root.innerHTML=`<div class="hero"><small>Liturgia</small><h2>Liturgia Diária</h2></div><div class="empty">A Liturgia desta data não está no pacote local.</div>`;return}const l=liturgiaAtual,read=(title,a)=>Array.isArray(a)&&a.length?a.map(x=>`<h4>${esc(title)}</h4><div class="ref">${esc(x.titulo||"")} · ${esc(x.referencia||"")}</div>${x.refrao?`<p><strong>${esc(x.refrao)}</strong></p>`:""}<p>${esc(x.texto||"")}</p>`).join(""):"";root.innerHTML=`<div class="hero"><small>${esc(l.cor||"Liturgia")}</small><h2>${esc(l.liturgia||"Liturgia Diária")}</h2><p>${fmt(iso)} · ${esc(l.tempoLiturgicoAtual||"")}</p></div><div class="card lit">${read("Primeira Leitura",l.leituras?.primeiraLeitura)}${read("Salmo Responsorial",l.leituras?.salmo)}${read("Segunda Leitura",l.leituras?.segundaLeitura)}${read("Evangelho",l.leituras?.evangelho)}${l.oracoes?.coleta?`<h4>Oração da Coleta</h4><p>${esc(l.oracoes.coleta)}</p>`:""}</div>${renderQuiz(l)}`;root.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{quizRespostas[Number(b.dataset.q)]=Number(b.dataset.o);loadLiturgia()});const send=document.getElementById("sendQuiz");if(send)send.onclick=async()=>{const qs=quizFromLiturgia(l),answers=qs.map((_,i)=>quizRespostas[i]);if(answers.some(x=>!Number.isInteger(x))){alert("Responda todas as perguntas antes de salvar.");return}await enqueue({id:rid(),tipo:"quiz-liturgia",criadoEm:Date.now(),payload:{dataIso:iso,respostas:answers,clientRequestId:rid()}});quizRespostas={};alert("Quiz salvo no aparelho. Os pontos serão validados quando a internet voltar.");loadLiturgia()}}
function renderAll(){renderPainel();renderEquipe();renderFormation();renderRanking();renderScales();renderBooks();renderDelays();setActive(active)}
document.getElementById("reconectar").onclick=()=>{location.href=SERVER};navs();loadNative().then(()=>{renderAll();setActive("painel")});
})();
</script>
